<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAYHAWK · 版權二十年的風景</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2640;--gold:#c8a96e;--cream:#faf7f2;--card:#fff;--text:#2c2c2c;--muted:#7a7a7a;--border:#e8e2d8;--tag-type:#3a6186;--tag-genre:#5a7a3a;--tag-growth:#8b3a6b;--tag-era:#a05a20}
body{font-family:'Georgia',serif;background:var(--cream);color:var(--text);min-height:100vh}

/* ── PASSWORD GATE ── */
#gate{position:fixed;inset:0;background:#1a2640;z-index:9999;display:flex;align-items:center;justify-content:center}
.gate-box{background:#fff;border-radius:12px;padding:52px 60px;max-width:400px;width:90%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.gate-logo{color:#1a2640;font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px;font-weight:400}
.gate-sub{color:#c8a96e;font-size:.75rem;letter-spacing:.1em;margin-bottom:36px}
.gate-hint{font-family:sans-serif;font-size:.78rem;color:#888;margin-bottom:10px}
.gate-input{width:100%;padding:12px 16px;border:2px solid #e8e2d8;border-radius:8px;font-size:1rem;text-align:center;letter-spacing:.2em;outline:none;font-family:sans-serif;transition:border-color .2s}
.gate-input:focus{border-color:#1a2640}
.gate-btn{margin-top:14px;width:100%;padding:13px;background:#1a2640;color:#c8a96e;border:none;border-radius:8px;font-family:sans-serif;font-size:.9rem;letter-spacing:.08em;cursor:pointer;transition:background .2s}
.gate-btn:hover{background:#2a3a58}
.gate-err{margin-top:10px;font-family:sans-serif;font-size:.78rem;color:#c0392b;min-height:18px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ── HEADER ── */
header{background:var(--navy);padding:36px 48px 28px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
header h1{color:var(--gold);font-size:1.55rem;letter-spacing:.12em;font-weight:400;text-transform:uppercase;margin-bottom:4px}
header p{color:#a0b0c0;font-size:.82rem;letter-spacing:.06em;font-family:sans-serif}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.stats{color:#7a9ab8;font-family:sans-serif;font-size:.8rem;text-align:right;line-height:1.8}
.stats strong{color:var(--gold)}

/* ── FILTER ── */
.filter-panel{background:#fff;border-bottom:1px solid var(--border);padding:18px 48px;position:sticky;top:96px;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.filter-inner{max-width:1280px;margin:0 auto}
.filter-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-family:sans-serif;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;min-width:58px;padding-top:5px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-family:sans-serif;font-size:.75rem;cursor:pointer;border:1.5px solid transparent;transition:all .18s;user-select:none;white-space:nowrap}
.chip.type  {border-color:#d0dce8;color:var(--tag-type);background:#f0f5fa}
.chip.genre {border-color:#d0dde0;color:var(--tag-genre);background:#f0f6f0}
.chip.growth{border-color:#e0d0dc;color:var(--tag-growth);background:#faf0f6}
.chip.era   {border-color:#e8ddd0;color:var(--tag-era);background:#fdf6ee}
.chip.active{font-weight:600;border-width:2px}
.chip.type.active  {background:#d0dce8}
.chip.genre.active {background:#d0dde0}
.chip.growth.active{background:#e0d0dc}
.chip.era.active   {background:#e8ddd0}
.search-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-row input{flex:1;max-width:300px;padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;font-family:sans-serif;font-size:.82rem;outline:none;background:var(--cream)}
.search-row input:focus{border-color:var(--gold)}
.btn-clear{font-family:sans-serif;font-size:.72rem;color:var(--muted);cursor:pointer;border:1px solid var(--border);border-radius:12px;padding:4px 10px;background:none;transition:all .15s}
.btn-clear:hover{background:var(--cream)}

/* ── YEAR NAV ── */
.year-nav{max-width:1280px;margin:0 auto;padding:20px 48px 0;display:flex;gap:8px;overflow-x:auto}
.year-btn{font-family:sans-serif;font-size:.75rem;padding:4px 12px;border-radius:14px;border:1.5px solid var(--border);cursor:pointer;background:none;color:var(--muted);transition:all .15s;white-space:nowrap}
.year-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.year-btn:hover:not(.active){border-color:var(--navy);color:var(--navy)}

/* ── GRID ── */
.grid{max-width:1280px;margin:32px auto;padding:0 48px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px 26px 20px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.10);transform:translateY(-2px);border-color:var(--gold)}
.card-meta{font-family:sans-serif;font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:10px}
.card-year{background:var(--navy);color:var(--gold);padding:2px 9px;border-radius:12px;font-size:.68rem;letter-spacing:.04em}
.card-title{font-size:1.05rem;line-height:1.55;color:var(--navy);font-weight:600}
.card-summary{font-size:.84rem;color:#555;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-family:sans-serif;font-size:.66rem;font-weight:500}
.tag.type  {background:#e8f0f8;color:var(--tag-type)}
.tag.genre {background:#e8f2e8;color:var(--tag-genre)}
.tag.growth{background:#f8e8f4;color:var(--tag-growth)}
.tag.era   {background:#fdf0e4;color:var(--tag-era)}
.growth-flag{font-family:sans-serif;font-size:.7rem;color:var(--tag-growth);border-left:3px solid var(--tag-growth);padding-left:8px;line-height:1.5;margin-top:2px;font-style:italic}
.no-results{grid-column:1/-1;text-align:center;padding:60px;font-family:sans-serif;color:var(--muted)}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(10,15,25,.7);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 24px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;max-width:780px;width:100%;padding:44px 52px;position:relative;margin:auto}
.modal-close{position:absolute;top:18px;right:22px;font-size:1.4rem;cursor:pointer;color:var(--muted);border:none;background:none;font-family:sans-serif}
.modal-close:hover{color:var(--navy)}
.modal-meta{font-family:sans-serif;font-size:.75rem;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal-title{font-size:1.45rem;color:var(--navy);line-height:1.45;margin-bottom:16px}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.modal-summary{background:var(--cream);border-left:4px solid var(--gold);padding:14px 18px;margin-bottom:20px;font-size:.88rem;line-height:1.75;color:#444;border-radius:0 6px 6px 0}
.modal-growth{background:#fdf5fb;border-left:4px solid var(--tag-growth);padding:12px 16px;margin-bottom:24px;font-family:sans-serif;font-size:.82rem;line-height:1.65;color:var(--tag-growth);border-radius:0 6px 6px 0}
.modal-growth strong{display:block;margin-bottom:4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.modal-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.modal-body{font-size:.92rem;line-height:2;color:var(--text);white-space:pre-wrap;max-height:52vh;overflow-y:auto;padding-right:8px}
.modal-body::-webkit-scrollbar{width:5px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

  <div class="gate-box">

    <input class="gate-input" type="password" id="pw" placeholder="請輸入密碼" maxlength="20"
           onkeydown="if(event.key==='Enter')check()">

<!-- MAIN CONTENT (hidden until unlocked) -->
<div id="main" style="display:none">

<header>
  <div class="header-inner">

      <h1>GRAYHAWK · 版權二十年的風景</h1>

    <button class="modal-close" onclick="closeModalBtn()">✕</button>

    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-tags" id="modal-tags"></div>

<script>
// ── Password ─────────────────────────────────────────────────────────────────
function check(){
  const v = document.getElementById('pw').value;
  if(v === '29042606'){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    init();
  } else {
    document.getElementById('err').textContent = '密碼錯誤，請再試一次。';
    const inp = document.getElementById('pw');
    inp.value = '';
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
  }
}

const ARTICLES = [{"title": "學運，羊毛記，我們家", "date": "2014-03-26", "year": 2014, "body": "星期一凌晨四點，起床開手機上網，看到的全是暴力鎮壓學運的事情。那天公司的氣氛很低迷，我一整天的心情也很低落，覺得外頭發生的那麼大的事，自己還在電腦前寫什麼倫敦書展重點書的信，弄合約追封面查付款，簡直是荒謬到超現實了。有種很深很深的無力感，不知道自己能做什麼，對自己的工作產生了懷疑。\n\n中午的時候，看到鸚鵡螺文化的宗琛 po 了一張抗議份子被打得頭破血流的照片，說這就是「羊毛」，透過媒體的力量，蒙上你的眼睛。「這種題材，美國人只不過拿來寫了一本科幻小說，我們的政府玩真的。」看到這段，我好像醒了過來。一種從昏迷或者麻木之中逐漸恢復意識和痛感的甦醒。是了，這就是我工作的意義：在「好看」的大眾娛樂小說和一些更深刻的什麼之間尋找一種平衡。把外國的好書帶進來，然後，把我們的好書帶出去。\n\n上星期法國一家大出版社給我寫信，說想要出版中國青年小說家顏歌的《我們家》。代理這本書的因緣際會也很奇妙。早在八年前剛認識老婆（當時還不是老婆）的時候，就聽她說過顏歌這個名字，她還編過顏歌的一本小說《異獸志》。兩年前北京著名的策展人歐寧來台北，到我們公司聊了很久，說起顏歌的新長篇（當時還不叫《我們家》，叫做《段逸興的一家》，讚不絕口，說那是方言寫作的一大勝利，也是她真正蛻變為成熟小說家的里程碑。\n\n去年六月，我特地請老婆幫忙訂了一本樣書帶來台灣，但也一直沒空看。沒想到八月就收到她的信，說經過譯者 Nicky Harman（就是《金山》的英譯者）介紹，想找我代理，而且 Nicky 已經翻譯好精彩的英文樣章，也寫了一篇審讀報告。我連忙翻出樣書，週末一口氣讀完，喜歡極了，當下就決定來推這本書的版權。\n\n法蘭克福書展上，我們向很多外國出版社介紹這本小說，也確實有不少人登記興趣，可是版權輸出往往需要一個契機，比如說某一個國家先簽下了，或者有一個重大事件發生了。總得先有星火，然後才能燎原。難就難在你永遠不知道這個星火何時才能點燃。你只能盡一切的努力，用所有的管道和資源和人脈去推薦，讓資訊盡可能地擴散和傳播出去，然後祈禱某天一切都對了，天時地利人和，when the stars are right，就引爆了。\n\n有了法國出版社簽約的意向，我隱約覺得是個契機，便重新整理了書訊，發給各國代理，同時也發給書探（這是從 出版經紀及版權人才研習營 的課程裡學來的，所以我可以證明這活動真的有用！）。短短一個小時內，有三位很重量級的英美書探便回信說他們很喜歡這本書。品味極好向來對文字非常挑剔的美國經紀人朋友，讀了以後也愛不釋手，同意幫我代理美國版權。\n\n三天後，匈牙利的老牌文學出版社 Europa 提出 offer，簽下了這本書全球第一筆外語版權。匈牙利！\n\n昨天下班前，德國 Heyne 出版社編輯 Anke Goebel 打了越洋電話過來，，說她和同事看了《我們家》的英文樣章，都非常喜歡，覺得很快就能進入故事，主角很爆笑很有趣，會吸引人往下看，考慮想要 pre-empt 搶下德文版權。我問她從何得知這本書，她說先是上週書探推薦，又從我的德國代理那邊收到資料，然後笑說：「哼，你當初就是這麼計畫的對吧？」\n\n我和 Anke 是在 2010 年法蘭克福書展的版權研習營（Fellowship）認識的。當年她剛辭去原本出版社的工作，搬到慕尼黑加入藍燈書屋集團旗下的 Heyne 出版社。這幾年來我們常在書展上或者聚餐場合見面，最常聊的是情色小說，因為她也是德文版《謎情柯洛斯》的編輯。\n\nHeyne 是德國最厲害的平裝書出版社之一，主力是各種犯罪驚悚小說和奇幻科幻小說，當然也有女性小說和羅曼史。姊妹品牌 Diana 則是精裝主力，是所謂的「高端大眾文學」（upmarket）出版社，也就是說不那麼純文學，但也不是純粹的通俗小說。《我們家》可說是正好落在他們的守備範圍：有純文學的語言和質地，又有大眾小說的閱讀趣味。\n\n兩小時之後，她果真發來報價，而且是一個很棒的報價。要知道德國雖然是歐洲最大也最活躍的翻譯書市場，但始終鮮少出版中國文學（台灣就更不用說了），唯獨偏愛中國異議或流亡人士的各種自傳或回憶錄。我經手過的海外授權有二十幾國，往往只有德國缺席。\n\n臨睡前和德國代理通完電話，確定接受 Heyne 的報價，興奮之餘也再三感嘆做中書外譯的有心栽花和無心插柳。那是多少的漫長等待，多少的煞費苦心而徒勞無功，但或許或許，你在這裡彎腰播種的，終會在別處含笑收割。\n\n所以，請所有的創作者，繼續寫吧！寫下島內或者島外的故事，寫下屬於我們的獨一無二的故事，然後，我會讓他們被世界看到。", "summary": "太陽花學運期間，在社會動盪帶來的無力感中重新確立出版工作的意義。同步記錄中國小說家顏歌《我們家》的版權輸出歷程，相繼賣出法國、匈牙利、德國版權。", "tags": {"type": ["個人隨筆"], "genre": ["文學小說"], "growth": ["工作意義", "情感流露", "世界觀察"], "era": ["版權輸出", "台灣社會事件"]}}, {"title": "如果在未來，一座地下碉堡：《羊毛記》", "date": "2013-05-05", "year": 2013, "body": "版權書訊>文學類>科幻小說\n\nWOOL by Hugh Howey 版權狀況：已售出繁簡中文版權\n\n這幾年電子書在美國呈爆炸性成長，最大的推手自然是亞瑪遜。藉由賠錢賣書的策略，他們成功換取 Kindle 閱讀器普及率迅速成長，稱霸了電子閱讀器市場。現在美國暢銷新書的電子版銷量，已經可以佔總銷量的二到三成。\n\n除了販售紙本書的電子版，亞瑪遜也積極介入出版，設計出方便好用的電子出版機制（KDP, Kindle Direct Publishing），鼓勵素人作家直接出書。過去自費出版還得花錢印書，成本高昂，後來雖有 POD（Print on Demand, 按需印書）科技大幅減少先期的印製成本，但還是比不上直接出電子書免費又迅速。\n\n於是我們聽到越來越多被出版社和文學經紀人拒於門外的作家，靠著電子書累積口碑和人氣，加上適當的網路行銷，創造了十幾萬冊的驚人銷量，再反過來高價賣出紙本版權，一齣齣有如美國夢的成功故事。比如說伯伊德．莫理森把《方舟浩劫》放在網站上讓人免費下載，若是讀了喜歡，可再用非常低廉的價錢去亞瑪遜買 Kindle 版以表支持，結果一炮而紅，如今這本書已經被翻譯成二十餘種語言，在全球各地出版。\n\n不過那已經是 2009 年的「陳年往事」。免費下載在當年是新穎的促銷手段，現在則已經成為 KDP 機制的一環。只要作者透過亞瑪遜獨家出版（即參與他們的 KDP Select 計畫），就能擁有五天讓書「免費」的權力，而如何把這消息有效傳遞給潛在讀者，更是一門學問。\n\n各種 Kindle 選書網站於是應運而生，每天發佈免費電子書消息，並做初步的篩選和推薦。如果能被這些網站報導，一本書的下載次數立刻水漲船高。除此之外，亞瑪遜獨家出版的電子書，還能讓所有的付費高級會員（Prime Member）租借，作者收入則經由借閱次數來計算。\n\n原創電子書最受讀者歡迎的不外兩個類型：犯罪驚悚和女性小說。前者發展最成熟、也最能夠男女通吃，後者則針對原本就是小說閱讀主力的女性族群，大致還可以分為兩大類，一是《姊妹》或茱迪．皮考特式的「讀書會小說」，較偏向主流/女性小說；二當然就是羅曼史，不論是超自然系、歷史系還是更重口味的情色小說（例如最近爆紅的「格雷的五十道陰影」三部曲）。\n\n但是為何沒有科幻/奇幻小說經由電子書走紅的例子？按理說，科幻讀者對新科技的接受度應該最高，早就應該人手一台 Kindle、智慧型手機或平板電腦，絕對也願意看/買電子書，難道說科幻/奇幻讀者只買已經有紙本書的電子版，沒有「冒險精神」嘗試原創電子書，甚或其中沒有值得一看的作品嗎？\n\n這個問題，終於隨著休豪伊的《羊毛記》而得到解答。此君現年三十七歲，當初也被出版社和文學經紀人拒於門外，遂走上自費出版一途。2011 年七月，他發表了一個中短篇（novelette, 比「中篇小說」novella 更短，但比短篇小說長，是科幻雜誌界常用的一個單位），叫做〈羊毛〉（Wool）。\n\n這個故事僅一萬兩千字，設定在未來，由於地表滿目瘡痍，毒氣瀰漫，人類早已避居地底，開鑿出有如蟻穴般的巨大地堡（silo），共有一百多層，裡面分工嚴密，有警察、有維持發電機運轉的技工、有負責網路資訊的 IT 部門，有透過生長光種植蔬果的農業部門。因為資源有限，地堡裡只能維持固定人數，若沒有人死，任何夫妻都不能生小孩，而且誰生還要經由樂透式的抽籤來決定。\n\n地堡裡最大的禁忌，就是不能談論任何與「出去」有關的事，這比欺君犯上還要嚴重，結果是唯一死刑，處刑的方式就是把罪犯送出地堡。送出去幹嘛？答案是「清掃」（cleaning），因為地堡最頂樓有監視外界的攝影機，長年飽經風沙，需要有人出去清掃。死刑犯會穿上最先進的防護衣，手持羊毛刷子，外出擦拭攝影機鏡頭。由於空氣中的毒素太強，任何防護衣都撐不了多久，所以這些清掃工通常走不了多遠就會死亡。\n\n〈羊毛〉的主角是地堡中維持秩序和法律的警長霍斯頓（Holston）。小說一開頭便描述他步履沉重地走上一層層螺旋梯，來到警長辦公室，直接走進牢房，把自己上鎖，然後把鑰匙交給副警長，說自己要出去。霍斯頓為什麼要出去？因為他的妻子愛莉森三年前突然發瘋，嚷著要出去，他身為警長，只得親自執行妻子的死刑。三年來他時時刻刻都在思索妻子發瘋的原因，不分晝夜研究愛莉森生前最後的文件，發現了驚人的秘密，於是決定跟隨她的腳步。碉堡外面究竟是什麼模樣？這一切究竟是真實還是謊言？小說從霍斯頓走向死亡開頭，以他走出碉堡，終於在毒氣中倒下結束。\n\n豪伊寫這個故事，原本只是為了哀悼親人的死亡，沒有多加宣傳，更沒有考慮過要寫成系列。他的寫作主力還是「茉莉．費德歷險記」（Molly Fyde），一系列描述少女茉莉繼承了老爸的太空船，在星際中到處闖蕩的長篇小說，目前已出版了兩部。但是「羊毛」這個設定顯然有太多故事可說，字裡行間濃濃的哀傷色彩讓人讀後難忘，希望/絕望的反差更引人深思。〈羊毛〉逐漸在讀者群中流傳開來，很多人寫書評讚揚，更多人跑去豪伊的網站留言，喊著要看續集。\n\n在讀者的敲碗聲中，豪伊終於在四個月後推出續集〈標準規格〉（Proper Gauge），長度整整增加一倍，接近兩萬四千字。這次的主角換成地堡的「市長」瑪莉．強斯（Marie Jahns）和副警長馬涅斯（Marnes），他們為了尋找霍斯頓的繼任者，從碉堡頂樓走到最底層的機械部，探訪一個性格強悍又聰穎過人的女子茱莉葉。碉堡共分三區，每區四十八層樓，總共一百四十四層樓。這對一般人來說或許不是什麼大問題，但對年過六十的老市長和副警長來說，可就是一場漫長的旅途了，更何況下樓之後還得上樓。\n\n從水平到垂直，〈標準規格〉把文學中的「旅行」做了九十度的翻轉，帶領讀者進入碉堡深處，仔細觀察其中自成一格的運轉機制，也瞥見了危機四伏的政治暗流，在揭露謎底的同時拋出更多問題：為何茱莉葉年紀輕輕便離開醫生父親，隻身前往底層的機械部，而且二十年來不曾和父親見面？控制網路資訊的 IT 部門主管伯納德（Bernard）為何不等市長命令，便擅自決定要另找警長的繼任人選？馬涅斯為何甘願多年來屈居副手，從來不想擔當警長大任？他和瑪莉死去多年的丈夫又有什麼關係？\n\n〈標準規格〉寫兩個老人上下樓梯的旅行，簡直與所有暢銷書法則背道而馳，但寫得好看極了。豪伊的文字細膩而優美，步調沉緩，心理刻畫深入，且擅用文學隱喻的技巧。比如說書名「羊毛」有三重意思，表面上當然是指清潔者的羊毛刷，但也暗指英文諺語中「眼睛蒙上羊毛」（類似中文「掩耳盜鈴」），更象徵地堡中人有如一群乖巧的綿羊，成群結隊被人趕來趕去，沒有獨立思考的意志。豪伊認為自己的作品不著重科學，與其說是科幻，更像是「未來小說」（future fiction），關注的仍然是人性，而「羊毛」系列濃厚的文學性，灰暗中仍有希望的末世色彩，也讓人想起麥卡錫的《長路》。\n\n但就在你沉浸於豪伊文字魅力的時候，他往往不動聲色讓故事來個大轉彎，讓讀者屢屢目瞪口呆。〈標準規格〉以茱莉葉修復發電機，同時決定接任警長一職作結，但另一個更大的陰謀才要展開（在此就不爆雷了），讀者完全想不到會如此收場，恨不得立刻看到後面的故事。\n\n豪伊似乎也寫出興致了，他火力全開，兩週後再推第三集〈放逐〉（Casting Off），長度兩萬八千字，由年輕的警長茱莉葉挑大樑，「羊毛」的故事這才算進入主線。她一邊要偵辦某重要人物的死亡疑雲，一邊要適應地堡頂部截然不同的生活，同時試圖找出驅使霍斯頓夫妻選擇死亡的真相。男主角魯卡斯（Lukas）也初次登場，他每天晚上到餐廳看星星，透過外部攝影機傳進來的螢幕，勾勒天空星座移動的軌跡，與大他十歲的茱莉葉發展出一段隱約的曖昧情愫。\n\n2011 年十二月初，豪伊發表第四集〈崩解〉（The Unraveling），長度三萬八千字。今年一月，他出版完結篇〈漂流〉（The Stranded），已是近六萬字的完整長篇。除了各集單獨販售，他還推出合訂本，五集總長十五萬字，完全就是一部大長篇的架構，Kindle 版僅售 6.99 美金。\n\n三月二日，超人氣部落格BoingBoing刊出《羊毛記》短評，正式引爆此書的全球熱潮，不僅當場把它送上亞瑪遜電子書總榜 #62，科幻類冠軍，甚至擊敗喬治馬汀的《與龍共舞》。到目前為止，《羊毛記》已經累積了七百多篇亞瑪遜讀者書評，五顆星評價比例高達 95%，而且依然高居科幻類排行榜前五名，可謂史無前例。\n\n網路爆紅當然引來了傳統出版界和電影圈的關注。這時，一位女性讀者把〈羊毛〉推薦給女兒，女兒在一家文學經紀公司上班，專門負責處理合約，她讀了以後非常喜歡，立刻推薦給老闆。她就是新生代文學經紀人克莉絲汀．尼爾森（Kristin Nelson），旗下作家包括《悲喜邊緣的旅館》傑米．福特、《神偷少女》艾莉．卡特和《印度生死戀》雪麗．湯瑪斯。\n\n尼爾森簽下豪伊的代理權後，把《羊毛記》發給美國各大出版社，得到的回應卻令人啼笑皆非。有人覺得這書已經賣得很好，所有想看的人都買了，所以出紙本書不會賣。有人覺得可以一試，但書名一定要改，因為叫「羊毛」太奇怪。還有人說書中主角一直死太詭異了（是沒看過《冰與火之歌》嗎？）。有幾家出版社開價想買，但預付版稅連豪伊賣電子書所得的三分之一都不到。\n\n曾經豪伊也和其他初出茅廬的作者一樣，千方百計想得到這些編輯的青睞，如今他卻發現自己根本不需要他們，因為他已經有了一群忠實的讀者，而讀者的口碑正是最強有力的廣告。\n\n有科幻作家/部落客撰文分析《羊毛記》的成功原因，認為它回歸了科幻小說最初的形式，那就是上世紀初刊登在廉價雜誌的中短篇作品。由於定價低廉、長度適中，讀者很快就能看完〈羊毛〉，而且覺得錢花得很值得。比起同樣 0.99 美金，可是買到十萬字的長篇垃圾，看一個中短篇顯然更讓人開心。豪伊逐步揭露謎團，安排更多的情節轉折，吸引讀者進入地底碉堡世界，事後看來是極其高明的行銷手法，實際上卻是無心插柳，因為他根本沒有想過要寫系列。\n\n我在收到書稿的當天就看完了〈羊毛〉，隔天陪老婆外出上課，我就窩在附近的肯德基，花了四個多小時一口氣〈標準規格〉和〈放逐〉，只能用無比震撼和欲罷不能來形容。閱讀過程中我不時覺得這是了不起的文學作品，不只是類型趣味，同時腦中又不斷浮現「陰屍路」和「Lost 檔案」等影集，以及「異塵餘生」（Fallout）的遊戲畫面。\n\n當科幻雜誌逐漸凋零，中短篇小說的發表園地是否會轉移到電子書？這還有待時間的檢驗，不過，至少現在我們有《羊毛記》這樣的好作品可讀，還有豪伊這樣認真努力的好作家可以期待。除了「茉莉．費德」和《羊毛記》系列，他還有另一部科幻長篇《回家途中》（Half Way Home），堪稱是《蒼蠅王》碰上「異形」，已經引起多家電影公司興趣，上週又得到 BoingBoing 部落格推薦，衝上亞瑪遜科幻榜前二十名。\n\n2013 年初，Simon & Schuster 破天荒以六位數重金買下《羊毛記》紙本版權，把電子版權留給豪伊。這在出版史上堪稱前所未見，因為歷來所有自費出版走紅的電子書，倘若重金賣給傳統出版社，絕對是紙本和電子版打包，傳統出版社不可能接受只拿紙本書的條件（因為電子書利潤更高）。說到頭來，S&S 終究是明白了《羊毛記》的市場價值，即便僅出版紙本書，依然能為公司賺進可觀利潤。此舉等於也為出版界立下先例，未來自費出版走紅的獨立創作者將有更大的談判空間，決定是否要走傳統出版的路，抑或堅守純粹的獨立出版。\n\n今年三月，好萊塢大導演雷利史考特與福斯影業聯手買下《羊毛記》電影版權，準備交由「辛德勒的名單」金獎編劇史蒂芬柴里安改編。紙本版在美國和英國盛大推出，推薦者名單一字排開更是嚇死人：有《別相信任何人》的 SJ 華森、《波西傑克森》系列的雷克萊爾頓、還有《末日之旅》的作者加斯汀柯羅寧。截至目前為止，《羊毛記》英文版銷量已經超過 600,000 冊，其中六成以上是電子書，並已賣出全球 22 國版權。", "summary": "介紹美國自出版成功案例《羊毛記》（WOOL），探討電子書革命與亞馬遜崛起，以及自出版作者如何打破傳統出版業生態的現象。", "tags": {"type": ["書介/書訊"], "genre": ["科幻"], "growth": ["產業洞察"], "era": ["電子書革命", "出版業轉型", "版權輸入"]}}, {"title": "紐約移民的魔幻寓言：《魔像與精靈》", "date": "2013-04-01", "year": 2013, "body": "版權書訊>文學類>文學/奇幻小說\n\nTHE GOLEM AND THE JINNI by Helene Wecker \n\n《魔像與精靈》是今年五月即將在美國出版的新人小說，作者巧妙融合了魔幻寓言、移民文學、歷史小說等元素，敘述一個來自波蘭猶太人社群的魔像（golem）和一個曾經活躍於古老敘利亞、卻因故被囚禁在瓶子裡的精靈（jinni），因緣巧合來到十九世紀末的紐約，被迫加入這個民族的大熔爐，同時又要掩人耳目，以免自己的真實身份被發現。\n \n\n我最早是在兩年前接到這本書的消息，那是 2011 年倫敦書展的前夕。美國知名文學經紀人山姆．史托洛夫（Sam Stoloff）挾著前一年《魔法覺醒》的賣座氣勢，再次推出同樣兼具主流文學和幻想類型的特質的人小說《魔像與精靈》，當時這本書尚未完工，只有一百多頁的稿子，但已經在國際出版圈內引起話題。\n\n一轉眼兩年過去，《魔像與精靈》已賣出英國、德國、法國、荷蘭、義大利、波蘭、挪威、以色列和土耳其版權，被出版者週刊選為 2013 年春季最值得期待的新人作品之一，同時也獲選獨立書商協會五月 #2 IndieNext 選書和亞瑪遜四月編輯嚴選推薦。業界紛紛以《夜行馬戲團》和《英倫魔法師》等書來形容這本書的跨界魔幻魅力。我則是想到了《美國眾神》的舊世界神話與新世界「適應不良」所衍生出的精彩戲碼，還有《卡瓦利與克雷的神奇冒險》的紐約移民夢。\n \n\n故事中的魔像叫做莎瓦（Chava），主人是波蘭小城的商人之子，這位紈褲子弟在雙親過世之後沒多久便散盡為數不多的家財，又因為長相其貌不揚，想找老婆也徒勞無功。於是他帶著最後的財產去找森林裡一位惡名昭彰的隱士，請他施展猶太教的卡巴拉秘術，創造出一名女性魔像當他的妻子，並且打算帶著魔像遠走高飛，搭船到美國去。\n \n\n莎瓦的主人在航行途中忍不住想看看自己的「妻子」是什麼模樣，便在陰暗隱密的貨艙裡，依照隱士的指示，唸出啟動魔像的咒語，不料他隱忍多日的腹痛在這時發作，醫生診斷後發現是盲腸炎，當即開刀，卻來不及拯救他的性命。這個倒楣的傢伙還沒機會和魔像講上幾句話，就這麼魂歸西天了。\n \n\n魔像最初被創造出來的目的就是為主人服務，她才來到世上幾分鐘，居然就沒了主人，頓失所依的魔像空有女人的外表，卻不知要如何生存下去。她更發現自己具有心靈感知能力，能夠「共感」周遭人類的心思，因此船艙裡人們的各種慾念如潮水般向她湧來，險些就要把她淹沒。\n \n\n就在這時，船隻駛抵紐約，眾人皆須先登上埃利斯島（Ellis Island），接受海關查驗，同時通過體檢，方得以進入紐約。魔像既無船票（當初她是被主人裝在大箱子裡運上船的），又「死了老公」，船上眾人面面相覷，不知該拿她怎麼辦才好。魔像靈機一動，隨即縱身跳入海中，就這麼沿著海底一路走進紐約...\n \n\n精靈叫做阿瑪德（Ahmad），是誕生於火與沙的神祕種族，能夠任意改變形貌，甚至進入人類的夢境。他的故鄉是古老的敘利亞，精靈和人類維持著一種微妙的共生關係。阿瑪德最後的記憶，是自己暗中尾隨一組人類商隊，聽他們入夜扎營後的漫談與歡笑。當他再次醒來，竟然已經是千年以後，自己被生鐵禁錮於人形，關在一只黃銅瓶中，若不是因為錫匠阿比利受託修復這個「祖傳」的瓶子，也不會意外敲開瓶蓋，釋放阿瑪德。\n \n\n莎瓦和阿瑪德就這麼被困在世紀之交的紐約。莎瓦被一名年邁的猶太拉比梅爾收留，阿瑪德則寄居於錫匠阿比利的工作坊。他們既要想辦法融入人群，又不能讓人發現自己的真實身份。伴隨他們的是移民社群裡形形色色的人物：睿智的咖啡館老闆娘、獨來獨往的冰淇淋販子、梅爾拉比那經營猶太收容所的姪子麥可，充滿冒險情懷的社交名媛蘇菲雅，還有野心勃勃的神祕男子約瑟夫。\n \n\n魔像與精靈在這個風華正盛的歷史舞台上巧遇，各自背負著詛咒和苦難，在這片新天地裡尋找希望和容身之處。一場世紀風暴隱隱成形，即將改變所有紐約客的命運，也逼使莎瓦和阿瑪德做出最艱難的抉擇......（英文，精裝，Harper，0062110837，496pp，4/13）", "summary": "介紹奇幻新人小說《魔像與精靈》，以十九世紀末紐約為背景，融合猶太與阿拉伯神話，探討移民身份認同。書還未出版即受矚目。", "tags": {"type": ["書介/書訊"], "genre": ["奇幻", "文學小說"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "生與死的最短距離：《惡女心事》", "date": "2013-03-28", "year": 2013, "body": "版權書訊>文學類>懸疑小說\n\nRECONSTRUCTING AMELIA by Kimberly McCreight 版權狀況：已售出繁體中文版權\n\n《惡女心事》是 2013 年春季最受矚目的心理懸疑小說，書還沒出版，便被《娛樂週刊》譽為是「今年的《控制》（Gone Girl）」，而且「肯定要名列年度好書之林」。這本書是金柏莉．麥克雷的第一部小說，2012 年倫敦書展前夕引起國際矚目，在文學經紀人瑪俐．盧索夫（Marly Rusoff）的操盤下，由 HarperCollins 編輯總監克萊兒．魏可丹（Claire Wachtel）以超過五十萬美金的高價簽下，集團總裁強納森．伯恩罕（Jonathan Burnham）讀過書稿更是愛不釋手，還曾親自致電作者，最終促成這筆交易。\n\n魏可丹不僅是丹尼斯．勒翰等天王級作者的御用編輯，更是《別相信任何人》在美國大賣的幕後推手。她將《惡女心事》列為今年四月的精裝小說重點書，認為此書結合了茱迪．皮考特的道德議題和塔娜．法蘭琪的文學懸疑特色。海外版權也已經賣出英國、德國、巴西、法國、韓國、台灣等國。\n\n《惡女心事》一開始，單親媽媽凱特正在開一場重要的業務會議。她是紐約著名大律師事務所的律師，為了爭取難纏的客戶傷透腦筋。就在會議進行不順，對方面露不悅之色的時候，秘書居然進來通知凱特，她有一通非接不可的電話。這通電話來自女兒艾梅麗雅的學校，校長表示她犯錯被停學，請凱特立刻去學校接她。凱特情非得已，只好倉皇離開會議，搭地鐵趕往女兒位於布魯克林的高級私立學校。這所學校素以學風自由著稱，甚至沒有必修必選的課程，而女兒向來也循規蹈矩，愛看書也愛運動，怎會闖下如此大禍？\n \n\n等凱特好不容易趕到學校，卻只見警車、救護車、消防車擠滿現場，並得知女兒墜樓身亡，校方說她英文課報告作弊被逮，因此畏罪自殺。\n \n喪禮過後一個月，凱特無法面對獨守空屋的寂寞，決定重回職場，不料就在她剛進到辦公室後不久，她收到一則匿名的手機簡訊：「艾梅麗雅沒有跳樓。」\n \n\n這則簡訊有如青天霹靂，把凱特從喪女的哀傷之中拉回現實，正視女兒死亡的諸多疑點。艾梅麗雅從小嗜讀成性，尤其喜歡維吉尼亞．吳爾芙，《燈塔行》一書她讀了不下十遍，以此為題寫報告，怎會需要作弊？更何況英文老師還是她的偶像！警方說艾梅麗雅留下遺書，以此作為自殺的證據，但那只不過是樓頂潦草的一句「對不起」，連字跡都未必是她的。\n \n\n凱特解開女兒 iPhone 的密碼，發現幾千條簡訊，而其中往來最頻繁的，就是一名謎樣的男孩「班」，兩人幾乎每時每刻都在互傳消息，但這個遠在上紐約州鄉下的男孩，與女兒的死究竟有什麼關連？\n \n\n本書作者金柏莉．麥克雷以雙線並行的手法，一邊寫凱特調查女兒死亡的謎團，一邊回到事發之前幾個月，從艾梅麗雅的觀點闡述真相，同時摻雜簡訊、email 和臉書動態，拼湊出一幅令人戰慄的圖像。\n \n\n艾梅麗雅的書桌抽屜裡，為何塞滿了二十幾張筆跡各異的字條，上面都寫著恐怖的「我恨你」？她在死前不久反覆追問自己的爸爸是誰，究竟是單純好奇，還是背後有不為人知的壓力？據說學校裡有兩大秘密結社，分別是女生的「喜鵲幫」（The Magpies）和男生的「狼頭會」（Wolf Head），他們有著何等惡意妄為的入會儀式，年復一年讓新生苦不堪言，卻依然奉命行事，只因為不敢面對隨抗命而來的全面霸凌？\n \n\n麥克雷自己就住在布魯克林，她雖然有著幸福的婚姻和兩名健康快樂的孩子，但每回她在街頭目睹警車或救護車，仍難免心跳加快，害怕意外與自己的骨肉有關。當她一次次讀到正值青春年華的孩子選擇結束生命，而關愛他們的親友就在身旁，卻完全無能為力，甚至絲毫不察情況有異，她決定以此為題，寫下「惡女心事」這部小說，探討成長與背叛、秘密初戀和變質的友情，以及校園霸凌（英文，精裝，Harper，ISBN: 006222543X，400pp，4/13）。", "summary": "介紹心理懸疑小說《惡女心事》，以母親調查女兒自殺真相為主線，融合社群媒體霸凌議題。出版前已被譽為「今年的《控制》」，售出繁體中文版權。", "tags": {"type": ["書介/書訊"], "genre": ["懸疑/驚悚"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "一封寫給奇幻冒險故事的情書：《戰龍之途》", "date": "2013-01-15", "year": 2013, "body": "本文為《戰龍之途》中文版導讀（奇幻基地，1/29/2013 出版）\n\n如果奇幻文壇是一座學校，丹尼爾‧艾伯罕肯定是個品學兼優的模範生。這位住在新墨西哥州的寫作者過去六年間出版了十二本長篇小說，橫跨史詩奇幻、都會奇幻和太空歌劇等類型，同時還寫短篇、漫畫劇本，甚至「偷偷」寫了三本犯罪小說。他的產量雖大，品質卻一點也不馬虎，不論是挑戰類型或向傳統致敬，獨立創作或與人合寫，都游刃有餘，也因此贏得讀者和評論家的一致喜愛。\n\n不同於布蘭登‧山德森或派崔克‧羅斯弗斯以長篇迅速成名，艾伯罕走的是幻想文類的老路：參加寫作班、從雜誌投稿短篇開始累積經驗，練筆十年後才年出版第一部長篇《夏日的身影》（A Shadow in Summer），與其後《冬日的背叛》（A Betrayal in Winter）、《秋日的戰火》（An Autumn War）和《春日的代價》（The Price of Spring）合稱「漫長的代價」四部曲（The Long Price Quartet）。這套書算是他對史詩奇幻的一次反叛：背景設定饒富東方色彩（而非傳統的中古歐洲），篇幅精簡（每本僅三百頁）、故事各自獨立、重視人物刻畫，與市面上其他作品相比，更顯得寧靜內斂，詩意盎然\n\n同時，艾伯罕還用漢諾瓦（M.L.N. Hanover）的筆名都會奇幻系列「黑太陽的女兒」（The Black Sun’s Daughter），又與喬治‧馬汀的助理合作，以詹姆斯‧柯瑞（James S. A. Corey）的筆名發表科幻小說「蒼穹無盡」（The Expanse），首部曲《巨獸甦醒》（Leviathan Wakes）便獲得雨果獎和軌跡獎雙料提名。\n\n「刀光錢影」是艾伯罕構思多年的作品，靈感來自多年前的一次作家對話。他和同樣住在新墨西哥州的喬治‧馬丁、史德林（S.M. Stirling）、瑪琳達‧史諾葛拉斯（Melinda Snodgrass）和瓦特‧瓊恩‧威廉斯（Walter Jon Williams）等人是多年文友，該次對話的主題即是史詩奇幻，眾人自由發言，共同探討對這個文類的看法和喜愛原因。\n\n藉由這次對話與辯論，艾伯罕釐清了他對史詩奇幻的種種觀點，例如這是一個「懷舊」的文類，故事往往發生在一個黃金年代已經逝去之後；又如這是一個不斷與前作對話的文類，絕大多數近代史詩奇幻均源自於對托爾金《魔戒》的致敬或反動：沒有《魔戒》，當然就不會有泰瑞‧布魯克斯那無趣的《夏那拉之劍》，但顯然也不會有史蒂芬‧唐納森的「莫信者傳奇」（The Chronicles of Thomas Covenant the Unbeliever），而沒有「莫信者」的反英雄形象，或許就不會有「冰與火之歌」。\n \n\n艾伯罕的奇幻啟蒙作品是大衛‧艾丁斯的「聖石傳奇」，長大後眼界開闊，難免覺得當初「年少無知」，但經此對話，他明白那種熱烈追捧的激情並沒有錯，同時也立定志願，要寫出一個讓四十歲的自己用同樣熱情追捧的好看作品。在寫給出版社的提案書中，他形容「刀光錢影」是一封「寫給奇幻冒險故事」的情書，其目的在於「讓讀者欲罷不能以致於缺乏睡眠」。\n \n\n身為馬汀的文友和得意門生，艾伯罕自然比任何人都熟悉「冰與火之歌」的精髓。早在「黑太陽的女兒」系列中，他擅寫逆轉結局的高超筆法，便已頗有馬汀之風。他曾與馬汀等人共同創作科幻小說，更多次擔任馬汀作品的漫畫版編劇，包括《熾熱之夢》、中篇〈狼皮交易〉（Skin Trade）和「冰與火之歌」。\n \n\n有了這樣得天獨厚的條件，難怪艾伯罕能寫出進化版的「冰與火之歌」。他完全記取了「冰與火之歌」的教訓，並加以改良。例如視點人物筆法固然很好，但人物一多便很難兜在一起，讀者可能要看一百頁才能看到再次同一個視點人物的章節。所以「刀光錢影」從頭到尾只有五個視點人物，艾伯罕更可以精準地掌控每一集的長度。\n \n\n寫史詩奇幻而沒有長度失控，可見其過人的節制，而我認為「節制」正是艾伯罕與馬汀最大的風格差異。「刀光錢影」是一個相對溫和的「冰與火之歌」，當然後者的魅力之一即在於作者毫不留情的過激筆法，不過並非人人熱愛重口味。在「刀光錢影」中，謀殺、暴力、和性依然時常上演，只是表述方式不那麼露骨。或許有讀者要問，「冰與火之歌」變成輔導級還有什麼看頭？我卻要說，就是在這種看似不慍不火的敘事之中，艾伯罕匠心埋藏的伏筆及轉折才更顯震撼。\n \n\n「刀光錢影」的背景是一個類似歐洲中世紀晚期的架空世界，首部曲《戰龍之途》開始的時候，北方大國安提亞正揮軍南侵，準備將不願乖乖納供的貿易商城瓦奈納入版圖。小說的五位主角，便因為這場戰爭而相遇和相愛、結盟或者結仇，最後影響了整個大陸的命運：少女席絲琳自小失去雙親，受銀行監護撫養長大，因此精通投資和會計，極有生意頭腦，卻老是愛上不該愛的男人。傭兵隊長馬可士本是驍勇善戰的武將，妻女遇害之後浪跡四方，擔任商隊的保鏢混口飯吃；葛德出身安提亞小貴族家庭，是個肥胖的書呆子，最大心願就是研究古代史料，卻身不由己捲入一場空前政爭；道森‧凱廉男爵是安提亞的重臣，為人剛正不阿、尊奉傳統，排拒宮廷中反對勢力所主導的農民議會法案，認為下人永遠不應該當家；凱廉男爵夫人克萊拉是個典型的貴族妻子，性格溫婉、心思敏銳，從無政治野心，只期望能替道森分憂解勞，最在乎的莫過於保護在戰場殺敵的兒子，以及家族的名譽。\n \n\n除了五個視點人物，故事中最重要的配角是個名叫基特師傅的戲班主人，他帶領一票年輕演員走南闖北，似乎具有洞察人心的特異功能。《戰龍之途》一開始，馬可士的手下因酒醉鬧事被抓去充軍，正愁沒人手完成護衛商隊的任務，就碰上了基特師傅的戲班子。馬可士索性聘用他們假扮傭兵，反正只是運些平常的貨，根本值不了幾個錢，但他作夢都沒想到，商隊裡有個木訥寡言的少年，趕著一輛驢車，車上竟暗藏了瓦奈全城的財富。這個「少年」不是別人，正是被銀行撫養長大的席絲琳。眼看安提亞大軍逼近，城破在即，行長不願借錢給必敗的城主僱請傭兵，又怕資產被戰火波及，遂決定把珠寶和帳冊連夜送出去。本來負責駕車的人被城中警衛藉故殺死，行長只好讓席絲琳女扮男裝，接下這個重任。\n \n\n隨著故事進展，我們會逐漸發現這個世界的古代歷史。正如恐龍曾經稱霸地球，「刀光錢影」的世界也曾為巨龍所統治。牠們具有強大的魔力，能夠超脫空間與時間的限制，信手便能塑造出驚人的神器、宏偉的建築。龍族創造人類，作為供其差遣的奴隸種族，更從中造出十三種變體，也就是現今世上的十三人種：為數最多的人類原型「原血人」、削瘦白膚的錫內人、身形壯碩長有兩根彎彎獠牙的戰士種族耶姆人、全身被黑鱗覆蓋的提辛內人、長著一對招風耳的特拉古人，還有神秘的水生種族「溺人」。\n\n龍族早已絕跡多年，現在世界是屬於十三人種的，但是龍族究竟為何絕跡，十三人種之間又有什麼樣的族群矛盾，這才是重點。傳統奇幻小說總會有龍、也會有精靈矮人等種族，艾伯罕則在「刀光錢影」中創造了獨特的龍族神話，以及帶有幾分科幻色彩的不同種族。\n\n《戰龍之途》是「刀光錢影」五部曲的完美開場，艾伯罕大膽引進銀行和金融業的題材，讓女主角席絲琳縱橫商場、大出風頭，但又賦予她渴望被愛、反而情場失意的弱點。馬可士集劍俠、傭兵和浪客於一身，對席絲琳來說既是父親形象，又是遙不可及的戀人，有如基度山伯爵加上《魔戒》裡的亞拉岡。熟讀「冰與火之歌」的讀者，肯定能從葛德身上看到山姆威爾‧塔利和「小惡魔」提利昂的影子，他的轉變與崛起深具悲劇色彩，也是一次對霸凌和復仇的審視。這個看似只有「人」的故事，會在續集中漸漸染上超自然的奇幻色彩，如重返人間的蜘蛛邪教，傳說中仍在大地深處沉睡的巨龍，以及十三人種的秘密。", "summary": "為《戰龍之途》撰寫的中文版導讀，介紹丹尼爾‧艾伯罕橫跨多種類型的多產創作歷程，以及本書作為史詩奇幻的文學特質。", "tags": {"type": ["導讀"], "genre": ["奇幻"], "growth": ["閱讀體驗", "情感流露"], "era": ["版權輸入"]}}, {"title": "當退休殺手遇上貴族少爺：《史密斯計畫》", "date": "2012-12-03", "year": 2012, "body": "版權書訊>文學類>奇幻小說\n\nTHE ANVIL OF THE WORLD by Kage Baker 版權狀況：已售出繁體中文版權\n\n凱姬．貝克生長於加州好萊塢，全職寫作以前曾長期在劇場工作，甚至教授伊莉莎白時期的古典英文。她四十五歲才正式出道，以《伊登園》（In the Garden of Eden）一書開啟結合歷史和時間旅行的科幻系列「超時空企業」（The Company），奠定了她在文壇的地位。可惜貝克在 2010 年以五十七歲之齡過世，留下十多部作品，否則應該會有更大的成就。\n \n\n《史密斯計畫》是貝克在 2003 年發表的作品，原名《神之鐵砧》（The Anvil of the World），係由三個中篇組成，也是她首度嘗試奇幻長篇。小說設定在一個地理環境神似加州的幻想世界，這裡主要有兩個種族，「太陽之子」（Children of the Sun）是鍛造之神和火焰女神結合的後代，基本上就是一個黃紅皮膚、擅長器械技術，也因此一天到晚破壞環境，而且易怒好鬥，動不動結仇結怨的種族。另一個種族「延追」（Yendri）則有點像精靈，崇尚自然與平靜，絕不訴諸暴力，長於醫術和各種靈性修練，因為他們身形高挑，膚色發青，又被「太陽之子」蔑稱為「綠仔」（Greenie）。\n\n小說的主角想當然爾叫做史密斯，而這名字毫無疑問也是個假名。此君本是個身懷絕技的刺客，沒別的本事就是最會殺人。但他受夠了滿手血腥的生活，也不想要老是活在被人追殺的恐懼裡，於是隱姓埋名、遠走高飛，來到楚恩城（Troon）投靠表哥。這座城素有「黃金之城」美稱，因為它座落於沃野千里之中，四周都是金黃色的大麥田，城裡的風車和穀倉巍然挺立，是著名地標，但也因此空氣中麥屑紛飛，導致居民長年罹患肺氣腫。\n\n偏偏楚恩城的居民又以身為世界頭號糧倉自豪，於是在這裡「打噴嚏」是一種時尚行徑，而每年社交圈最重要的活動，叫做「口罩節」。光看這樣的開場，就不難看出凱姬．貝克的文字魅力：有創意的設定，鮮活生動的語言，還有冷面笑匠式的幽默。\n \n\n《史密斯計畫》的前三分之一簡單說是個「運鏢」的故事。原來史密斯的表哥靠經營商隊為生，但手下的商隊長正好生病，在人手緊缺之下，便叫史密斯去代班，這個毫無運鏢經驗的前殺手也只好硬著頭皮上陣。車隊成員無奇不有，一對夫婦帶著幾個哭鬧不休的死小鬼，他們叫史密斯夫婦。負責替大夥兒煮東西吃的阿姨是個廚藝高超的美食家和老江湖，也叫史密斯太太。可想而知，每個人都有不為人知的過去。除此之外，車隊裡還有個病得奄奄一息的貴族小少爺「厄曼威」（Lord Ermenwyre）和他豐滿美艷的奶媽。行蹤鬼祟的信使帕拉丹．史密斯（Parradan Smith），還有唯一延追人草藥師「容立新．蘆葦開花」（Ronrishim Flowering Reed），以及負責偵察的跑腿信差女孩「燒得亮」（Burnbright）。\n \n\n就在車隊行經一座延追人大本營的森林時，史密斯看到遠處一座聳立的黑暗山峰，而史密斯太太也講起了一個著名的傳說。相傳多年以前，山上出了一個外號「山大王」（Master of the Mountain）的惡魔，四處侵襲、為非作歹，而彼時延追人信仰一位純潔至美的聖女，她決心親自出馬，收服這個惡魔。\n \n\n誰也想不到，聖女竟然和惡魔一看對眼，歡天喜地結為夫妻，還生了一堆半人半神半魔的小孩。部分延追人繼續追隨聖女，卻也有人認為她背叛了信徒，或者認為惡魔玷污了她的貞潔，因此誓言殺死山大王所有的後代。當然，延追一族愛好和平，絕對不會親自動手，所以都是花錢雇傭兵來殺人。\n \n\n按照這類故事的傳統，原本貌似單純的運鏢任務，一定暗潮洶湧。果不其然，大夥兒才上路沒幾天，就接二連三遭到攻擊。有盜匪攔路，有飛龍空襲，甚至連到了旅店都有人埋伏，而且顯然車隊裡有內賊。這些攻擊的目的是什麼？為了奪取價值連城的財物？還是要復仇雪恨，取某個人的項上人頭？\n \n\n史密斯這才發現，貴族少爺厄曼威不是別人，正是聖女/惡魔夫婦的小兒子，而那個屢屢朝他拋媚眼的奶娘班席克夫人（Lady Balnshik）則是個如假包換的獠牙惡魔，只不過以人形現世。所以這個整天躲在轎子裡嗑藥，滿口不正經垃圾話的傢伙，才是敵人的真正目標？就算他們能平安抵達目的地，濱海之城薩雷希（Salesh-by-the-Sea），還會有什麼危機等著他們呢？這個故事為「史密斯大冒險」做了完美的開場，短短一百頁驚奇不斷，不僅帶出山大王/聖女神話這個核心的劇情設定，也為史密斯和厄曼威的「孽緣」埋下種子。\n \n\n小說的第二部則是個「旅館謀殺案」。話說史密斯等人到了薩雷西之後，陰錯陽差被吊銷執照，全車隊的人都面臨失業，幸好厄曼威出手相助，買下一座破爛房屋，交給他們重新裝潢，改建成「麗景旅館」（Grandview Hotel）。史密斯充當旅館主人，手藝非凡的史密斯夫人兼任餐廳主廚，一票車伕變成行李搬運工，「燒得亮」小妹妹就成了旅館專屬的信差。\n \n\n正值薩雷希一年一度的狂歡嘉年華，每年到了這時候，眾人都會瘋狂飲酒作樂，見了人的第一句問候語是「祝您交媾愉快！」（Joyous Coupling!）。就在這個時候，一個專門寫名人八卦傳記的小報記者入住酒店，卻在當天晚上死於房間裡，顯然是被人下毒。就在這青黃不接的時候，城市的官方代表還來檢查旅館的排水系統、公共安全設施，結果偏偏碰上死人，史密斯只好扮起偵探，試圖查出命案的兇手。\n \n\n而專門幫倒忙的厄曼威少爺又在此時翩翩駕到，還帶了四個彪形大漢保鏢，他們通通都是惡魔，名字分別是「阿砍」、「阿捅」、「阿絞」和「阿轟」。原來他跟某個魔法師結了仇，對方揚言要找他單挑，小少爺不想面對，就跑來麗景旅館避避風頭，還帶了私人醫生，也就是他老媽/聖女的忠實信徒，延追人「柳枝先生」（Willowspear）。\n \n\n人究竟是誰殺的？厄曼威與魔法師的對決會如何收場？麗景旅館是否前途堪慮？在一連串歡樂和混亂之中，貝克已經悄然佈局，在看似幽默和鬧劇的故事裡帶入了宗教、種族、環保等議題，大大增加了故事的深度。\n \n\n小說的第三部是一個航海冒險故事，也將劇情帶往更高的層次。「山大王」和聖女雙雙登場，厄曼威的哥哥姊姊、延追激進宗教份子、海邊聖地的土地開發案、史密斯的身世之謎、還有攸關太陽之子前途的滅絕危機，都將在此獲得解答。\n \n\n《史密斯計畫》出版五年後，貝克推出了《雄鹿之家》（The House of the Stag），講述「山大王」與聖女的故事，算是一部前傳。這本書獲得世界奇幻文學獎提名，而本系列的第三本書《河鳥號歷險記》（The Bird of the River）則在貝克過世後出版。", "summary": "介紹奇幻喜劇小說《史密斯計畫》，作者凱姬‧貝克以幽默筆調刻畫退休殺手與貴族少爺的冒險，以類型混搭見長。", "tags": {"type": ["書介/書訊"], "genre": ["奇幻"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "譚光磊：讓好故事不寂寞", "date": "2012-11-26", "year": 2012, "body": "文/駱瑩瑩（本文刊載於《書香兩岸》雜誌 2012 年 11 月號，第 49 期）\n\n譚光磊是把英文好故事帶到華語地區的人。\n\n和他聊工作或是讀他寫的書訊，很快會陷入一種既亢奮又苦惱的狀態。亢奮是因為，歐美出版圈的那些事，在他熱情洋溢的講述下有一種現場感，彷彿正在上演出版界的「新聞急先鋒」（The Newsroom），隨著事情的發展讓人熱血沸騰。一群掌握歐美出版潮流、炮製世界級超級暢銷書的編輯、文學經紀人，在短時間內如何搶下一本書，而每一位出場的人物又都帶著密度極高的信息。這位曾以幾百萬美金簽下某一本出版圈內耳熟能詳的經典之作；那位手上握有幾位世界級作家；間或也會有一些國際出版圈的「豪門恩怨」、「個人恩仇」，看似遙遠的國際出版圈人與事，變成可以在茶餘飯後閒聊的話題。苦惱是因為，在他的講述下，每一本書都精彩到讓人覺得錯過了是一種巨大的損失，於是看到自己放入購物車的書單越來越長，陷入閱讀和資訊焦慮中。\n\n譚光磊充滿熱血的書訊，讓國際版權代理的角色不再默默隱於書的背後，也讓這個職位被賦予更多的個人因素。從 2004 年開始做版權代理，到 2008 年成立以自己名字命名的版權代理公司「光磊國際版權經紀有限公司」，從只代理繁體中文版到代理簡、繁體中文版，短短幾年的時間，他已經成為華語地區繼大蘋果、博達之外，非常重要的版權代理人。根據美國出版網站 Publishers Marketplace 統計，他的版權公司交易量為2010年非英語系國際小說冠軍。從某種程度上說，他的推薦影響了華語讀者閱讀歐美小說的口味。\n\n熱血奇幻迷\n\n1979 年出生的譚光磊，在成為版權代理人之前，是一名瘋狂的奇幻迷。中學時因為喜歡電腦遊戲，他開始讀許多歐美奇幻小說，高中畢業那年已成為奇幻小說的譯者，此後更經歷奇幻出版的許多角色：讀者、譯者、作者、推廣者、選書人、編輯、顧問、審稿、書商，直至版權代理人。\n\n2004 年，在研究所念了一年之後，因為要與朋友做電腦遊戲，他休學在家。不料遊戲沒做完，朋友去當兵，金主要他們把錢「吐出來」，寫訴狀、打官司，敗訴。這個打擊終結了他的遊戲夢，也讓他重回奇幻文學之路，除了繼續當譯者之外，還和出版社合作選書。可是書選了，版權要找誰談？他來到家西書社，一家專門代理歐洲書的版權代理公司，兼職開拓英語系業務。做了大概半年，要復學了，想著「一邊念書一邊兼顧版代工作」，結果才開學一個月，去了一趟法蘭克福書展，而工作和學業之間也越來越難於取得平衡，於是放棄學業專心做版代。\n\n放棄的可是台大外文系的碩士學位，譚光磊也不覺有多大遺憾。「之前做過出版的很多環節，雖然也都覺得那些工作很有意思，但總還是覺得沒有一個是百分百適合我的。」在禮筑外文書店做原文書採購時，雖然手握選書大權，可是外文書畢竟是小眾，一本書能賣出五本已經算是暢銷。對推廣奇幻抱著滿腔熱血的他心想，如果做了版權代理，推薦的書翻譯成中文版，再怎麼不好賣也有上千本的量，這個效力要大很多。而做翻譯是一份很寂寞的工作。一本書至少要翻三個月，厚一點的可能是六個月，《冰與火之歌》第一部他翻了兩年。那麼長的時間都是一個人在工作，很難與人分享工作中的感受，非常悶。「我覺得自己的注意力沒辦法集中那麼長時間，比較需要不斷有新的刺激。做版代最棒的地方是，一直有新書進來，剛開始做的時候，因為手上代理的書不多，看到一本有興趣的書，可以拋下一切讀個三天三夜，然後花一個下午的時間寫一篇熱血的推薦，發給客戶之後，就可以再去看下一本書，不像做翻譯時會被一本書拖著，別的東西都不能做。」\n\n不過，等譚光磊真正進入版代這個行業，奇幻文學在台灣已經泡沫化，他的閱讀口味也被迫從奇幻擴展到不同的領域（不這麼做會活不下去），歷史、推理、犯罪，言情，不只文學類，還有科普、商管、健康、生活、傳記等等，也因為這樣逐漸開拓了他閱讀的視野。\n\n找到「對的」版權負責人\n\n譚光磊做版代時，歐美版權書大部分由大蘋果、博達兩家版代公司負責，這兩家公司手上都是大客戶，這些客戶大到不需要怎麼向出版社推薦，都可以很快賣出版權，所有台灣地區的出版社不管找什麼書，版權都在這兩家公司手上，而且大部分是獨家代理。除了入行晚，手上拿不到大客戶，該怎麼找到「對的」版權負責人，對譚光磊也是一種考驗。\n\n「簡單來說，拿到一本美國書，看上面是什麼出版社出版，但是這本書的中文版權是誰代理，從版權頁的信息是看不出來的。通常會覺得版權應該是在出版社手上，問題是美國的版權分得非常細，這家出版社可能只拿到了這本書的英文版權，中文版權可能在經紀人手上。經紀人又很複雜，這位美國作家可能找的是英國的經紀公司，又或者美國作家找的是美國經紀人，但這家美國經紀公司不處理海外版權，他要找英國經紀公司來處理翻譯版權，可是這家英國經紀公司在中國地區又是非獨家授權，有三個代理。要怎麼準確、迅速地找到那個負責人，真的是憑經驗，多摸索。幾次之後累積的這些信息就是你的資料庫。」\n\n好在美國的經紀人夠多，多的好處是他們會合並、會自立門戶、會跳槽。剛開始譚光磊手上只有幾個客戶，和某些大的公司談版權代理也不順利，可是因為留心業界動態，善用google，花心思整理手上的資料，他很快便摸清了門道，理順了關係。看到有人出來自立門戶，就趕緊寫信與他聯繫，彼此都是新出來做的，就有了合作的可能。很多合作都是靠這樣「鑽」出來的。\n\n譚式書訊，革命性的版代服務\n\n慢慢累積了客戶資源，可是還是不如大的版代公司書目一大串。小蝦米如何對抗大鯨魚，怎麼讓出版社留意，也願意花時間看自己代理的書？書訊，是很好的突破口。在此之前，台灣負責英文書的出版社編輯只會收到一封簡單的英文書訊，但很快的，他們便被譚光磊的中文熱血書訊所吸引。他筆下的每一封書訊，都有一個動人的故事以及非常多的細節和巨大的信息量。\n\n動人的故事考驗的是譚光磊組織、提煉以及資料整合的能力。他能用千把字把一個幾十萬字乃至上百萬字的故事講得扣人心弦，並告訴你這個故事的重點、賣點，作者生平有什麼好玩的花絮，甚至與這本書有關又有哪些國際出版圈的八卦。有時連書名他都幫忙想好，甚至營銷的重點都一併考慮。\n\n革命性的版代服務，讓譚光磊代理的書很快便找到賣家，也讓他得到更多出版社的認可。久了之後，這種「譚式書訊」也形成了自己的能量，不斷發酵。在他的「灰鷹巢城」部落格，書訊的讀者已不僅僅限於出版界的編輯，也成為許多普通讀者購買歐美小說的參考信息。\n\n說到自己的風格強烈的書訊，譚光磊說：「做久了，看到一本書很自然會有理性和感性兩種分析。感性的部分，是一種直覺的個人喜好，自己有沒有被這樣的題材感動。理性的部分，則會去分析類似的題材以往有沒有出過，賣得怎樣，有沒有哪些條件可以為這本書加持。」\n\n不管是得獎還是賣出多少個版權，版權賣到哪一國，做得越久,這些都是他可以專研得越深的信息。剛開始的時候，他的書訊中的信息也只是比較表面的「賣出德國、英國、法國等幾國版權」，「上了什麼的排行榜」之類。一段時間之後，他已經可以詳細地寫出，「賣出的德國、英國、法國等幾國版權，德國的這家出版社出過什麼書，法國的這家出版社出過什麼書」，他甚至能發掘出這幾家出版社之間有沒有什麼共同的特點，如果有，也會在書訊中提及。到後來，書訊裡提到的不單是出版社，還有編輯。在國外，出版人個人的因素對出版的影響非常大，編輯選書的眼光非常重要。於是，「某一本書賣出某幾國的版權，德國是哪個出版社的哪位編輯買下，那位編輯曾經簽過某某書，那本書的中文版曾經取得怎樣的銷量，上了某某排行榜」；「這本書的經紀人是某某，他還代理過哪幾本書，他的哪一本書曾經賣給某一家出版社的某某編輯……」以至於有某位出版社總編輯笑著說，「看譚光磊的書訊，好像每一本書都不能不買。」\n\n看書的時間，也是一種投資\n\n有一段時間，譚光磊和在中學當老師，閱讀量很大的母親，每天晚上在電話裡常常進行這樣的對話。\n\n「我剛看了 XXX（書名）。」譚媽媽說。\n\n「啊我知道！那就是誰誰誰（作者名）的新書，某某某（出版社名一）這個書系不錯，上回你看的XXX（書名二）也是他們的。這書是 XXX（編輯朋友名）做的，之前他在某某某（出版社名二），跟我買了 XXX（書名三）。」光磊激動地回答。\n\n「這書你看了嗎？」譚媽媽問。 \n\n「我買了。」光磊底氣不足地答。 \n\n「你是負責看書名的嗎？」譚媽媽又問。\n\n「……是。」\n\n實在是因為自己代理的書太多，能看完十分之一就已經很不錯了。後來，因為自立門戶，每天要處理的書量就更大了。前面幾年練就的非常扎實的看書、講書、寫書訊的功夫派上了大用場。「到後來，可能一天就要發兩三本書，根本跟不上這樣的書量，當然也會有同事幫忙看書稿寫書訊，但是大部分還是我。到這個時候，看書的時間也變成了一種投資，要不要花五個小時、十個小時去看一本書？也許花了時間去看也覺得不怎麼樣，中途就會停下來去看別的書。也可能只讀一點書的內容，或者可能根本沒時間看，但是你知道這是一本大書，這個題目是好的，就上網查資料。」書訊還是必須要寫的呀。\n\n好在譚光磊很享受寫書訊的時刻。他曾在部落格上寫道：「宮部美幸說：『一定要流汗用力，才算是工作。』對我來說，每天一定要寫了書訊，才覺得有‘工作’到。不管談成多大的案子、搞定多少合約、回復多少郵件，沒有寫書訊，就覺得心裡虛虛，沒盡到本分似的。」\n\n而「譚式書訊」也為一些本來不出位的好書帶來機會。「外國的書非常多，我能做的，就是選擇這本書然後主力推它，這樣會讓這本書的能見度高很多。有些書在國外得獎，有很好的銷售成績，未必需要這個加分大家自然會注意到，但是有些書內容不錯，在國外的表現也好，只是沒有到那種在排行榜第一名的亮眼成績，如果推它一把就會出來，做這種書是最有成就感的。這幾年我最有成就感的都是那種賣四五萬本的書，那些書原本可能是一本根本不會有人注意到的書，或者只能賣兩三千冊，因為包裝成功，宣傳到位，有了很不錯的表現。」\n\n版權代理，活在未來的孤寂\n\n譚光磊形容做版權代理好像「活在未來的孤寂」。幾年下來，自己的時間觀念完全改變，除了換算各國時差的能力大大增強之外，也真正學會了「凡事向前看，永遠活在未來。」他說，「過去專注於奇幻領域的時候，從不認為追新書有什麼必要，因為至少有一百年分量的各種經典作品還未被引介，連大師都認不全，還談什麼新人？但是開始做版權代理之後，思考方式開始改變，或許是因為國外的出版量實在太大，編輯們連新書都應接不暇，哪還有力氣回頭？這些早已無關對錯或者品味，純粹就是出於職業的不得不然。」\n\n而「孤寂感」和版權代理人在歐美地區和華語地區所扮演的不同角色有很大的關係。在歐美國家，尤其是歐洲大部分出版人的英語都很好，所以他們的讀稿速度快，而且出版社有找審讀者的習慣。他們分別有固定的西班牙文、德文、法文等語種的審讀人，書稿評估的流程很成熟，運作得也非常順暢。華語地區乃至整個亞洲地區，做外國文學的速度都是跟在他們的後面。 \n\n此外歐洲的出版社大部分都有書探。以一家德國出版社為例，他在美國有書探。這個書探是一個團隊，這個團隊的人就在美國，與大部分美國出版社和經紀人的關係很好，他們能很快地拿到各式各樣的書稿，甚至經紀人還未把書稿投給出版社的時候，他們已經知道有這本書，可以把這個信息反饋給自己的客戶。因為每家書探在每個國家都只能有一個客戶，也因此客戶之間不會有利益上的衝突。這樣一來，還有另一個好處，如果某個書探手上有一本熱門的書，而他手上同時有十三個國家的客戶，這十三個國家的頂尖出版人就有可能同時看一本書的書稿，然後討論。而華語地區的出版社，大部分時候是等到一本書出來，上了亞馬遜的排行版，上了《紐約時報》才會去問版權，然後等樣書，判斷是否要購買，一本國際熱門書的出版在速度和時效上遜色很多。\n\n譚光磊所從事的版權代理的工作，是華語地區傳統意義上的版權代理再加上一點點書探的混合體。他有機會較早地接觸到一本書的資料。這種「早」有時也是一種「寂寞」。年輕熱血的他，「難免幻想能與歐美同步，成為出版前就賣出幾十國版權裡的一員」，但「文化差異、語言問題到出版規模、口味、歷史等等原因」，導致難達這樣的心願。他發出這樣的感歎：「當手上只有一份幾百頁的電子文件，有經紀人的見解和熱情的推薦；當網絡上沒有絲毫蹤跡，連業界都僅有隻字片語，你要拿什麼去吸引出版社注意？有什麼『證據』去說服他們？那真像一場自以為是的虛妄。去年法蘭克福書展（2005年），輾轉聽聞海外版權天王丹尼•巴羅剛談成的超級大作，預付版說高達兩百萬美金云云，顯然是業界爭相走告的注目焦點。書展前幾周才賣掉的作品，那時就已經售出幾十國版權，連南韓都發瘋似地砸下四萬美金搶走。回台後我收到八百頁的電子稿，還有目錄裡短短幾百字什麼也講不清楚的簡介。我開始在網絡上找數據，但一切都是徒勞。當下不禁錯覺：這書真的存在嗎？」\n\n選擇了這行，就註定要承受這樣的寂寞，包括對自己所叢事行業的瞭解和懂得，也僅限於關注歐美出版的同行之間。不過總還是希望能做點什麼填補理想化和現實操作之間的距離。對譚光磊來說能做的就是，通過自己所扮演的角色加速出版社的看稿和做決定的週期，盡可能地提供更多有助於出版社下判斷的資訊。\n\n版權輸出，Fellowship是社交好場所\n\n2008年，在接受台灣《天下雜誌》採訪時，譚光磊曾對台灣本土創作者放言：「好好寫，我會負責把你賣到全世界。」這句聽起來有點不知天高地厚的話，在 2012 年實現了。經譚光磊代理，台灣著名作家吳明益的《複眼人》賣給了美國 Pantheon出版社（美國很有名的嚴肅文學出版社）村上春樹的編輯。這是第一本由美國大出版社簽下的台灣小說，也是譚光磊賣到歐美的第一本台灣小說家的作品。此前他代理的華裔作家張翎的《金山》，曾賣出十國版權。\n\n對任何一位版權代理人來說，在版權引進順差常年大於輸出的情況下，能將母語作品賣到世界，都是一件令人振奮的事情。雖然引進和輸出都屬版權代理工作，但分屬兩個不同的系統。做引進的時候，聯繫的人，不管是各個經紀公司還是出版社，都是賣版權的部分，而當要賣東西給對方的時候，決策人往往是出版社的編輯。在國際出版界，這些為各大出版社買版權的編輯都是真正呼風喚雨的人物。每位出版社都有一兩位充滿傳奇色彩的明星編輯。可是要怎麼認識這些編輯，讓他們注意到自己手上的好作品？書展的版權交流活動（Fellowship）是很好的方法。最近幾年，譚光磊開始積極參加版權交流活動，跑一些以前比較不會參加的書展，比如墨西哥書展、耶路撒冷書展等。\n\nFellowship中文似乎沒有很直接可以對應的詞，可稱之為「短期研習」。在書展圈，最早舉辦的是耶路撒冷書展，還分為編輯和經紀人兩種研習。後來法蘭克福書展也效尤，成為舉辦得最好的書展版權交流。台北書展也從 2012 年開始舉辦。版權交流不以商業為目的，主要是讓大家瞭解舉辦地的文化和出版情況，並邀請世界各地的出版人（主要是編輯）前來參加。參加版權交流活動，就有機會和一群頂尖編輯認識，和他們也是一種同期同學的關係，一起認識一個地方，吃喝玩樂都在一塊，很自然地會建立起一種友誼。而且書展上，編輯們還舉辦各種版權交流活動的同學會，認識的編輯也會邀請一起參加，靠著這些社交活動，譚光磊認識了許多世界有名的出版社的頂尖編輯。\n\n買下吳明益那本書的美國編輯，是譚光磊在多倫多的活動上認識的。在一天大會中途休息時，這位編輯讓譚光磊推薦一些中文書給他，結果她對《複眼人》表示出了極大的興趣。而巧的是，買下《複眼人》英國版權的出版社與這位編輯所在的美國出版社是同一個集團。美國和英國做嚴肅文學的對口出版社，這兩家出版社彼此的口味相近，就這樣促成了這本書美國版的輸出。\n\n老老實實做好口碑\n\n聽譚光磊說版代這個職業，每一本書背後都有一堆的故事。和家大業大的國際出版社談版權，原來也會遇到不專業的出版人，有各種讓人無語、難搞、氣得想摔東西的事。有些人的作為實在太誇張也就不合作；有些只能打破牙齒和血吞；還有些，因為出版社還要繼續出他們家的作品，想到自己如果不做了，出版社就要直接與對方聯繫「好可憐」，便勉為其難幫忙。當然，也有各種「柳暗花明又一村」的意外驚喜。說到國際版權代理，好像大得不得了圈子，其實做久了之後，才發現這個圈子很小，來來去去就是這些人，很多事情都是口耳相傳。\n\n最近頻頻有新聞傳出的超級暢銷書《格雷的五十道陰影》的中文版代理人就是譚光磊，而他會跟這家經紀公司合作，也是不曾料到的「意外收穫」。這家經紀公司原本就是譚光磊夢寐以求的客戶，2004 年他因為另一本書曾與他們聯繫過，結果收到「謝謝你的來信，不過我們都跟XX合作」的冰冷回信，然後便不再理他。剛開始他也覺得好遺憾，沒想到他的別的客戶因為通過這家公司賣外國版權，就跟他們推薦了譚光磊，2008 年，他們主動聯繫譚光磊談合作，彼此之間建立了很好的合作關係。\n\n像這樣曲折的合作故事，譚光磊有一籮筐。「老外之間熟得很快，他們有酒會文化，資訊的傳遞速度也非常快。你很容易認識人，人家也很容易認識你。所以老老實實做好口碑就好。」 譚光磊笑笑說。\n\n經歷過出版上游的諸多環節，成為版權代理人也有八年，我問譚光磊對這個行業的看法有沒有什麼變化，他只是淡淡地說：「沒什麼特別的。這個行業以前不太賺錢，現在也還是不是很賺錢。」這的確不是一個賺錢的行業，對譚光磊來說，這卻是會持續帶給他滿腔熱血和維持他熱情的行業。他一直懷著當年「瘋狂奇幻迷」的一腔熱血在做著這個自己喜歡的職業，讓中文世界的讀者不錯過任何一個好故事，也用自己的努力和熱情，賦予版權代理人這個職業，更多「個性化」的色彩。", "summary": "《書香兩岸》雜誌記者採訪版權經紀人譚光磊，介紹其日常工作、選書眼光，以及「讓好故事不寂寞」的出版理念。是難得一見的完整人物側寫。", "tags": {"type": ["人物專訪"], "genre": [], "growth": ["工作意義", "職涯轉折", "人際交流"], "era": ["版權輸出"]}}, {"title": "劫富濟貧的奇幻俠盜演義：《盜賊紳士拉莫瑞》", "date": "2012-11-26", "year": 2012, "body": "本文是《盜賊紳士拉莫瑞》中文版導讀（時報出版，12/12）\n\n許多人認為這幾年是奇幻文學新的「黃金年代」，因為類型發展成熟、創作者人才輩出，市場反應熱烈、影視改編不斷，奇幻已不再是個小眾文類。然而即便是在如此繁盛的當代奇幻文壇，史考特‧林區戲劇性的崛起仍屬罕見的異數。\n\n2004 年八月，英國「獵戶座」（Orion）出版社編輯總監賽門‧史班頓（Simon Spanton）無意間發現林區貼在某部落格的小說，大受震撼，立即用高額版稅簽下《盜賊紳士拉莫瑞》等四本書的全球版權。當時林區才二十六歲，住在爸媽家的地下室，當過洗碗工、餐廳服務生和網頁設計師，甚至還是個領有執照的志願消防員。在英美的出版體系中，作家想找到經紀人已非易事，遑論出書，但這個住在明尼蘇達鄉下的長髮阿宅竟然麻雀變鳳凰，搖身變成英國首席奇幻出版社力捧的明日之星，怎麼不叫人羨妒交加？\n\n我還記得那年帶著樣書回台中老家，在火車上翻開《盜賊紳士拉莫瑞》，讀得激動不已的情景。我用一整個週末狼吞虎嚥看完，突然能夠領略編輯或經紀人發現傑作時如獲至寶的狂喜。那不只是「這書會紅」的商業考量，而是此生難得幾回的驚豔和震撼。後來我寫下一段話來描述這本書：「它從奇幻類型源遠流長的傳統中獲得滋養，茁壯而繁衍出嶄新樣貌；它有著大師經典的氣味或者痕跡，但那不是怠惰抄襲、亦非了無新意，而是站在巨人肩膀的更上層樓，類型演化的里程明證。它具有一切讓我最初愛上這個類型的要素：劍與魔法的對立、壯麗和墮落並存的奇幻城市、繁複多姿的佈局，以及說來簡單可是做到很難的「驚奇感」（sense of wonder）。它不是另一個《哈利波特》跟風的青少年奇幻，它可以有成人世界的黑暗、暴力和死亡、復仇與犬儒，黑色幽默還有蒼涼的世事無常。」\n\n到了2005年底，《盜賊紳士拉莫瑞》的樣書已經開始在書評家、奇幻部落客和書店採購間流傳。《冰與火之歌》的作者喬治‧馬汀讀了拍案叫絕，幾乎逢人就推，直說這是他多年來讀過最好的新人作品。2006 年，《盜賊紳士拉莫瑞》閃亮登場，果然寫下市場佳績，並且贏得讀者一致好評。該書最終賣出二十七國版權，獲世界奇幻獎和軌跡獎雙料提名，華納影業更買下電影版權，準備作為「哈利波特」系列電影結束後的接棒作品。\n\n故事的舞台是虛構的奇幻城邦卡莫爾（Camorr），有如文藝復興時代的水都威尼斯，這裡運河遍布、遊船如織，玻璃拱橋優美的弧線劃過半空、參天高塔拔起平地數百呎，僅能靠人工拉動的升降鐵籠往來。這裡有奢華的水上市集、喧鬧的嘉年華會、女戰士鬥鯊魚的死亡競技、能同時結出檸檬和萊姆的魔法老樹，卻也有陰森的墳場、危險遍布的城郊荒原、龍蛇雜處的賭場與妓院，彷彿是威尼斯與紐奧良的綜合體。\n\n很久很久以前，當人類還未出現的時候，卡莫爾曾是不知名上古種族的居住地。後來他們消失無蹤，只留下滿城的祖靈玻璃廢墟（Elderglass）。這是一種堅韌無比的結晶材質，人類始終無法參透其中奧秘，遑論複製或改造。城中有五座通天高塔，皆以祖靈玻璃造成，每天傍晚即吸收落日餘暉，在黑夜降臨的前刻散發光芒，如同另一次日落，人稱「詭光」（Falselight）。\n\n卡莫爾城中貴族和商旅往來頻繁，並藉由水運及港口之便，成為四方商業之都。這裡雖由公爵所統治，但不過真正掌握卡莫爾還是黑幫老大巴薩維（Capa Barsavi）。這位研究修辭學出身的學者多年前來到卡莫爾，以極端殘酷而有效的手段，在短短時間內一統眾幫，成為至高的幫派領袖。他和公爵的秘密情治頭目達成協議，幫派不碰貴族階級，黃袍警衛則對幫派的各種勾當睜一隻眼閉一隻眼。這就是俗稱的「秘密和議」（The Secret Peace）。\n\n主角洛克‧拉莫瑞在一場瘟疫中失去雙親，被竊盜集團頭目「傳盜師」（Thiefmaker）收留。洛克是個天才神偷，尤其精於易容和各式詭計，入門第一天便已從黃袍衛兵身上偷了東西，之後各種麻煩更是接踵而至。為了避免惹禍上身，傳盜師遂決定把洛克廉價賣給盲眼僧「鐵鍊神父」，小說正式開始。\n\n相傳這位盲眼僧為了表示信仰虔誠，乃挖去雙眼，纏以白布，並且全身以鐵鍊綑綁，永遠無法離開神廟，藉此換得信徒香油錢。事實上他兩眼靈光，拜的是十二諸神之外的第十三個竊盜之神，還以神廟底下的祖靈玻璃地窖裡作為根據地，自組「盜賊紳士團」。在他的調教之下，洛克學習各種語言、貴族談吐、用餐禮節、算數、扮裝、烹飪，是盜賊也是紳士。\n\n《盜賊紳士拉莫瑞》從洛克加入鐵鍊神父門下揭開序幕，隨即跳躍時空二十年，以洛克成年後的冒險為故事主軸，但又在每一章結尾加入「插曲」，回溯他的童年往事，或講述卡莫爾的歷史和寓言。這種作法既不會因成長過程太過冗長倒盡讀者胃口，又能收「今昔對照」的奇妙效果，可謂高明至極。\n\n《盜賊紳士拉莫瑞》可說是一部披著奇幻外皮的犯罪小說，因為故事主軸正是講述洛克和同夥們如何偷拐搶騙，周旋於卡莫爾富商和貴族之間，賺進大批銀子，與同樣 2006 年出版的《迷霧之子：最後帝國》有異曲同工之妙。不過《迷霧之子》的主角具有鎔金術的特異功能，目標也更大（要騙倒一個帝國）。洛克‧拉莫瑞則是個完全沒有魔法的「正常人」，只是個子特別瘦小、歪腦筋動特別快、嘴巴特別賤，遇到需要動手的時候，他要嘛拔腿就跑，不然就得請出他長得特別胖、可是特別會打架的搭檔吉恩（Jean），揮動一雙叫做「邪惡姊妹」的手斧，把敵人打得滿地找牙。\n\n洛克和吉恩的組合，當然會讓人想起佛利茲‧萊柏（Fritz Leiber）經典的「蘭訶瑪傳奇」（Lankhmar）系列。萊柏正是「劍與魔法」（Sword and Sorcery）文類的定義者，與創造野蠻人科南的勞勃‧霍華（Robert E. Howard）和白子戰士「艾爾瑞克」系列作者麥可‧摩考克（Michael Moorcock）並列為這個類型的三大宗師。「劍與魔法」類型的一大特質是主角往往不具備魔法能力，必需透過自身的武力（劍）去對抗邪惡的巫師（魔法），其次則是故事中的衝突多半聚焦於個人，而不像史詩奇幻動輒攸關世界的命運。\n\n「蘭訶瑪」由一系列中篇小說組成，敘述盜賊「灰鼠」和野蠻人法夫納在墮落的罪惡之城冒險的故事。《盜賊紳士拉莫瑞》當然有幾分向大師致敬的意味，但林區另闢蹊徑，讓故事脫離了傳統奇幻小說的中世紀風格，來到文藝復興式的貿易城邦，因為唯有這樣的設定，才有中產階級的興起，得以讓洛克用扮裝/易容的方式穿梭於權貴之間，而水都威尼斯一般的運河、假面舞會和嘉年華會，則提供了最完美的騙術舞台。\n\n《盜賊紳士拉莫瑞》除了為類型注入充沛活力，更具有跨出類型，吸引主流讀者的特點，比如說驚悚小說的情節，讓人拍案叫絕的高超騙術、帥氣的動作場面和賤到極點的唇槍舌戰。歸根究柢，這是一個讓人無法釋卷的精彩故事：孤兒的成長奮鬥、俠盜的劫富濟貧、黑幫的火拼復仇，還有令人動容的兄弟情義。\n\n依照林區的計畫，「盜賊紳士幫」一共有七部曲，前四部各以不同的城市為背景，後三部則擴展為與整片大陸相息息相關的大故事。他早已準備了大量背景資料和詳細的故事大綱，只要按部就班，應該很快能完成系列，也因此獵戶座訂下了野心勃勃的出版計畫，打算每八個月推出一本續集，在四年內出完。\n\n2007 年，續集《紅色天空紅色海》（Red Seas Under Red Skies, 暫譯）如期上市，可是第三集《盜賊共和國》（Republic of Thieves）卻遲遲不見蹤影。讀者等呀等的，一年過去又是一年，在長時間銷聲匿跡之後，林區終於在 2010 年在網誌上公開說明自己罹患了憂鬱症，正在接受治療。也許是成名太快帶來的壓力，也許是他對自己嚴苛的要求，也或許是喪失至親和婚姻告終的傷痛，讓他陷入前所未有的低谷，可是他選擇勇敢面對，也得到讀者和出版者的鼓勵和支持。\n\n現在是2012 年底，《盜賊紳士拉莫瑞》即將在台出版，從售出版權到中文版上市，因為太多無法預料的因素，而有了長達六年的「時差」。可是這場漫長的等待，竟與《盜賊共和國》至今仍未完稿的狀況遙相呼應。而台灣的奇幻出版，從《哈利波特》和《魔戒》掀起熱潮又歸於沉寂，一晃眼也走過了十年。彼時出版社盲目摸索、缺譯者也缺讀者，如今出版者累積了經驗、磨練出了眼光，資深的類型讀者也成了譯者、編輯、審稿者和評論者。《盜賊紳士拉莫瑞》的姍姍來遲，似乎也不是錯過時機的無可奈何，反而是陰錯陽差的正是時候了。就在兩個月前，華納的電影開發合約到期，《盜賊紳士》的影視版權轉由另一家電視公司接手，準備籌拍美劇，這不也是得利於《冰與火之歌》影集的成功嗎？\n\n寫這篇導讀的時候，是一個陰雨的週末早上，我的心裡五味雜陳，有太多的話想說，關於奇幻類型與出版的流變、關於一夕成名而後又墜落深谷的史考特‧林區，關於這本如同彗星一般閃亮耀眼的小說，卻又不知從何說起。\n\n但是那都不重要。重要的是，現在你手上拿著《盜賊紳士拉莫瑞》，你也即將走進這個迷人的奇幻城邦卡莫爾，一起見證拉莫瑞的傳奇。", "summary": "為《盜賊紳士拉莫瑞》撰寫的中文版導讀，介紹史考特‧林區從無名部落客到暢銷作家的傳奇崛起，以及本書精妙的敘事結構與黑色幽默風格。", "tags": {"type": ["導讀"], "genre": ["奇幻"], "growth": ["閱讀體驗", "人際交流"], "era": ["版權輸入"]}}, {"title": "無神論者的與神對話：《我看見了天堂》", "date": "2012-10-16", "year": 2012, "body": "版權書訊>非文學類>回憶錄\n\nPROOF OF HEAVEN by Dr Eben Alexander 版權狀況：已售出繁簡中文版權\n\n一個神經外科醫師的瀕死經驗，一次無神論者與神對話的奇蹟，出版前即賣出英國、德國、荷蘭、俄國、日本、韓國、中國大陸、台灣等十五國版權的奇書。\n \n\n2008 年，五十四歲的艾本．亞歷山大醫師正準備前往維吉尼亞大學任教，卻突然罹患了一種極為罕見、乃至於幾乎不存在醫學文獻之中的細菌性腦膜炎（bacterial meningitis）。短短幾小時內，他就陷入昏迷，斷層掃瞄顯示他大腦的新皮質（neocortex）受到嚴重損傷。簡單來說，艾本醫師的大腦功能已經完全關閉，就算他有機會醒來，此生也再也不可能說話和寫字。\n \n\n然而七天後，正當醫師勸艾本的妻子開始準備後事的時候，他睜開了眼睛。\n\n更不可思議的是，經過復健，艾本完全恢復了健康，能說能寫、能走能跳，與正常人無異，但他卻再也不是過去那個篤信科學、斥各種所謂「瀕死經驗」為大腦幻想無稽之談的無神論者。因為身為一個擁有二十五年教學經驗的神經外科學者，他很清楚人的大腦是一切意識和幻覺的根源，如果大腦停止運作，則人不再是「人」，既然如此，他所目睹的一切又要如何解釋？\n \n\n因為就在他昏迷的七天內，他不僅看到了來世，親身感受到慈愛造物主的存在，還遇見了一名女子，而她正是艾本醫師素未謀面、更不知道其存在的親生姊姊（艾本醫師是被收養的）。昏迷之前，五十四歲的艾本．亞歷山大是個無神論者；醒來之後，他卻成為一個堅信上帝存在的人。更因為他是個學有專精的醫學專家，能夠舉證歷歷解釋大腦不可能自己塑造出這些「幻覺」，而使得他的立論更加令人信服。\n \n\n《我看見了天堂》就是艾本醫師不可思議卻又千真萬確的死後經驗，全書有著豐沛的情感、深刻的自我剖析，在科學佐證的同時，有著對於來生、造物主、天使與奇蹟的追尋與感念。這是一部關於瀕死經驗的突破性著作，更是一部探索靈魂、扣問生命意義的大愛之書。\n \n\n本書今年初在國際出版界引起轟動，美國版權由 Simon & Schuster 搶下，之後一個月內賣出英國、德國、荷蘭、俄國、澳洲、巴西、捷克、斯洛伐克、羅馬尼亞、日本、韓國、中國大陸和台灣等十五國版權。Simon & Schuster 原訂明年二月推出，後來又緊急決定提前到十月底，鎖定今年的耶誕節檔期，足見其重視程度。十月初，美國媒體開始報導這本書，短短驚人的媒體效應在短短幾天內便將《我看見了天堂》送上亞瑪遜總榜冠軍寶座。\n\n中央社報導，蘋果日報報導", "summary": "介紹神經外科醫師艾本‧亞歷山大的瀕死體驗回憶錄，無神論者在昏迷期間的「天堂」見聞，引發科學與靈性廣泛討論，版權售出十五國。", "tags": {"type": ["書介/書訊"], "genre": ["非文學/回憶錄"], "growth": ["世界觀察"], "era": ["版權輸入"]}}, {"title": "跨越時空的禁忌之戀：《永恆的戀人》", "date": "2012-09-25", "year": 2012, "body": "版權書訊>文學類>歷史/愛情小說\n\nTHE TAKER by Alma Katsu 版權狀況：已售出簡體中文版權\n\n《永恆的戀人》是一部黑暗優雅，集懸疑、邪惡、歷史和情慾於一身的超自然傳奇小說，也是一個讓人心碎的愛情故事，被英國出版界譽為超越《歷史學家》，美國書評家則認為媲美安萊絲，有如成人版的《暮光之城》。本書作者勝愛瑪是記者出身，曾在美國中情局任職，後來大病一場險些喪命，遂決定重新提筆創作，根據她三十年前構思的短篇，擴寫而成《永恆的戀人》。在文學經紀人彼德‧史坦伯格（Peter Steinberg, 《失竊的孩子》）推薦下，本書迅速由 Simon & Schuter 集團旗下的大眾文學品牌 「藝廊」出版社（Gallery Books）用六位數美金簽下，英國則由藍燈書屋集團的 Century /Arrow 品牌買下。\n \n\n《永恆的戀人》在 2011 年底出版後好評不斷，獲選美國書單雜誌 2011 年十大新人小說。藝廊出版社的編輯看中這故事系列發展的潛力，在勝愛瑪交出續集大綱之後、未寫半字的情況下，立即高價簽下兩部續集《永恆的復仇》（The Reckoning）及《永恆的沉淪》（The Descent），構成完整三部曲。英國編輯隨後也跟進買下版權。本系列現已售出美國、英國、法國、義大利、西班牙、俄國、波蘭、土耳其、巴西、捷克、匈牙利、保加利亞、克羅埃西亞、澳洲、紐西蘭等十五國版權，簡體中文版權甫由中國最大的網路文學公司「起點中文網」簽下。\n\n這是一則跨越時空的不尋常愛情故事，故事從美國東北緬因州的小鎮風雪夜揭開序幕，芬德雷醫師寂寞地守著診所、值著夜班。突然警笛大作，救護車送進來一名全身是血的妙齡女子，警長表示森林裡發生了兇殺案，而這位女子便是殺人兇手！\n \n\n芬德雷醫師瞠目結舌地看著少女用銳利的手術刀劃開自己的身體，卻轉瞬間痊癒。她只有一個要求：要他聽她述說自己的故事，然後再決定是否要助她脫逃。「你是否曾經愛得無怨無悔，為了對方，甚至願意偷拐搶騙、知法犯法，把自己獻給陌生人，或與暴徒狼狽為奸？為了對方，願意放棄自己的生命，甚至動手殺人？」名叫蓮諾兒的女子於是說起了她與愛人的故事，那要追溯到兩百年前，地點同樣是這個文明邊疆的寒荒小鎮，當時，這裡還是個清教徒的聚落。\n \n\n當時的蓮諾兒只有十歲，但她只看了強納森一眼，便知道自己將愛他一輩子。可是強納森是村中富商的兒子，與自己地位懸殊，勢必不可能結合。歷經千辛萬苦，蓮諾兒如願成為強納森的愛人，卻因為懷孕而被父親趕出家門。\n \n\n她隻身流浪到波士頓，認識了來自匈牙利的亞戴爾伯爵和他的手下。他們過著極盡奢華的生活，亞戴爾甚至賜予蓮諾兒永恆的生命，並向她說出自己的祕密：原來他從十四世紀活到今天，曾師事邪惡的鍊金術士，幫助他引誘和謀害處女。\n \n\n蓮諾兒終於明白，伯爵真正的目標是強納森，那個金髮白膚，令所有人為之傾倒的俊美少年。伯爵自知肉體老朽，意圖侵佔強納森的青春軀體，繼續逍遙下去。這對苦命鴛鴦決定遠走高飛，然而轉眼兩百年過去，伯爵仍然緊追在後，為了愛人，蓮諾兒決定取其性命……\n \n\n《永恆的戀人》結合了歐洲和美國早期的傳說故事，既是一個跨越古今的鬼故事，也是一則淒美的成人童話，更是一個探討真愛和生命意義的寓言。作者勝愛瑪是日裔美籍，曾在大作家約翰‧厄文門下學習寫作，並取得約翰霍普金斯大學的創作學位。本書是她的第一部長篇小說，續集《永恆的復仇》今年夏季剛於英美上市。完結篇《永恆的沉淪》預計 2013 年推出（英文，精裝，448 頁，Gallery，ISBN: 1439197059，9/11，原文約 135,000 字）。", "summary": "介紹超自然愛情小說《永恆的戀人》，跨越十九世紀美洲荒野與現代緬因州的禁忌之戀，集懸疑、歷史與情慾於一身。作者曾任職美國中情局，大病後轉行寫作。", "tags": {"type": ["書介/書訊"], "genre": ["奇幻", "愛情/歷史"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}];

// ── State ─────────────────────────────────────────────────────────────────────
let active = {type:new Set(),genre:new Set(),growth:new Set(),era:new Set()};
let activeYear = null, searchQ = '';

function allTags(cat){ return [...new Set(ARTICLES.flatMap(a=>a.tags[cat]))].sort() }

function renderChips(id, cat){
  const c = document.getElementById(id);
  allTags(cat).forEach(t=>{
    const el = document.createElement('span');
    el.className = `chip ${cat}`;
    el.textContent = t;
    el.onclick = ()=>{ active[cat].has(t)?active[cat].delete(t):active[cat].add(t); el.classList.toggle('active'); render(); };
    c.appendChild(el);
  });
}

function buildYearNav(){
  const years = [...new Set(ARTICLES.map(a=>a.year))].sort();
  const nav = document.getElementById('year-nav');
  years.forEach(y=>{
    const btn = document.createElement('button');
    btn.className='year-btn'; btn.textContent=y; btn.dataset.year=y;
    btn.onclick=()=>{ activeYear=activeYear===y?null:y; nav.querySelectorAll('.year-btn').forEach(b=>b.classList.toggle('active',b.dataset.year==activeYear)); render(); };
    nav.appendChild(btn);
  });
}

function tagHtml(tags, cats){
  return cats.flatMap(cat=>tags[cat].map(t=>`<span class="tag ${cat}">${t}</span>`)).join('');
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const q = searchQ.toLowerCase();
  let visible = 0;
  ARTICLES.forEach((a,i)=>{
    const pass =
      (!q || a.title.toLowerCase().includes(q) || a.summary.toLowerCase().includes(q) || a.body.toLowerCase().includes(q)) &&
      (!activeYear || a.year==activeYear) &&
      ['type','genre','growth','era'].every(cat=>active[cat].size===0||[...active[cat]].some(t=>a.tags[cat].includes(t)));
    if(!pass) return;
    visible++;
    const card = document.createElement('div');
    card.className='card'; card.onclick=()=>openModal(i);
    const gTags = a.tags.growth.filter(t=>t&&t!=='—');
    card.innerHTML = `
      <div class="card-meta"><span class="card-year">${a.year}</span><span>${a.date}</span></div>
      <div class="card-title">${a.title}</div>
      <div class="card-summary">${a.summary}</div>
      <div class="card-tags">${tagHtml(a.tags,['type','genre','era'])}</div>
      ${gTags.length?`<div class="growth-flag">${gTags.join('・')}</div>`:''}`;
    grid.appendChild(card);
  });
  if(!visible){ const el=document.createElement('div'); el.className='no-results'; el.textContent='沒有符合條件的文章。'; grid.appendChild(el); }
  document.getElementById('visible-count').textContent = visible;
}

function openModal(i){
  const a = ARTICLES[i];
  document.getElementById('modal-meta').innerHTML = `<span class="card-year" style="font-family:sans-serif">${a.year}</span>${a.date}`;
  document.getElementById('modal-title').textContent = a.title;
  document.getElementById('modal-tags').innerHTML = tagHtml(a.tags,['type','genre','growth','era']);
  document.getElementById('modal-summary').textContent = a.summary;
  const gTags = a.tags.growth.filter(t=>t&&t!=='—');
  const gb = document.getElementById('modal-growth');
  if(gTags.length){ document.getElementById('modal-growth-text').textContent=gTags.join('・'); gb.style.display='block'; }
  else { gb.style.display='none'; }
  document.getElementById('modal-body').textContent = a.body;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){ if(e.target===document.getElementById('overlay')) closeModalBtn(); }
function closeModalBtn(){ document.getElementById('overlay').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModalBtn(); });

document.getElementById('search-input').addEventListener('input',e=>{ searchQ=e.target.value; render(); });
function clearAll(){ active={type:new Set(),genre:new Set(),growth:new Set(),era:new Set()}; activeYear=null; searchQ=''; document.getElementById('search-input').value=''; document.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active')); document.querySelectorAll('.year-btn.active').forEach(b=>b.classList.remove('active')); render(); }

function init(){
  renderChips('chips-type','type');
  renderChips('chips-genre','genre');
  renderChips('chips-growth','growth');
  renderChips('chips-era','era');
  buildYearNav();
  render();
}
</script>
</body>
</html>
