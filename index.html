\u7015\u6b7b\u7d93\u9a57\u7684\u7a81\u7834\u6027\u8457\u4f5c\uff0c\u66f4\u662f\u4e00\u90e8\u63a2\u7d22\u9748\u9b42\u3001\u6263\u554f\u751f\u547d\u610f\u7fa9\u7684\u5927\u611b\u4e4b\u66f8\u3002\\n \\n\\n\u672c\u66f8\u4eca\u5e74\u521d\u5728\u570b\u969b\u51fa\u7248\u754c\u5f15\u8d77\u8f5f\u52d5\uff0c\u7f8e\u570b\u7248\u6b0a\u7531 Simon & Schuster \u6436\u4e0b\uff0c\u4e4b\u5f8c\u4e00\u500b\u6708\u5167\u8ce3\u51fa\u82f1\u570b\u3001\u5fb7\u570b\u3001\u8377\u862d\u3001\u4fc4\u570b\u3001\u6fb3\u6d32\u3001\u5df4\u897f\u3001\u6377\u514b\u3001\u65af\u6d1b\u4f10\u514b\u3001\u7f85\u99ac\u5c3c\u4e9e\u3001\u65e5\u672c\u3001\u97d3\u570b\u3001\u4e2d\u570b\u5927\u9678\u548c\u53f0\u7063\u7b49\u5341\u4e94\u570b\u7248\u6b0a\u3002Simon & Schuster \u539f\u8a02\u660e\u5e74\u4e8c\u6708\u63a8\u51fa\uff0c\u5f8c\u4f86\u53c8\u7dca\u6025\u6c7a\u5b9a\u63d0\u524d\u5230\u5341\u6708\u5e95\uff0c\u9396\u5b9a\u4eca\u5e74\u7684\u8036\u8a95\u7bc0\u6a94\u671f\uff0c\u8db3\u898b\u5176\u91cd\u8996\u7a0b\u5ea6\u3002\u5341\u6708\u521d\uff0c\u7f8e\u570b\u5a92\u9ad4\u958b\u59cb\u5831\u5c0e\u9019\u672c\u66f8\uff0c\u77ed\u77ed\u9a5a\u4eba\u7684\u5a92\u9ad4\u6548\u61c9\u5728\u77ed\u77ed\u5e7e\u5929\u5167\u4fbf\u5c07\u300a\u6211\u770b\u898b\u4e86\u5929\u5802\u300b\u9001\u4e0a\u4e9e\u746a\u905c\u7e3d\u699c\u51a0\u8ecd\u5bf6\u5ea7\u3002\\n\\n\u4e2d\u592e\u793e\u5831\u5c0e\uff0c\u860b\u679c\u65e5\u5831\u5831\u5c0e\",\n    \"summary\": \"\u4ecb\u7d39\u795e\u7d93\u5916\u79d1\u91ab\u5e2b\u827e\u672c\u2027\u4e9e\u6b77\u5c71\u5927\u7684\u7015\u6b7b\u9ad4\u9a57\u56de\u61b6\u9304\uff0c\u7121\u795e\u8ad6\u8005\u5728\u660f\u8ff7\u671f\u9593\u7684\u300c\u5929\u5802\u300d\u898b\u805e\uff0c\u5f15\u767c\u79d1\u5b78\u8207\u9748\u6027\u7684\u5ee3\u6cdb\u8a0e\u8ad6\uff0c\u7248\u6b0a\u552e\u51fa\u5341\u4e94\u570b\u3002\",\n    \"tags\": {\n      \"type\": [\n        \"\u66f8\u4ecb/\u66f8\u8a0a\"\n      ],\n      \"genre\": [\n        \"\u975e\u6587\u5b78/\u56de\u61b6\u9304\"\n      ],\n      \"growth\": [\n        \"\u4e16\u754c\u89c0\u5bdf\"\n      ],\n      \"era\": [\n        \"\u7248\u6b0a\u8f38\u5165\"\n      ]\n    }\n  },\n  {\n    \"title\": \"\u8de8\u8d8a\u6642\u7a7a\u7684\u7981\u5fcc\u4e4b\u6200\uff1a\u300a\u6c38\u6046\u7684\u6200\u4eba\u300b\",\n    \"date\": \"2012-09-25\",\n    \"year\": 2012,\n    \"body\": \"\u7248\u6b0a\u66f8\u8a0a>\u6587\u5b78\u985e>\u6b77\u53f2/\u611b\u60c5\u5c0f\u8aaa\\n\\nTHE TAKER by Alma Katsu \u7248\u6b0a\u72c0\u6cc1\uff1a\u5df2\u552e\u51fa\u7c21\u9ad4\u4e2d\u6587\u7248\u6b0a\\n\\n\u300a\u6c38\u6046\u7684\u6200\u4eba\u300b\u662f\u4e00\u90e8\u9ed1\u6697\u512a\u96c5\uff0c\u96c6\u61f8\u7591\u3001\u90aa\u60e1\u3001\u6b77\u53f2\u548c\u60c5\u617e\u65bc\u4e00\u8eab\u7684\u8d85\u81ea\u7136\u50b3\u5947\u5c0f\u8aaa\uff0c\u4e5f\u662f\u4e00\u500b\u8b93\u4eba\u5fc3\u788e\u7684\u611b\u60c5\u6545\u4e8b\uff0c\u88ab\u82f1\u570b\u51fa\u7248\u754c\u8b7d\u70ba\u8d85\u8d8a\u300a\u6b77\u53f2\u5b78\u5bb6\u300b\uff0c\u7f8e\u570b\u66f8\u8a55\u5bb6\u5247\u8a8d\u70ba\u5ab2\u7f8e\u5b89\u840a\u7d72\uff0c\u6709\u5982\u6210\u4eba\u7248\u7684\u300a\u66ae\u5149\u4e4b\u57ce\u300b\u3002\u672c\u66f8\u4f5c\u8005\u52dd\u611b\u746a\u662f\u8a18\u8005\u51fa\u8eab\uff0c\u66fe\u5728\u7f8e\u570b\u4e2d\u60c5\u5c40\u4efb\u8077\uff0c\u5f8c\u4f86\u5927\u75c5\u4e00\u5834\u96aa\u4e9b\u55aa\u547d\uff0c\u9042\u6c7a\u5b9a\u91cd\u65b0\u63d0\u7b46\u5275\u4f5c\uff0c\u6839\u64da\u5979\u4e09\u5341\u5e74\u524d\u69cb\u601d\u7684\u77ed\u7bc7\uff0c\u64f4\u5beb\u800c\u6210\u300a\u6c38\u6046\u7684\u6200\u4eba\u300b\u3002\u5728\u6587\u5b78\u7d93\u7d00\u4eba\u5f7c\u5fb7\u2027\u53f2\u5766\u4f2f\u683c\uff08Peter Steinberg, \u300a\u5931\u7aca\u7684\u5b69\u5b50\u300b\uff09\u63a8\u85a6\u4e0b\uff0c\u672c\u66f8\u8fc5\u901f\u7531 Simon & Schuter \u96c6\u5718\u65d7\u4e0b\u7684\u5927\u773e\u6587\u5b78\u54c1\u724c \u300c\u85dd\u5eca\u300d\u51fa\u7248\u793e\uff08Gallery Books\uff09\u7528\u516d\u4f4d\u6578\u7f8e\u91d1\u7c3d\u4e0b\uff0c\u82f1\u570b\u5247\u7531\u85cd\u71c8\u66f8\u5c4b\u96c6\u5718\u7684 Century /Arrow \u54c1\u724c\u8cb7\u4e0b\u3002\\n \\n\\n\u300a\u6c38\u6046\u7684\u6200\u4eba\u300b\u5728 2011 \u5e74\u5e95\u51fa\u7248\u5f8c\u597d\u8a55\u4e0d\u65b7\uff0c\u7372\u9078\u7f8e\u570b\u66f8\u55ae\u96dc\u8a8c 2011 \u5e74\u5341\u5927\u65b0\u4eba\u5c0f\u8aaa\u3002\u85dd\u5eca\u51fa\u7248\u793e\u7684\u7de8\u8f2f\u770b\u4e2d\u9019\u6545\u4e8b\u7cfb\u5217\u767c\u5c55\u7684\u6f5b\u529b\uff0c\u5728\u52dd\u611b\u746a\u4ea4\u51fa\u7e8c\u96c6\u5927\u7db1\u4e4b\u5f8c\u3001\u672a\u5beb\u534a\u5b57\u7684\u60c5\u6cc1\u4e0b\uff0c\u7acb\u5373\u9ad8\u50f9\u7c3d\u4e0b\u5169\u90e8\u7e8c\u96c6\u300a\u6c38\u6046\u7684\u5fa9\u4ec7\u300b\uff08The Reckoning\uff09\u53ca\u300a\u6c38\u6046\u7684\u6c89\u6dea\u300b\uff08The Descent\uff09\uff0c\u69cb\u6210\u5b8c\u6574\u4e09\u90e8\u66f2\u3002\u82f1\u570b\u7de8\u8f2f\u96a8\u5f8c\u4e5f\u8ddf\u9032\u8cb7\u4e0b\u7248\u6b0a\u3002\u672c\u7cfb\u5217\u73fe\u5df2\u552e\u51fa\u7f8e\u570b\u3001\u82f1\u570b\u3001\u6cd5\u570b\u3001\u7fa9\u5927\u5229\u3001\u897f\u73ed\u7259\u3001\u4fc4\u570b\u3001\u6ce2\u862d\u3001\u571f\u8033\u5176\u3001\u5df4\u897f\u3001\u6377\u514b\u3001\u5308\u7259\u5229\u3001\u4fdd\u52a0\u5229\u4e9e\u3001\u514b\u7f85\u57c3\u897f\u4e9e\u3001\u6fb3\u6d32\u3001\u7d10\u897f\u862d\u7b49\u5341\u4e94\u570b\u7248\u6b0a\uff0c\u7c21\u9ad4\u4e2d\u6587\u7248\u6b0a\u752b\u7531\u4e2d\u570b\u6700\u5927\u7684\u7db2\u8def\u6587\u5b78\u516c\u53f8\u300c\u8d77\u9ede\u4e2d\u6587\u7db2\u300d\u7c3d\u4e0b\u3002\\n\\n\u9019\u662f\u4e00\u5247\u8de8\u8d8a\u6642\u7a7a\u7684\u4e0d\u5c0b\u5e38\u611b\u60c5\u6545\u4e8b\uff0c\u6545\u4e8b\u5f9e\u7f8e\u570b\u6771\u5317\u7dec\u56e0\u5dde\u7684\u5c0f\u93ae\u98a8\u96ea\u591c\u63ed\u958b\u5e8f\u5e55\uff0c\u82ac\u5fb7\u96f7\u91ab\u5e2b\u5bc2\u5bde\u5730\u5b88\u8457\u8a3a\u6240\u3001\u503c\u8457\u591c\u73ed\u3002\u7a81\u7136\u8b66\u7b1b\u5927\u4f5c\uff0c\u6551\u8b77\u8eca\u9001\u9032\u4f86\u4e00\u540d\u5168\u8eab\u662f\u8840\u7684\u5999\u9f61\u5973\u5b50\uff0c\u8b66\u9577\u8868\u793a\u68ee\u6797\u88e1\u767c\u751f\u4e86\u5147\u6bba\u6848\uff0c\u800c\u9019\u4f4d\u5973\u5b50\u4fbf\u662f\u6bba\u4eba\u5147\u624b\uff01\\n \\n\\n\u82ac\u5fb7\u96f7\u91ab\u5e2b\u77a0\u76ee\u7d50\u820c\u5730\u770b\u8457\u5c11\u5973\u7528\u92b3\u5229\u7684\u624b\u8853\u5200\u5283\u958b\u81ea\u5df1\u7684\u8eab\u9ad4\uff0c\u537b\u8f49\u77ac\u9593\u75ca\u7652\u3002\u5979\u53ea\u6709\u4e00\u500b\u8981\u6c42\uff1a\u8981\u4ed6\u807d\u5979\u8ff0\u8aaa\u81ea\u5df1\u7684\u6545\u4e8b\uff0c\u7136\u5f8c\u518d\u6c7a\u5b9a\u662f\u5426\u8981\u52a9\u5979\u812b\u9003\u3002\u300c\u4f60\u662f\u5426\u66fe\u7d93\u611b\u5f97\u7121\u6028\u7121\u6094\uff0c\u70ba\u4e86\u5c0d\u65b9\uff0c\u751a\u81f3\u9858\u610f\u5077\u62d0\u6436\u9a19\u3001\u77e5\u6cd5\u72af\u6cd5\uff0c\u628a\u81ea\u5df1\u737b\u7d66\u964c\u751f\u4eba\uff0c\u6216\u8207\u66b4\u5f92\u72fc\u72fd\u70ba\u5978\uff1f\u70ba\u4e86\u5c0d\u65b9\uff0c\u9858\u610f\u653e\u68c4\u81ea\u5df1\u7684\u751f\u547d\uff0c\u751a\u81f3\u52d5\u624b\u6bba\u4eba\uff1f\u300d\u540d\u53eb\u84ee\u8afe\u5152\u7684\u5973\u5b50\u65bc\u662f\u8aaa\u8d77\u4e86\u5979\u8207\u611b\u4eba\u7684\u6545\u4e8b\uff0c\u90a3\u8981\u8ffd\u6eaf\u5230\u5169\u767e\u5e74\u524d\uff0c\u5730\u9ede\u540c\u6a23\u662f\u9019\u500b\u6587\u660e\u908a\u7586\u7684\u5bd2\u8352\u5c0f\u93ae\uff0c\u7576\u6642\uff0c\u9019\u88e1\u9084\u662f\u500b\u6e05\u6559\u5f92\u7684\u805a\u843d\u3002\\n \\n\\n\u7576\u6642\u7684\u84ee\u8afe\u5152\u53ea\u6709\u5341\u6b72\uff0c\u4f46\u5979\u53ea\u770b\u4e86\u5f37\u7d0d\u68ee\u4e00\u773c\uff0c\u4fbf\u77e5\u9053\u81ea\u5df1\u5c07\u611b\u4ed6\u4e00\u8f29\u5b50\u3002\u53ef\u662f\u5f37\u7d0d\u68ee\u662f\u6751\u4e2d\u5bcc\u5546\u7684\u5152\u5b50\uff0c\u8207\u81ea\u5df1\u5730\u4f4d\u61f8\u6b8a\uff0c\u52e2\u5fc5\u4e0d\u53ef\u80fd\u7d50\u5408\u3002\u6b77\u7d93\u5343\u8f9b\u842c\u82e6\uff0c\u84ee\u8afe\u5152\u5982\u9858\u6210\u70ba\u5f37\u7d0d\u68ee\u7684\u611b\u4eba\uff0c\u537b\u56e0\u70ba\u61f7\u5b55\u800c\u88ab\u7236\u89aa\u8d95\u51fa\u5bb6\u9580\u3002\\n \\n\\n\u5979\u96bb\u8eab\u6d41\u6d6a\u5230\u6ce2\u58eb\u9813\uff0c\u8a8d\u8b58\u4e86\u4f86\u81ea\u5308\u7259\u5229\u7684\u4e9e\u6234\u723e\u4f2f\u7235\u548c\u4ed6\u7684\u624b\u4e0b\u3002\u4ed6\u5011\u904e\u8457\u6975\u76e1\u5962\u83ef\u7684\u751f\u6d3b\uff0c\u4e9e\u6234\u723e\u751a\u81f3\u8cdc\u4e88\u84ee\u8afe\u5152\u6c38\u6046\u7684\u751f\u547d\uff0c\u4e26\u5411\u5979\u8aaa\u51fa\u81ea\u5df1\u7684\u7955\u5bc6\uff1a\u539f\u4f86\u4ed6\u5f9e\u5341\u56db\u4e16\u7d00\u6d3b\u5230\u4eca\u5929\uff0c\u66fe\u5e2b\u4e8b\u90aa\u60e1\u7684\u934a\u91d1\u8853\u58eb\uff0c\u5e6b\u52a9\u4ed6\u5f15\u8a98\u548c\u8b00\u5bb3\u8655\u5973\u3002\\n \\n\\n\u84ee\u8afe\u5152\u7d42\u65bc\u660e\u767d\uff0c\u4f2f\u7235\u771f\u6b63\u7684\u76ee\u6a19\u662f\u5f37\u7d0d\u68ee\uff0c\u90a3\u500b\u91d1\u9aee\u767d\u819a\uff0c\u4ee4\u6240\u6709\u4eba\u70ba\u4e4b\u50be\u5012\u7684\u4fca\u7f8e\u5c11\u5e74\u3002\u4f2f\u7235\u81ea\u77e5\u8089\u9ad4\u8001\u673d\uff0c\u610f\u5716\u4fb5\u4f54\u5f37\u7d0d\u68ee\u7684\u9752\u6625\u8ec0\u9ad4\uff0c\u7e7c\u7e8c\u900d\u9059\u4e0b\u53bb\u3002\u9019\u5c0d\u82e6\u547d\u9d1b\u9d26\u6c7a\u5b9a\u9060\u8d70\u9ad8\u98db\uff0c\u7136\u800c\u8f49\u773c\u5169\u767e\u5e74\u904e\u53bb\uff0c\u4f2f\u7235\u4ecd\u7136\u7dca\u8ffd\u5728\u5f8c\uff0c\u70ba\u4e86\u611b\u4eba\uff0c\u84ee\u8afe\u5152\u6c7a\u5b9a\u53d6\u5176\u6027\u547d\u2026\u2026\\n \\n\\n\u300a\u6c38\u6046\u7684\u6200\u4eba\u300b\u7d50\u5408\u4e86\u6b50\u6d32\u548c\u7f8e\u570b\u65e9\u671f\u7684\u50b3\u8aaa\u6545\u4e8b\uff0c\u65e2\u662f\u4e00\u500b\u8de8\u8d8a\u53e4\u4eca\u7684\u9b3c\u6545\u4e8b\uff0c\u4e5f\u662f\u4e00\u5247\u6dd2\u7f8e\u7684\u6210\u4eba\u7ae5\u8a71\uff0c\u66f4\u662f\u4e00\u500b\u63a2\u8a0e\u771f\u611b\u548c\u751f\u547d\u610f\u7fa9\u7684\u5bd3\u8a00\u3002\u4f5c\u8005\u52dd\u611b\u746a\u662f\u65e5\u88d4\u7f8e\u7c4d\uff0c\u66fe\u5728\u5927\u4f5c\u5bb6\u7d04\u7ff0\u2027\u5384\u6587\u9580\u4e0b\u5b78\u7fd2\u5beb\u4f5c\uff0c\u4e26\u53d6\u5f97\u7d04\u7ff0\u970d\u666e\u91d1\u65af\u5927\u5b78\u7684\u5275\u4f5c\u5b78\u4f4d\u3002\u672c\u66f8\u662f\u5979\u7684\u7b2c\u4e00\u90e8\u9577\u7bc7\u5c0f\u8aaa\uff0c\u7e8c\u96c6\u300a\u6c38\u6046\u7684\u5fa9\u4ec7\u300b\u4eca\u5e74\u590f\u5b63\u525b\u65bc\u82f1\u7f8e\u4e0a\u5e02\u3002\u5b8c\u7d50\u7bc7\u300a\u6c38\u6046\u7684\u6c89\u6dea\u300b\u9810\u8a08 2013 \u5e74\u63a8\u51fa\uff08\u82f1\u6587\uff0c\u7cbe\u88dd\uff0c448 \u9801\uff0cGallery\uff0cISBN: 1439197059\uff0c9/11\uff0c\u539f\u6587\u7d04 135,000 \u5b57\uff09\u3002\",\n    \"summary\": \"\u4ecb\u7d39\u8d85\u81ea\u7136\u611b\u60c5\u5c0f\u8aaa\u300a\u6c38\u6046\u7684\u6200\u4eba\u300b\uff0c\u8de8\u8d8a\u5341\u4e5d\u4e16\u7d00\u7f8e\u6d32\u8352\u91ce\u8207\u73fe\u4ee3\u7dec\u56e0\u5dde\u7684\u7981\u5fcc\u4e4b\u6200\uff0c\u96c6\u61f8\u7591\u3001\u6b77\u53f2\u8207\u60c5\u617e\u65bc\u4e00\u8eab\u3002\u4f5c\u8005\u66fe\u4efb\u8077\u7f8e\u570b\u4e2d\u60c5\u5c40\uff0c\u5927\u75c5\u5f8c\u8f49\u884c\u5beb\u4f5c\u3002\",\n    \"tags\": {\n      \"type\": [\n        \"\u66f8\u4ecb/\u66f8\u8a0a\"\n      ],\n      \"genre\": [\n        \"\u5947\u5e7b\",\n        \"\u611b\u60c5/\u6b77\u53f2\"\n      ],\n      \"growth\": [\n        \"\u95b1\u8b80\u9ad4\u9a57\"\n      ],\n      \"era\": [\n        \"\u7248\u6b0a\u8f38\u5165\"\n      ]\n    }\n  }\n];\n\n// \u2500\u2500 Tag category colours \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst CAT = {\n  type:'type', genre:'genre', growth:'growth', era:'era'\n};\n\n// \u2500\u2500 State \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nlet active = {type:new Set(), genre:new Set(), growth:new Set(), era:new Set()};\nlet activeYear = null;\nlet searchQ = '';\n\n// \u2500\u2500 Build tag pools \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction allTags(cat){ return [...new Set(ARTICLES.flatMap(a=>a.tags[cat]))].sort() }\n\nfunction renderChips(containerId, cat){\n  const c = document.getElementById(containerId);\n  allTags(cat).forEach(t=>{\n    const el = document.createElement('span');\n    el.className = `chip ${cat}`;\n    el.textContent = t;\n    el.onclick = () => toggleChip(el, cat, t);\n    c.appendChild(el);\n  });\n}\n\nfunction toggleChip(el, cat, t){\n  if(active[cat].has(t)){ active[cat].delete(t); el.classList.remove('active'); }\n  else { active[cat].add(t); el.classList.add('active'); }\n  render();\n}\n\n// \u2500\u2500 Year nav \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction buildYearNav(){\n  const years = [...new Set(ARTICLES.map(a=>a.year))].sort();\n  const nav = document.getElementById('year-nav');\n  years.forEach(y=>{\n    const btn = document.createElement('button');\n    btn.className='year-btn'; btn.textContent=y; btn.dataset.year=y;\n    btn.onclick=()=>{ activeYear = activeYear===y ? null : y;\n      nav.querySelectorAll('.year-btn').forEach(b=>b.classList.toggle('active', b.dataset.year==activeYear));\n      render(); };\n    nav.appendChild(btn);\n  });\n}\n\n// \u2500\u2500 Render cards \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction render(){\n  const grid = document.getElementById('grid');\n  grid.innerHTML='';\n  let visible=0;\n  const q = searchQ.toLowerCase();\n\n  ARTICLES.forEach((a,i)=>{\n    const pass =\n      (!q || a.title.toLowerCase().includes(q) || a.summary.toLowerCase().includes(q) || a.body.toLowerCase().includes(q)) &&\n      (!activeYear || a.year==activeYear) &&\n      (['type','genre','growth','era'].every(cat=>\n        active[cat].size===0 || [...active[cat]].some(t=>a.tags[cat].includes(t))));\n\n    if(!pass){\n      const ph=document.createElement('div'); ph.className='card hidden'; grid.appendChild(ph);\n      return;\n    }\n    visible++;\n\n    const card = document.createElement('div');\n    card.className='card';\n    card.onclick=()=>openModal(i);\n\n    const growthHtml = a.tags.growth.length && a.tags.growth[0]!=='\u2014'\n      ? `<div class=\"growth-flag\">${a.tags.growth.join('\u30fb')}</div>` : '';\n\n    card.innerHTML = `\n      <div class=\"card-meta\">\n        <span class=\"card-year\">${a.year}</span>\n        <span>${a.date}</span>\n      </div>\n      <div class=\"card-title\">${a.title}</div>\n      <div class=\"card-summary\">${a.summary}</div>\n      <div class=\"card-tags\">${renderTagsHtml(a.tags)}</div>\n      ${growthHtml}\n    `;\n    grid.appendChild(card);\n  });\n\n  if(visible===0){\n    const el=document.createElement('div');\n    el.className='no-results'; el.textContent='\u6c92\u6709\u7b26\u5408\u689d\u4ef6\u7684\u6587\u7ae0\u3002\u8acb\u8abf\u6574\u7be9\u9078\u689d\u4ef6\u3002';\n    grid.appendChild(el);\n  }\n  document.getElementById('visible-count').textContent = visible;\n}\n\nfunction renderTagsHtml(tags){\n  let h='';\n  tags.type.forEach(t=>h+=`<span class=\"tag type\">${t}</span>`);\n  tags.genre.forEach(t=>h+=`<span class=\"tag genre\">${t}</span>`);\n  tags.era.forEach(t=>h+=`<span class=\"tag era\">${t}</span>`);\n  return h;\n}\n\n// \u2500\u2500 Modal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction openModal(i){\n  const a = ARTICLES[i];\n  document.getElementById('modal-meta').innerHTML =\n    `<span class=\"card-year\" style=\"font-family:sans-serif\">${a.year}</span> ${a.date}`;\n  document.getElementById('modal-title').textContent = a.title;\n  document.getElementById('modal-tags').innerHTML = renderTagsHtml(a.tags) +\n    a.tags.growth.filter(t=>t!=='\u2014').map(t=>`<span class=\"tag growth\">${t}</span>`).join('');\n  document.getElementById('modal-summary').textContent = a.summary;\n\n  const growthBox = document.getElementById('modal-growth');\n  const gTags = a.tags.growth.filter(t=>t!=='\u2014');\n  if(gTags.length){\n    document.getElementById('modal-growth-text').textContent = gTags.join('\u30fb');\n    growthBox.style.display='block';\n  } else {\n    growthBox.style.display='none';\n  }\n  document.getElementById('modal-body').textContent = a.body;\n  document.getElementById('overlay').classList.add('open');\n  document.body.style.overflow='hidden';\n}\n\nfunction closeModal(e){ if(e.target===document.getElementById('overlay')) closeModalBtn(); }\nfunction closeModalBtn(){\n  document.getElementById('overlay').classList.remove('open');\n  document.body.style.overflow='';\n}\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModalBtn(); });\n\n// \u2500\u2500 Search \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndocument.getElementById('search-input').addEventListener('input', e=>{\n  searchQ = e.target.value;\n  render();\n});\n\nfunction clearAll(){\n  active={type:new Set(),genre:new Set(),growth:new Set(),era:new Set()};\n  activeYear=null; searchQ='';\n  document.getElementById('search-input').value='';\n  document.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active'));\n  document.querySelectorAll('.year-btn.active').forEach(b=>b.classList.remove('active'));\n  render();\n}\n\n// \u2500\u2500 Init \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nrenderChips('chips-type','type');\nrenderChips('chips-genre','genre');\nrenderChips('chips-growth','growth');\nrenderChips('chips-era','era');\nbuildYearNav();\nrender();\n</script>\n</body>\n</html>\n");document.close();
  } else {
    const inp=document.getElementById('pw');
    document.getElementById('err').textContent='密碼錯誤，請再試一次。';
    inp.value='';inp.classList.remove('shake');
    void inp.offsetWidth;inp.classList.add('shake');
  }
}
</script>
