const ARTICLES = [{"title": "於是，就這樣開始了", "date": "2006-01-04", "year": 2006, "body": "想開設部落格有一段時間了，但總是怕自己懶。個人平台玩過不少，都是三分鐘熱度：電子報、BBS 個人版、PC Home 新聞台、phpBB 論壇，而我也始終沒有學會寫網頁。有過很多的雄心壯志，結果是缺乏續航力導致整片的荒蕪（還有某種奇妙的罪惡感）。blog 較之其他媒體更需要頻繁更新，我真的具備足夠的恆心毅力嗎？\n\n過去這兩年我學著放手，和很多曾以為要終生為伴（或至少有始有終）的事情說了再見。我收起禮筑外文書店的奇幻專櫃，辭去所有的翻譯工作，結束一個未竟的遊戲夢想，成了研究所的逃兵...我開始把全副心神投注在版權代理的工作上。幾經迷途，我似乎在出版的世界裡找到了適合自己能力和個性的一方天地。\n\n因為工作所需，我逐漸拓展閱讀視野，除了最熟悉最喜愛的奇幻類型，我也開始讀推理小說、文學小說、甚至歷史、言情小說。不只是文學類，還有科普、歷史、商管、心靈、生活、健康、傳記，許許多多對我全然陌生的書種。我畢竟一直是個只看小說的人啊。\n\n一年多下來，我驚覺自己對奇幻的熱情淡了。也許是因為國內讀者不夠，出版社瞭解有限、仍抱持保守態度；也許是因為寂寞，因為版權代理已經走到了出版的最上游；也許是因為自己的閱讀口味和國內其他讀者脫節太遠...我越來越看不下 high fantasy，但是題材創新搞怪的作品在這裡又找不到足夠的讀者群。我身處推理出版的鼎盛期，只越發覺得奇幻的邊緣和無力。我經歷過奇幻出版的很多角色：讀者、譯者、作者、推廣者、選書人、編輯、顧問、審稿、書商，到現在的版權代理，我可以直接和國外的作家和經紀人往來，在國際書展上見面，搶先得到一兩年後的新書資訊和改編電影事宜。可是，那又如何？當身邊沒有人認識這些作家、沒有人知道這些資料的寶貴、作家的份量，那麼這和我的個人自 high 有什麼差別？\n\n於是我逐漸明白：閱讀和書寫、工作和成就感，畢竟還是很個人、很私密的事啊。到頭來一切也不過就是對自己負責，如此而已。至於有沒有志同道合的人可以並肩作戰，相互切磋，那都是得之我幸、不得我命了。\n\n所以何必大張旗鼓，搞什麼看似偉大的運動或計畫？能夠顧好自己，已經足夠。我並不是消極或者灰心，也相信自己依然樂觀有夢，只是學著認清一些事實，例如弄個純然私人的 blog，應該是比規劃大型論壇結果門可羅雀，更實際而有用的罷？\n\n「灰鷹巢城」的名字有幾重意思。原本想過「灰鷹事務所」或「灰鷹的窩」（有朋友說這聽起來像寵物...）這類的名字，後來往「窩/巢」的方向去想，突然就想到了黑澤明的電影「蜘蛛巢城」。巢城一詞，確實是兼具了窩巢的私密和城寨的氣勢啊！而「冰與火之歌」裡，不也有一座險峻要塞叫做「鷹巢城」嗎？\n\n我刻意避開了「逐夢疆界」這個名字，就是想凸顯blog的個人性質。不要再以號召同好、行推廣大業為名，我也只能作我自己。\n\n「版權書訊」和「版權記事」與我的工作有關，內容是我代理中文版權的書訊，新消息，還有些個人心得。主要讀者大概還是出版界人士，不過其他朋友也可當作看故事、或是當作國外新書介紹囉。\n\n「灰鷹手記」顧名思義就是各式各樣的雜記，而「奇幻拾夢」則收錄我的新舊文章。我試圖藉由整理和書寫，重拾我的奇幻大夢，這是我對自己的一個承諾和期許。「電影音樂」則把電影和配樂放在一起，對我來說他們是不可分的。\n\n就這樣吧，就這樣開始了...", "summary": "部落格開篇之作。回顧幾經迷途後決定全職投入版權代理的心路，坦言對奇幻的熱情轉淡，以及在出版上游找到適合自己天地的轉折感悟。", "tags": {"type": ["個人隨筆"], "genre": [], "growth": ["職涯轉折", "工作意義", "情感流露"], "era": ["出版業轉型"]}}, {"title": "書展的季節", "date": "2006-01-24", "year": 2006, "body": "自從 2002 年開始參加國際書展，回家過年就成了工作的延續。那時還是以禮筑外文書店的名義參展，我要負責整個奇幻/科幻專櫃的選書和打包、裝箱、搬運。同時因為我是店裡少數男性之一，還得身兼搬運工，協助動輒上百箱外文書的運送工作。過完年隔週就是書展，回到台北立刻要準備進展場布置，所以一切打包都在趕在除夕前完成。\n\n書展為期五或六天，加上頭尾的布置和撤展，整整要去掉一個星期。每天清早出門，晚上累癱回家。第一年我剛升大四，沒經驗又遇上開學，翹了整星期的課跑書展。那時還住在宿舍，留長髮，習慣早上起來洗澡。正是最冷的二月時節，早上六、七點摸黑起床，梳洗完後趕去會場。650 公車不是很好等，基隆路又是出名的塞車路段，有時怕來不及，就叫計程車殺過去。那年 fnac 還是哪一家到會場開設咖啡廳，賣很好吃的可頌夾火腿和鳳梨，配 Snapples 果汁，我天天去報到。每天最大的樂趣之一，就是一早大家湊在一起訂便當。中午再輪流溜出去吃，有時就蹲在落地窗（和垃圾桶）旁，有時跑到外面屋簷下吹著冷風，後來學乖了搭手扶梯到二樓找長椅坐著吃。\n\n總之一切都很克難，很像打仗廝殺，人仰馬翻的。可是我一直很喜歡書展，大家可以這樣齊心協力聚在一起打拼；我也喜歡肢體勞動帶來的成就感（所以我完全同意宮部美幸所說「一定要流汗用力，才算是真正工作」）；當然還有遇到許多的新朋友舊朋友。\n\n轉眼都是第五次參加書展了。去年是我在禮筑的最後一次書展，同時也開始了版權工作，兩邊跑，更是瘋狂（其中有一天還五點多起來去中正機場接機，結果撲空 XD）。書展結束後一個月，就是倫敦書展，依照書展前兩個月開始排約的慣例，過年前也得通通打點好（雖然總會有些沒有預料到的 last-minute appointments）。去年我一邊在禮筑的攤位，一邊也在版權中心跟國內外出版社碰面、介紹書。本來台北書展以零售為重，版權銷售功能不強，更沒什麼版權代理和出版社約見面，和倫敦、法蘭克福等書展很不一樣。也許就是喜歡，或者該說是嚮往，國外書展那樣的版權會議場面，準備書單（rights guide），當面介紹，去年的我多少抱著有樣學樣的心態。\n\n今年的倫敦書展終於離開了狹小擁擠的 Olympic，改到位於市郊的新展場 ExCel，而且比往年提早到三月初。也就是說，台北書展結束後兩星期，就得趕赴倫敦了。每年最馬不停蹄的時候，可能就是年初吧。\n\n書展的季節到了。這幾天忙著準備書單、排國內外的約，還要挑書帶回家，過年期間看（就是把工作帶回家吧）。今年我們的攤位在A819，還舉辦了「古典歐洲」的版畫展，也歡迎大家來參觀。幫老闆把訊息張貼如下：\n\n歐洲並非大型的大陸，範圍由西邊的北海與大西洋，跨過歐亞大陸直到東邊的烏拉山，但卻擁有七億三千萬人口，是地球上人口密集的地區之一。在地貌上，歐洲可謂支離破碎，擁有許多大大小小的半島與島嶼。儘管這個大陸國家眾多，民族紛雜，但百分之九十的語言為印度日耳曼語系，百分之七十五的人口信仰基督教，教育、文化與生活形態上的差異並不巨大，處處可見古希臘羅馬與基督教文化留下的痕跡。\n\n歐洲這個名稱源自古希臘神話。傳說今日地中海東岸地區一個名為菲尼基的王國，其公主歐蘿芭（Europa/ Europe）被化身為公牛的希臘大神宙斯誘拐到克里特島西南岸，首度踏上「歐洲」的土地。從文化發展的角度來解釋，這則神話象徵著地中海東岸的民族跨海來到希臘進行農業墾殖，不僅攜來了該地的物質文明，亦輸入了東方世界的思想與生活方式。隨著古希臘羅馬文明的發展推演，歐洲的概念也由希臘一地逐步擴展，成為今日歐洲文明的基石。\n\n歐洲文明縱橫歷史上下兩千餘年，各地都有不同的風貌與特徵。本次展覽只能藉由部分版畫作品來呈現古典歐洲的粗略風情，挑出萊茵河、巴黎、君士坦丁堡與羅馬等地，這些不同的城市與地景在當時特有的版畫技法下，流露出不同於今日歐洲的風味，有的圖像記錄下過往的歷史，有的則見證了當時歐人的審美眼光。許多展品在版畫基礎上，配上當時畫師的手工潤飾，一躍而成為光華獨特的藝品，值得細細玩賞品味。\n\n至於我呢，大概就是在攤位或版權中心裡囉。或者該這麼說，我若不是在版權中心，就是在前往版權中心的路上。預祝大家春節快樂，書展順利囉！", "summary": "記錄從2002年起年年參加台北國際書展的早期記憶：身兼搬書工、選書員，在克難中感受眾人齊心打拼的凝聚感，以及書展帶來的人情溫度。", "tags": {"type": ["書展記事", "個人隨筆"], "genre": [], "growth": ["書展現場", "情感流露", "人際交流"], "era": ["台北書展"]}}, {"title": "Postscript: 倫敦書展 2006 (1)", "date": "2006-03-12", "year": 2006, "body": "原本上一篇要寫書展記事，不料就一直寫到電影去了。每次書展回來，都是千頭萬緒，太多故事密集壓縮，想說都不知從何說起。面對 MSN 上親朋好友的殷殷問候，只能徒呼負負。行李和房間百廢待舉，還有太多事情要追趕進度。我漸漸學會時差的調適，不過心情的轉換還有待加強。那麼，先給個簡單籠統的答案：這次倫敦書展很有收穫，非常非常有收穫。至於有哪些好書，則請期待我的倫敦書展報告（是不是應該接著：當然也請繼續按時收看本部落格？）。這篇只是書展雜記。\n\n倫敦是個神奇的城市。我是第二次去，對溫度和穿衣心裡有數，可是那兒的天氣依然令人嘖嘖稱奇。前一個禮拜才下過雪，剛到那天我們去 Portobello 市集，磚道縫隙還有殘霜。晴天特別冷，頂著大太陽兩手凍得發抖。下雨時反而溫暖，一點都不像台北的淒寒。星期四下午一陣莫名其妙的暴雨夾雜冰刨，我們人在 Waterstone's 書店，眼睜睜看著自動門來不及關上，強風掃落平台上的書，雨點打得到處都是。面對種種怪事，我和同行的微光只能苦笑，然後模仿歐文威爾森在皇家威龍裡的台詞：This country blows.\n\n今年倫敦書展首度離開市區，移師東區的 ExCel 展場。從我們下榻的旅館得搭地鐵再轉乘輕軌（Docklands Light Rail, DLR），一共要花四十多分鐘。我運氣好，沒碰上地鐵停駛之類的事情，不過類似的傳聞很多，總之把所有參展者都搞得老大不痛快，光在交通上就先扣十分。原以為換了新地點，應是場地寬闊，氣派非凡，誰知道只租借了南館，北館同時舉辦美容大展，兩造的對比鮮烈也稱得上本屆書展一絕。\n\n版權中心搞了兩個入口，我們這些沒租桌位的 visitor 不能從主入口進去，得繞遠路走邊門。這還不打緊，麻煩的是很多人約在版權中心入口，導致兩人分守兩邊的情形層出不窮。而版權中心裡位置擁擠，桌與桌之間行走困難，靠近主入口處冷風呼嘯，全都成了參展者抱怨的重點。更可怕的是，與外頭的出版社攤位展區相比，版權中心簡直是個天堂！走道窄小，通風不佳，廁所異常遙遠（不是藏在地下室就是躲在二樓），攤位標示不清，書展還沒結束，已經很多人說明年敬謝不敏，真是惡夢一場。\n\n那麼，有些什麼好書和相關消息呢？好比「吉屋出租」首演男主角安東尼瑞普（Anthony Rapp）的回憶錄，西班牙導演阿莫多瓦的小說集，約翰哈威的新書（這位評價甚高的犯罪小說家在轉換經紀人並推出新系列之後，終於得到他應得的肯定，新書大賣十萬冊，地鐵裡處處可見巨幅海報，寫著：「犯罪作家搭地鐵時都看誰的書？約翰哈威——給犯罪作家看的犯罪作家」），《在黑暗中漫舞》原著將重新出版，Jeff Kleinman 成立 Folio Literary Management 後賣出的第一本小說Finn，故事主角是《頑童流浪記》的哈克芬之父，北美版稅高達五十萬美金。達利‧安德森經紀公司的書展重點書是《海克利斯基因》（The Hercules Gene），號稱是「七寶奇謀加上鬥陣俱樂部的青少年版」，主角是繼承祖先神秘戰鬥力量的吉普賽少年，這個青少年動作驚悚系列預計十二本，而買下本書的正是當年發掘 JK 羅琳的超級編輯巴瑞‧康寧漢（Barry Cunningham）。\n\n《醜孩子》在英國賣得極好，出版五週蟬聯排行榜冠亞軍，賣座超過十萬冊，而且每週銷量節節上升，最新的數字是單週八千本。週五要離開倫敦前，翻開獨立報副刊，非文學排行榜冠軍便是《醜孩子》。《項塔藍》年底將於孟買開鏡，預算超過一億美金，從導演、編劇、製片和演員陣容看來，非常有問鼎奧斯卡的氣勢。《車神輓歌》賣出電影版權，將由環球影業投資，休傑克曼主演。李‧柴爾德的一系列傑克李契爾驚悚小說，也確定將由湯姆克魯斯監製或主演。《上帝的間諜》出版一個月在西班牙大賣四萬冊。《食夢者的玻璃書》日文版權終於敲定，由 Sony Magazine 買下，經紀人丹尼‧巴羅說他準備賭上一切，把這本書打造成全球超級暢銷書，作者甚至準備自掏腰包做宣傳，真是聽得我熱血沸騰。", "summary": "2006年倫敦書展歸來的第一手記錄。描述書展移師東區ExCel展場的種種不適，以及舊雨新知間的業界人情，是難得的現場側記。", "tags": {"type": ["書展記事"], "genre": [], "growth": ["書展現場", "人際交流"], "era": ["倫敦書展"]}}, {"title": "所謂的歸心似箭", "date": "2006-10-15", "year": 2006, "body": "照片是新啟用的曼谷機場，感覺還很空曠，有點科幻電影裡太空站的味道。\n\n第三次去法蘭克福書展。每次回來，都會遇到算不上大麻煩但有些哭笑不得的坎坷事。2004年第一次出國參加書展，還是個啥都不懂的菜鳥。回程得自己搭飛機，所有出關安檢的手續都沒概念，還要幫老闆帶古畫退稅。找半天找不到辦手續的地方，錯跑到檢查護照的櫃臺，一個臉極臭的女性官員在我重複多次用英文詢問之後依然不耐煩的說：「What!? What!?」以致於我懷疑是不是自己的英文有問題。拐彎抹角找到躲在角落裡的海關辦公室，進去只見兩個高大的男性警官，他們自始至終沒正眼瞧過我，彷彿我並不存在地蓋完章把文件丟還給我。那時我還不知道得拿證件回樓下另一個櫃臺拿退款，傻傻地上飛機了。今年重新又跑了一次這個流程，總算明白一件事：他們根本是刻意把退稅手續搞得既麻煩又難找，最好旅客知難而退，摸摸鼻子滾回國去。\n\n那次搭德航的飛機。我提著大幅的版畫登機，按照老闆的指示請空服員幫我保管，下機再交還，沒想到她一個勁地搖頭，說不行喔你得自己想辦法。我對飛機餐並不挑剔，也自信不是個難搞的乘客，是連按鈴叫空服員來討杯水喝都不好意思的那種。回程途中睡醒，口乾得難受，忍不住在空服員經過座位時請她給我杯水，結果那位阿姨轉身指指空廚櫃臺：「請你自己去倒謝謝。」後來在曼谷換搭華航，飛機較小，版畫沒法放進頭頂上的置物櫃，空服員見了就主動過來說幫我收起來，下機時給我。吃著超對味的華航飛機餐和甜點，眼淚都快掉下來了。真真是踏進機艙就像回到祖國啊。\n\n去年也是在曼谷轉機，很不巧有一班回台灣的泰航班機差不多同時離開，我衝去櫃臺想改都來不及，於是得等八小時。八小時！！！到泰國時是大清早，要等到下午才能登機。本來想就坐在機場裡看小說，時間應該不難打發，誰知帶了一本很難看的書，加上時差想睡，一整個渾身上下不舒服感覺很差。後來忍不住花錢買了很貴的機場無線上網，想跟MSN上的朋友哭訴，偏偏是週末大家都在睡覺，聯絡人清單上形單影隻，哎，真是不提也罷。\n\n今年大致很順利，只有在櫃臺check-in時鬧了笑話。法蘭克福機場辦check-in前行李就要先過X光，過完再提去櫃臺。我把行李送進X光檢驗機後就歡樂地回去排隊，直到後頭的一對美國夫妻跟我說要回去提行李，我才狼狽地跑回去拎。回來之後另一位先生還消遣我，對美國夫妻說：「這年頭在機場東西都不能亂放，不然被銷毀了都不知道。」我忙說：「你別嚇我啦！」\n\n好玩的在後頭。從法蘭克福飛曼谷，十二小時，兩頓飛機餐，一切正常。睡了長長的一覺，看了點書，吃完東西就到了。曼谷要等三小時，然後原機在香港停留，原本中午就到泰國了，這麼一折騰卻到快半夜才回台灣。重點是，曼谷到香港吃一頓飛機餐，香港到台灣還吃一頓！！！於是我一天內什麼都沒吃，就吃了四頓飛機餐！！！再怎麼不挑、甚至再怎麼「喜歡」飛機餐，這種餵豬法也會讓人抓狂吧？旅程後半簡直完全是在空服員的泰國腔英文裡度過：「要不要來杯中國茶？」「要酒嗎？要紅酒或白酒嗎？」「麵包要再來一個嗎？」「咖啡，要咖啡嗎？」\n\n回家！！我要回家啦！！！", "summary": "第三次赴法蘭克福書展歸途雜感。從菜鳥時期的出關窘境到漸漸熟稔，細數幾年間在異鄉機場遇到的荒謬事，寫出遠行工作者特有的疲憊與韌性。", "tags": {"type": ["書展記事", "個人隨筆"], "genre": [], "growth": ["書展現場", "情感流露", "職涯轉折"], "era": ["法蘭克福書展"]}}, {"title": "曾經", "date": "2007-01-17", "year": 2007, "body": "週末整理舊信，看到 2004 年六月的一篇日記。那時我入行不到三個月，研究所即將復學，手上還有翻譯、電腦遊戲製作和外文書店等工作，滿滿的，非常貪心而不懂得取捨，於是一直疲於奔命、無暇兼顧。現在回想起來，彷彿是上輩子的事了。而我仍然覺得自己才剛開始，每回出國參加書展，都像是小孩子偷偷溜進成人的遊戲世界，總會想起「埃及王子」裡那句歌詞 You're playing with the big boys now。\n\n==============================\n\n2004 年六月十一日\n\n每年到了這時候，放榜的時節、畢業的時節、離校的時節、開始與結束的時節，總是幾家歡樂幾家愁。記得兩年前的大四下，那個在外人看來簡直一帆風順輝煌得要命的時候：出書、研究所、畢業公演，可是只有自己知道，自己是如何從頭痛苦到尾。後來連畢業證書都差點拿不到，提心吊膽了不知多久。\n\n最近身邊的人好事連連，有人分別考上研究所，有人也都順利通過口試，大家都好興奮啊覺得運勢正旺，一鼓作氣把遊戲做出來吧，一定會有好出路的。\n\n我也不知道自己在落寞什麼。明明這幾個月來版權做得有聲有色，明明禮拜一才接到某大出版社主編來信，想約見面談談，翻譯進度雖然慢但也總有進展，禮拜三不才剛做成第一筆批發生意，賣了一萬多塊的書？\n\n說穿了，就是看似蠻不在乎，心底還是甩不掉的學位情結吧。\n\n這陣子我都在幹什麼？很少人知道，更少人能理解的國際版權代理。每天寄出各式各樣的詢問信，和形形色色的經紀人、出版商打交道，幫國內出版社查詢版權，看書寫書訊把新書推薦出去，修改合約、交涉還價。為了適應美加、英國和澳洲的時差，我已經隨時可以換算這些地方的現在時間：澳洲快我們兩小時所以我七點起床八點他們就上班，有事要趕下午三點前聯絡完；英國慢我們七小時，台灣五點下班他們才進辦公室，午夜十二點前他們都還在辦公、都有回信可能；美國快我們七到十二小時，所以吃完晚飯起就可能有回信，一直到隔天上午。於是就是信箱從早到晚沒停過，半夜睡前依依不捨狂按收信，睡到半夜起來上廁所，必定不忘開螢幕收信。已經兩次為收到正面回應而興奮失眠，又或者患得患失夢見美方回信，醒時連英文字句都還點滴清晰。\n\n曾經以為國外出版界家大業大，都是愛書人都有專業素養。真的打過交道，才發現好人壞人到處都有，舉世皆然。無論如何寫多少封信就是不回的大牌很多，冰冷無情丟下一句「敝社與 XXX 獨家」者難以估算。但是也有熱情雞婆幫我問其他代理要不要某本書，對方要後過來跟我道歉並補償般問我有沒有可能對小說有興趣，一聽我說我最愛小說就興奮得連附加檔都忘記的超級好人。\n\n也有別家代理商的多年好友，被我的長信打動而讓我代理幾本試試，問起一本國外很轟動的新書，她答應讓我代理，出版社已經要來面談開價了，她才突然丟下一句「抱歉這本書之前已給了 XXX 代理」，我委屈地說會否還沒賣出，人家都約了出版社了，她一句全大寫 SORRY YOU CANNOT DISCUSS THIS BOOK WITH A PUBLISHER，害我氣得差點心臟病。\n\n也有經紀人回了第一封信怕我沒收到又特地來問，結果好死不死我還真的沒收到，一談之下才知她對原本代理不滿甚矣「他從來不回我 email，直到我寫信表示要換代理人，他又立刻非常積極回應」。\n\n有出版社跑來問一本英國剛出的育兒禮儀書，查遍網路找不到作家和出版社資料，最後在一篇媒體報導後面查到電話，買了便宜的國際電話卡戰戰兢兢打過去，自己嚇自己緊張半死問來 email，搭上線後以為對方會很積極，想不到作家的老公姿態可高哩：「BBC 全球節目報導，並可能拍成電視影集」，「我們只願意和有規模有信譽的大出版社合作」。\n\n輾轉聯絡到某澳洲經紀人，對方回信說「我喜歡用電話談」，於是又算準時間鼓起勇氣打過去，想不到只不過就是「見面（聽音？）三分情」，一個確認、實際聽到人的手續罷了。「把書單給我我就寄東西給你。」\n\n聯絡某加拿大著名的文學出版社，網站上列名中文代理 Andrew Cribb，那個可以算是帶我入行的前輩。近年來他退休的謠言在出版界紛起，其實他還弄了新的 blog，只是的確似乎是不若往日積極，那麼活躍了。他手上曾經握有 Knopf, William Morris Agency, Janklow & Nesbit, HarperCollins，如今卻一一被搶走。這幾天有出版社問起拿了美國國家書卷獎，在領獎會上奚落同是領獎者的史蒂芬金的「純」文學小說家 Shirley Hazzard 新作，查了以後發現就是 Janklow & Nesbit 代理（這家多大牌？只要說出 Thomas Harris 和 Anne Rice 兩個名字就夠了）。我寫信給 Andrew 問候，感謝他當年指點提攜（其實談不上提攜，但他肯花時間和一個對版權啥都不懂的小毛頭通長信，還一直記得我對科幻奇幻有興趣，寄過不少書給我），並順便問「你還代理 Janklow & Nesbit 嗎？如果是，我就把客戶轉給你」，結果也沒回音。\n\n從代理一本想像 Gertrude Stein 和 Alice B. Toklas巴黎越南籍廚師的小說，到幫出版社詢問 Toklas 的著名食譜，輾轉竟然真的回到法國的經紀公司。大詩人 Robert Graves 的女兒翻譯了一本轟動西班牙的暢銷「惡魔/後設/秘史/書中書」 小說，挖到原作家西班牙經紀人的資料，寫信過去居然也順利談到代理。幫人詢問擁有一百多年歷史的澳洲獨立出版社繪本版權，談判你來我往，對方看了報價居然還會好脾氣地說：「我很希望能夠看了就說 Yes，但我做不到....關於圖片 CD 我已有心理準備要給你們折扣，但你開的價太低了，應該要....」\n\n英美恐怖小說在八零年代曾經崩盤，之後作家紛紛轉入地下，在小出版社（small press） 裡逐漸走出一片天，或許因此產生特別緊密的聯繫，也更重視情義。那天寫信問 John Shirley 的經紀人問代理事，平時作家一律是由經紀人回答，只有作家轉信給經紀人，沒有倒過來的。Shirley 卻親自回信，標題就叫「XX等書的作者 John Shirley來回信了」。他說很高興讓我代理，不過翻譯權在出版社手上，他已經請他們和我聯絡，若短期內不見回音，「請跟他說，他保證叫他們和我聯絡」。該出版社的代理權事實上牢牢被別人握在手裡。我回信道謝，並說明情形，表示或許無法代理，但有機會仍將推薦他的書給出版社。沒多久他又回信了「我會調查此事，既然你對我的書特別感興趣，我當然希望由你代理。」字裡行間，我彷彿看到他高大可靠的身形擋在前面，慷慨激昂地說：「你飄洋過海來找我，我豈有不戮力相挺之理？」那樣一個重感情、重義氣的血性漢子啊！\n\n接慣了冷冷的「抱歉敝社與XX獨家」，前天竟然也收到封信有禮貌到讓我泫然欲泣「非常感謝來信，我們得知 XX 在中文市場可能有讀者非常興奮，很希望能見到她的作品在中文市場出現。很不幸的是，敝社與XXX獨家，如果您願意，不知可否請有興趣的出版社與他們聯絡，如果您願意代勞，我們將非常感激....」一位版權前輩說：「這才是文明人做事的方式，值得學習。」\n\n真寫起來，每一封信都是一個故事。\n\n這是個太浩瀚的世界。我專做英文書，HarperCollins, Random House 等大出版社早已跟其他代理獨家合作，沒關係，英美的翻譯版權常不在出版社，往往在經紀人手裡，而經紀人何其多，問多了鑽久了總會碰上沒跟人獨家，或者剛出來自立門戶的人。英美大牌不理，沒關係，還有澳洲、加拿大、紐西蘭這些英語天堂。再不，美國多得是使命崇高，有話要說的小出版社，不然，也有各式各樣就是不找經紀人的作家。我開始注意時事，注意商業管理科學史地，留心排行榜，熟記版權頁，每天吃早餐看版權成交報告，把找經紀人當作解謎尋寶。\n\n我們公司以代理歐洲書起家，德法兩地的關係良好，義大利、挪威、保加利亞、波蘭的作家都有涉獵。歐洲的經紀人制度不若英美那麼嚴密繁複，也比較沒有獨家這回事，頂多優先讓你代理幾個月，之後大家機會均等。聯絡只要找上出版社一切 OK 。英美截然不同，靠著幾個網站、以前累積的經驗和萬能的 google ，我倒是在這個領域活得自在。日本又是不同氣象，凡事講究禮貌，往來書信客氣得讓人不知如何是好，英美那種動輒拼錯字、忘記檔案的烏龍事，我以為日本絕不會有。結果同事照樣遇上一堆哭笑不得的事情，有人耍陰，有人在狀況外，email和傳真報價過去，還回信說「你是用 email 還是郵寄？」\n\n所以我到底在不滿什麼？這樣多采多姿的生活夠我遨遊一生，即使懂的人只限於出版界朋友，只能在公司聚餐席間談笑風生，每字每句都說進別人心坎，反照出眉宇間的瞭解。十月初要跟著去法蘭克福書展，那又是正式登上國際舞台了，得面對面地和經紀人會面，解說，簡報，爭取。老闆說之後他還要去一趟巴黎談古董書事宜，問我要不要隨行。明年六月我一定要去美國書展，因為那才是美國本土人士最便利也最容易出席的集會。\n\n那麼多的路，我終究只能擇一而終吧。", "summary": "重讀2004年入行初期的日記，感嘆當時的迷惘與貪心——身兼翻譯、遊戲製作、外文書店等多職，同時已在版權代理上嶄露頭角，卻仍放不下學位情結。", "tags": {"type": ["個人隨筆"], "genre": [], "growth": ["職涯轉折", "情感流露", "工作意義"], "era": ["版權輸入"]}}, {"title": "所謂的書展完全體", "date": "2007-10-21", "year": 2007, "body": "第四次去法蘭克福，撇開收穫多少不談，更重要的是認清了一些事。比如說不要再幻想長途飛機上能認真讀完幾本書。昏暗的燈光、轟隆的引擎噪音，十幾個小時不間斷的餵食、送水、毛巾等干擾，任誰都無法專心。仔細回想起來，這幾年在旅途上看的書，幾乎沒一本是好東西。真的是書爛？還是自己根本進不去故事的情境？從法蘭克福登機，特別從背包裡拿了中英文小說各一，心想看煩了還有的換，結果都看不到十頁，乖乖倒頭一覺睡到曼谷。\n\n和去年回國搭的是同樣的泰航班機。之前很努力累積星空聯盟里程數，偏偏今年到倫敦和紐約搭的都是寰宇一家的飛機，星空的里程停滯不前。暌違一年非常想念，可是座位沒有小電視，連一部像樣的好萊塢電影都沒有，食物也未盡人意，就不知自己是年紀大了開始挑剔，還是純粹歸鄉心切對什麼都失了耐心。十小時飛到曼谷，停留四小時飛香港短暫停留才飛台灣，整整花了一天，吃了四頓飛機餐外加機場一頓，都快吐了。說起來是漫漫長途，其實也不過轉眼就到。在飛機上閉眼入睡的前刻，腦海裡還都是星期六書展最後幾場會議的影像。\n\n出發前跟朋友說，我覺得書展是各國出版人相互取暖的場合。無論原本多麼疲憊，景氣如何蕭條，待辦事項堆積如山，只要踏進會場，就是走入另一個世界。你會在腎上腺素的作用下全速奔馳，像是開了後燃器一樣跑完行程，晚餐結束（有時還有酒會或很晚才開始的晚宴）回到旅館徹底癱倒，隔天起身再戰。從以前深受時差之苦到現在不論去回都毫無影響，彷彿是一種不斷進化的過程，演變的終點是所謂的「書展完全體」。\n\n與英美的親密戰友親吻臉頰、互報近況，參加丹尼斯‧勒翰經紀人邀集的全球出版社早餐會報，跑到美因河南岸的百年德國酒館參加冰島出版社的國際餐會，拜訪波蘭最大的文學出版社，帶著剛出爐的《法蘭德斯棋盤》文庫本去見西班牙經紀人，在德國和印度朋友帶領下去吃泰國和越南餐廳，和台灣的出版社朋友在義大利餐廳聚會，與大陸的版權人相約書展會場的西餐廳，在五館的入口處買 Movenpick 冰淇淋。無數的事情以過高的密度不斷發生，我開始有種回家的熟悉感覺，在這個距離紛擾島國幾萬里的異地。\n\n至於夢境，則總也有一星期的時差。於是德國種種，現在才開始在黑暗中重演。", "summary": "第四次法蘭克福書展的深層感悟：認清書展是各國出版人「相互取暖」的場合，只要踏進會場就像開了後燃器，腎上腺素全速驅動。從時差到人際，寫出資深參展者的內心節奏。", "tags": {"type": ["書展記事", "個人隨筆"], "genre": [], "growth": ["書展現場", "產業洞察", "情感流露"], "era": ["法蘭克福書展"]}}, {"title": "安靜的 2008 年法蘭克福書展", "date": "2008-11-14", "year": 2008, "body": "（本文原載於十一月十日聯合報）\n\n去法蘭克福的路上，我心裡一直是很忐忑的。因為無所不在而且看似無止盡的金融風暴。因為本地書市的寒冬早已開始，讓人簡直不敢想像新一波衝擊過後會是什麼景象。我不知道書展現場會不會舉目所見都是愁眉苦臉，這個國際出版人齊聚一堂的年度盛事，今年還聽得見歡笑聲嗎？\n\n班機還沒起飛我就覺得不妙：台北往曼谷的飛機竟只有半滿，轉機到德國後仍舊很多空位。第五次參加法蘭克福書展，我從沒見過如此景象。我知道油價、票價飆漲連連，出差預算一砍再砍，可是情況真有惡劣至此？所以一直擔心。\n\n書展前一天，我照例到法蘭克福大飯店開會前會。記憶中總是擠爆的旅館大廳，居然十分冷清；過去向來座無虛席的戶外雅座，竟空無一人。聊起當前局勢，加拿大的經紀人蘇珊說：「沒有人明講『我不買書』，但出版社明顯趨於保守。」又說：「如果相中好物，他們還是願意砸錢搶書，除此之外不隨便出手。」\n\n從經紀公司轉行的西班牙書探卡門則說自己開業一年來成果頗豐：「客戶都很滿意我們的服務，我們也確實幫助他們找到想要的書。」她的德國客戶正是《風之影》的出版社，在競逐薩豐新作《天使遊戲》失利之後卻收之桑榆，簽到印度裔作家亞伯拉罕‧佛齊斯（Abraham Verghese）嘔心瀝血十年完工的大長篇《雙生石》（Cutting for Stone），靠的正是書探慧眼。\n\n時間才過中午，我突然發現大廳裡已經座無虛席，又恢復了舊時眾人摩肩接踵的盛況。大家都說今年的書展很安靜，可是我好像沒有聽見太多抱怨。在那熙來攘往的訊息集散中心，我看到的依然是一張張興味盎然的臉，聽到的是親切的問候、熱情的分享、高聲的歡談。當我在向晚時分走出飯店，露天雅座已是萬頭鑽動，門口更擠滿了抽煙兼敘舊的出版界煙友。於是我比較放心了。\n\n書展期間我都待在版權中心裡，甚少外出走動，竟有些不問世事的感覺。可是那有著四百多張桌子，足以容納千人的版權中心，難道不是國際出版業最微妙的縮影？我以每半小時一場會議的頻率和各國出版人見面，講起不斷下滑的書市業績，卻沒有絲毫的怨天尤人，最後我們總也相視而笑。書探出身的年輕經紀人馬克說：「業績下滑？出版人從古騰堡發明印刷之後就在說這句話了。」說他苦中作樂也好，憤世嫉俗也罷，這段話還真有幾分豁達的洞見。\n\n關於金融風暴對出版業所造成的衝擊，書展現場流傳著兩種理論：一種是樂天派，認為人變窮了反倒會回頭看書，因為書是最便宜的娛樂。另一種不以為然，因為看電視更方便更簡單，誰還來花錢買書？一正一反，有人樂觀有人唱衰，這和過去好像也沒什麼不同。本來嘛，人類歷史上的黃金時期有個不變的定律：它要嘛早已過去，不然就是還沒到來。\n\n之前聽說冰島政府瀕臨破產，瞠目結舌之餘，第一個想到的就是自己認識的冰島出版人。去年我們才在美因河南岸的百年酒館慶祝犯罪天王阿諾德‧英卓達森出版十年有成，怎麼世事變遷得如此之快？沒想到版權經理法拉笑嘻嘻說沒什麼，不過就是暫時性凍結全國銀行資產，一兩週內就會沒事。德國出版社沒法電匯版稅，還問要不要帶現金來會場，讓冰島五人小組全身綁滿鈔票偷渡回國？\n\n《項塔蘭》作者葛雷哥里．羅伯茲在酒會上的一席話，更讓我內心震顫不已：「就算全世界的宗教信仰和寺廟教堂一夕消失，也不及所有圖書館、出版社和書店全部消失，對人類文明所造成影響的千萬分之一。因為我們的智慧都在書本裡，因為我們的未來都要靠書籍傳承。」留著長長的馬尾，穿著印度風的唐裝，他舉杯向各國出版社致敬，並提醒大家在埋首書堆之際，不要忘記自己從事的是「延續人類文明的重要事業」。\n\n凡此種種，讓我即使走在裝潢非常低調、一改往昔爭奇鬥豔奢華作風的八號館，再也不覺灰心喪志。即使大環境風雨飄搖，前所未見的蕭條就要來臨，我知道時移事往、物換星移，唯有閱讀仍在。\n\nPS：照片中右邊即是羅伯茲，左邊則是他的文學經紀人喬瑞格（Joe Regal）。", "summary": "金融風暴陰影下的2008年法蘭克福書展現場觀察。搭半滿的班機，踏進冷清的大廳，卻發現出版人對好書的熱情從未消退——寒冬中的一次業界診斷。", "tags": {"type": ["書展記事", "產業觀察"], "genre": [], "growth": ["書展現場", "世界觀察", "產業洞察"], "era": ["法蘭克福書展", "出版業轉型"]}}, {"title": "你的靈魂還留在倫敦", "date": "2009-04-25", "year": 2009, "body": "從國外回來的隔天總是特別不真實，因為距離的時間太短、外在世界的變遷卻太大。昨天你還在晴天豔陽的倫敦，搭雙層巴士穿行街頭，今天就在台北淅瀝的梅雨聲中醒來，穿著拖鞋去美而美買早餐。你很喜歡威廉‧吉布遜用「靈魂遲到」來形容時差，因為那差不多就是身體到了、思緒還在遠方飄盪的感覺。而你總要等到歸國一週後夢見異鄉種種，這趟旅程才算告結，可以劃下句點。\n\n途中你不斷想起四年前的事，第一次參加倫敦書展。翻開當時的會議行程，赫然發現半數以上的人已經不再往來：有的離職，有的結束合作，而那些一路走來的都成了最重要的客戶和朋友。那是你第一次和達利‧安德森經紀公司（Darley Anderson Agency）的版權經理艾瑪（Emma White）見面，至今已幫他們賣出近六十本書。艾瑪兩年前離職，現在成了你的英國書探，你們還在書展前共進晚餐。\n\n那也是你第一次和喬瑞格經紀公司（Regal Literary）接觸，當時的版權經理是貝絲（Bess Reed），現已結婚並遷居南方，繼續尋找文壇新秀。接手的馬克斯（Markus Hoffmann）於 2006 年到職，你們剛合作賣出奧黛莉‧尼芬格的新書《她的對稱幽靈》（Her Fearful Symmetry）。那年你沒和版權大師丹尼‧巴羅約成，可是你會永遠記得自己坐在版權中心角落，玩弄著剛買的蘋果 iBook 筆電，他走過來問候時的和藹笑容。\n\n那是你第一次到倫敦，你還記得凌晨抵達，搭巴士從機場到旅館，放好行李後便和同行的出版界前輩到市區逛逛。時間還早，店家都還沒開門，飢腸轆轆的你們最後在中國城一家港式麵包店買點心和熱豆漿。那時你對時差毫無免疫力，還不到中午便昏昏欲睡，遂獨自回旅館倒頭而眠。\n\n你記得醒時的茫然，房間裡的寂暗。時差覺越睡越昏沉，你孤身一人在陌生的城市，連想吃東西都不敢踏出旅館大門，最後鼓起勇氣到二樓的餐廳覓食。那時你很窮，又沒去過英國，看到菜單上動輒十幾鎊的主菜，完全被嚇傻了。於是你點了七鎊的沙拉，只能到沙拉吧取餐一次，而且菜色乏善可陳。吃了哪些東西你當然早已忘記，可是你記得味道很奇怪的馬鈴薯沙拉和紫色甘藍菜。\n\n今年的書展前夕你行程滿滿，中午到巴羅父女下榻的飯店碰面（對，他的女兒海瑟在雜誌界工作後，現在也投入了家族事業），然後與《一的力量》作者經紀人瑪格麗特共進午餐，再和同事一起跟 Thomas Nelson 的版權經理喝下午茶，接著和瑪俐‧盧索夫（Marly Rusoff）、麥可‧拉杜瑞斯可（Michael Radulesco）夫婦碰頭小酌，還認識了他們的韓國代理。晚上你請書探到米其林餐廳 Bibendum 吃飯，聊出版掌故、業界趣聞，非常非常開心。\n\n你和同事們住進了會場旁的奇怪小旅館，單人房很便宜，可是設備比較簡陋，比如說電話線沒插上、暖氣只在白天才開、床墊的彈簧有點失靈、日光燈要用手動拉開、早上熱水要等很久。電梯是很老式的那種，樓層按鈕要按很用力才會亮，有時門還不會自動關上。剛進房時難免失望，大家相視苦笑，但至少安靜、乾淨，而且離會場很近，吃完早餐還可以睡回籠覺，走到會場只要一分鐘，完全免除趕書展的舟車勞頓，忠森笑說「比參加台北書展還舒服」。\n\n書展有一點冷清，尤其台灣和大陸出版社參展人數銳減，幾乎不到往年的一半。整體來說，現場氣氛是一種謹慎的樂觀，畢竟最劇烈的裁員和震盪都已經過去，而出版社還是得出書、還是得買書，或許量變少了，成交金額也有所下跌，但一切都還在繼續。\n\n書展第二天，丹布朗新書《失落的符號》（The Lost Symbol）正式敲定在九月十五日上市，首印量高達六百五十萬冊，幾乎肯定成為今年最暢銷的成人小說。對英美書市來說，這似乎是名家再度出手的一年：六月有薩豐的《天使遊戲》（The Angel’s Game），九月是丹布朗和尼芬格的《她的對稱幽靈》，十月是柯斯托娃的《天鵝賊》（The Swan Thieves），十一月則有芭芭拉‧金索夫醞釀十年的全新大作 The Lacuna。這不就是挽救低迷書市、提升買氣的最佳良方嗎？\n\n在倫敦的最後一天，你獨自前往西敏寺幫朋友買拆信刀。當你走過國會大廈外的抗議人群，走過恢弘壯偉的教堂，穿越如織的遊客人潮，遙望遠方的倫敦眼和水族館，一切都顯得熟悉而友善，你突然發現，自己不怕倫敦了。\n\nPS: 照片是我在倫敦機場買的牛頭狗布魯諾娃娃。超可愛！", "summary": "倫敦書展歸來的即時心境。用「靈魂遲到」比喻時差，回顧四年前第一次倫敦書展以來，那些相互扶持、一路走來的夥伴與朋友，寫出業界情誼的積累。", "tags": {"type": ["書展記事", "個人隨筆"], "genre": [], "growth": ["書展現場", "人際交流", "情感流露"], "era": ["倫敦書展"]}}, {"title": "另一片天空：墨西哥書展有感", "date": "2009-12-19", "year": 2009, "body": "差一點，我就決定不去墨西哥了。\n\n邀請函是在八月初寄來的。我早聽說過墨西哥瓜達拉哈拉書展的大名，是西班牙語世界最大的書展，也知道好些西班牙客戶會固定參加。可是一來西文書不容易推，現有的客戶已經很夠我忙；二來書展是在十一月底，等於從法蘭克福回來四個星期就又要飛到中美洲，真是連喘息的時間都沒有。\n\n那時正是兵荒馬亂的暑假，我為北京和法蘭克福書展忙得應接不暇，心煩意亂的。於是便把信擱著，沒拒絕也沒答應。\n\n三週後，對方又發了一次邀請函，想必是怕我沒收到。這次再不回人家，就實在太沒禮貌了。我開始詢問同事和朋友的意見，沒想到人人都贊成，說機會難得，到墨西哥去玩玩也好，況且對方補助機票、食宿，實在沒有不去的道理。\n\n打電話回家的時候，我跟老媽說起此事，結果她把我罵了一頓，說遇上這種千載難逢的機會，全世界的人都會毫不考慮答應，怎麼只有我想東想西，還想拒絕咧！想想我還真需要這種當頭棒喝，給她這麼一說，我就咬咬牙，決定去了！\n\n還好去了，因為那真是一次大開眼界的寶貴體驗。\n\n*\t*\t*\t*\t*\n\n墨西哥書展是在瓜達拉哈拉市（Guadalajara）舉辦的，至今已有二十三年歷史，是中南美洲最大的書展，同時兼具專業展和消費展的性質。最初書展開辦的時候，很多人心存懷疑：墨西哥的出版社幾乎全部集中在首都墨西哥市，誰會大老遠跑來這裡？但正因為這裡沒有出版社，業界人士可以出差順便度假，反而樂在其中，而瓜達拉哈拉書展（Feria Internacional del Libro de Guadalajara, 簡稱 FIL）也就一年年茁壯起來了。\n\n在第一天早上的說明會上，書展的美國代表大衛‧昂格（David Unger）向我們簡述書展的沿革與特色，例如此 FIL 與其他書展不同，係由瓜達拉哈拉大學所舉辦，而非商展公司。FIL 的收益來源全部是販賣攤位所得，此次版權交流活動（Rights Exchange Program）經費也是這麼來的。\n\n可能有不少人認識大衛‧昂格這個名字。是的，這位出生於瓜地馬拉，成長於美國，現居布魯克林的老紳士，是一位知名的小說家，也《天殺的熱帶日子》作者。他與妻子住在紐約布魯克林，是 FIL 的美國代表，與郝明義先生相識多年，還曾兩度來台參加台北國際書展。今年法蘭克福書展前一天的會前會，我就在市中心的大飯店門口與大衛初次見面，對他的親切幽默而且毫無架子印象深刻。\n\n引介我們的是《風之影》作者經紀公司的版權維克多‧賀達多（Victor Hurtado），後來我才知道，維克多原本就是 FIL 的工作人員，前幾年厭倦了書展生涯，才飄洋過海去西班牙當起文學經紀人。我記得 2007 年第一次與他見面，這個小個子、皮膚黝黑的墨西哥人笑容滿面過來跟我擁抱，稱我「老兄」，讓我又驚又喜。那時我還不知道，如此的熱情好客，正是墨西哥人本色。\n\nFIL 的國際版權交流活動是國外行之有年的 fellowship，中文似乎沒有直接對應的詞，姑且稱之為「短期研習」吧。在書展圈，最早舉辦的是以色列的耶路撒冷書展，還分為編輯和經紀人兩種研習。不久法蘭克福書展起而效尤，後來居上成為現在辦得最好的書展 fellowship。FIL 則是頭一次舉辦。\n\n這種活動的宗旨，就是提供一個年輕出版人認識當地出版產業，並建立國際人脈的機會。成員除了來自歐美出版大國，也可能來自印度、澳洲、芬蘭、中國，在為期一週左右的時間內，參觀出版社、研究書市、聽取座談會，更重要的，是一起吃喝玩樂，在非商業性的近距離相處之中，培養出跨國界、跨語言、跨文化的革命情感。多年以後，他們可能會成為各國的業界要角，而這些年輕時結交的朋友，則將成為彼此出版生涯中的最佳伙伴。\n\n*\t*\t*\t*\t*\n\n我是第一次參加書展 fellowship，對主辦單位的無微不至感到非常受寵若驚。我們幾乎完全是被奉若上賓：從機場出來就有人舉牌接應，開車直接送到四星級旅館，車上已經備妥資料袋，除了書展相關的目錄和文宣，還附上五天行程，以及所有晚宴、午餐和酒會的邀請函。之後每天都有專車到飯店接人，三名導覽人員魯本、帕布羅和維克多輪番接應，幾乎永遠有人陪在我們身邊。魯本年輕俊秀而且親切幽默，迷倒書展上無數女性；帕布羅個子很小但效率一流，走的是搞笑路線；維克多則是當地知名的文學雜誌主編，還在瓜達拉哈拉大學當文學講師，談起拉丁美洲文學如數家珍，每個作家作品優缺點都信手拈來，讓人嘆服。\n\n書展前兩天的座談以獨立出版社為主，我們參訪了當地的墨西哥出版社，也聽取來自委內瑞拉、哥倫比亞和阿根廷的獨立出版人介紹書籍。幾場活動下來，我們深刻感受到在拉丁美洲出版的不易：那是個看似很大，實則閱讀率不高的市場，而且國家眾多，彼此的口音、腔調和語感不同，也間接影響到文本的接受度。這些獨立出版社出版詩集、短篇小說集，甚至有所謂的「超短篇」，一個故事只有四五行，比極短篇還短。有人打趣說，一般人不愛看書，寫短一點讓他們容易讀完，比較有成就感。這些獨立出版品的印量極低，往往只有一千本，能夠再版就算「暢銷」。連續幾場活動聽下來，我們面面相覷，覺得「怎麼這麼慘？」更現實一點來說，這些獨立出版品，即使寫得好，在缺乏本地市場基礎的條件下，幾乎不可能走向國際。\n\n墨西哥有一億人口，物價比台灣還低，可是書籍很多從西班牙進口、加上印刷成本高昂，以致於書價極高，動輒台幣五、六百塊，更增加了推廣閱讀的困難。瓜達拉哈拉書展於是成為年度的重要盛事，因為很多人真的一年就買這麼一次書；因為平時很難找到種類如此齊全、折扣如此優惠的購書處所；因為許多知名作家會蒞臨書展簽售座談，而他們往往受到有如搖滾巨星一般的瘋狂追捧。現場瀰漫一種有如嘉年華會的歡鬧氣氛，很多年輕人打扮得花枝招展來看書，聽作家演講擠得水洩不通，那是一種非常旺盛、讓人驚豔的活力。\n\n書展第三天有場午餐會，是為了慶祝德國 Hanser 出版社發行人麥可‧克魯格（Michael Krueger）獲頒 FIL 傑出出版人大獎的活動。席間克魯格起身舉杯向大家致意，說墨西哥之行讓他感觸良多，因為這是一個充滿生命力而且不斷茁壯的語系，不像德文，使用者只有「區區」八千萬，相比之下簡直是個逐漸死去的語言（a dying language）。此話當然有點誇大，但令人動容，因為西語確實是一個使用人口更多、影響力迅速成長的語言，不光是西班牙和拉丁美洲，還有大量移民日積月累潛移默（墨？）化的美國。\n\n過去西語小說很難成為國際暢銷書，數來數去也就是貝雷茲-雷維特、阿言德和《巧克力情人》的蘿拉‧艾斯奇弗（Laura Esquivel）這幾人，近年來則有薩豐、有《祕密晚餐》的西耶拉，有《海上教堂》的法康尼斯，在全球各地寫下傲人的暢銷佳績。美國的各大出版集團紛紛成立西語分部，或與西班牙出版公司達成合作出版協議，或積極引進有暢銷的西語文學，或挖掘用英語寫作的拉丁裔作家。西語書市的蓬勃興盛，更可從西語「書探」的出現略見端倪。過去，這向來只是英語系大市場國家才有的專利呢。\n\n講到餐會，那可真是讓我大開眼界，滿心期待卻又哭笑不得的文化特色。午餐兩點半吃，晚餐則通常九點半開始，等主菜上來通常已經十點多。酒足飯飽將近午夜，我時差發作體力不支只想回旅館大睡，但舞會跑趴這才要開始。我就看著歐美「同學」們興高采烈去跳舞狂歡，豪飲龍舌蘭酒外加香菸不斷，非得搞到三更半夜才歸營，第二天早上不是一頭睡死錯過活動，就是形容枯槁疲累不堪。\n\n*\t*\t*\t*\t*\n\n到了第三天晚上，我們總算是拜訪了 Random House Mondadori 的攤位，而與西語書市的大出版集團有了接觸。顧名思義，這家西班牙最大的出版集團係由德國藍燈書屋集團（Random House）和義大利 Mondadori 集團合資成立的大公司，財力雄厚，又有跨國資源和資金挹注，很快在西語市場取得龍頭老大的地位。負責導覽的貝德羅‧胡耶塔（Pedro Huerta）是該集團墨西哥分公司的總裁，一身筆挺西裝，開口閉口全是生意經，講數字、分析銷量和市佔率，雖有同學抱怨「未免也太市儈」，但在一連串低迷的獨立出版會報之後，還真有精神為之一振的感覺。胡耶塔分析，墨西哥是非小說為主的市場，佔 65%，尤其是實用、勵志類書籍，以及非常本土的報導文學，多以揭露黑幫和毒品交易為主題。西班牙則正好相反，65% 是小說，其中七成通俗、三成純文學。\n\n我與波蘭出版人同學索妮亞‧德拉嘉（Sonia Draga）聊起該集團出版的《瑪雅預言書》（Domain, 西文版書名是 El testamento Maya），那是美國作家史提夫‧艾頓以瑪雅古文明、外星人和 2012 年末日預言為主題的驚悚小說，被翻譯成十餘種語言，今年又因為 2012 年電影而掀起一波新的熱潮。這書的西文版賣得特別好，僅在西班牙就賣座超過二十五萬冊。胡耶塔總裁說在墨西哥更是超暢銷，賣了有十幾萬本，最早由 ViaMagna 出版社發行，最近才由他們接手並推出新版，依然熱賣不絕，RHM 集團外甚至有巨幅作者海報。\n\n《瑪雅預言書》中文版權正好是我代理的，之前怎麼推也賣不掉，現在看到西文版的盛況，決定回去再加把勁，果然回台灣不到一個星期就找到買家。索妮亞先前也跟此書的海外版權經紀人丹尼‧巴羅拿了樣書，沒有很認真評估，現在也決定回去要仔細審讀。如此這般的意外「驚喜」，或許才是書展的最大收穫呢。\n\n隔天我們又陸續參訪了西班牙 Planeta 和 Santillana 集團，他們與 RHM 合稱西語書市的三大巨頭。Planeta 是最老牌的大出版集團，現場最搶眼的除了拉森「千禧年」三部曲（封面走非常黑色詭異風，把莎蘭德畫成骨瘦如柴、黑長髮皮膚慘白像鬼一樣的女子，據說出自西班牙著名畫家之手），就是丹布朗的新書《失落的符號》，上市不久已經狂銷二十萬冊。這些集團的分支眾多，每個品牌的 logo、名字、出版路線讓人眼花撩亂。我問了一下 Seix Barral 和 Destino 有何差別，因為兩者都是文學品牌，才知道前者更偏純文學，後者則算是介於文學和通俗之間，薩豐和拉森就都是 Destino 出版的，他們也剛簽下張翎的《金山》。\n\nSantillana 也是個集媒體和出版於一身的超大集團，旗下的文學品牌「豐泉」（Alfaguara）在西語書市具有指標性地位，每年舉辦的豐泉文學獎亦極具份量，獎金或許不如行星文學獎（Premio Planeta），但得獎作品的評價則有凌駕前者的趨勢，亦有很高比例被翻成英文，例如 2006 年得主是秘魯年輕作家聖地牙哥‧朗卡吉利歐（Santiago Roncagliolo）的《紅色四月》（Abril rojo），便由馬奎斯的御用英譯者伊狄絲‧格羅斯曼（Edith Grossman）親自翻譯；2007 年的《你看我有多愛你》（Mira si yo te querre, 簡體中文版書名是《情繫撒哈拉》）是一個發生在西屬撒哈拉殖民地的淒美愛情故事，最近剛推出英國版。\n\n豐泉文學獎今年的得主是阿根廷少壯派小說家安德雷斯‧紐曼（Andres Neuman）的《世紀旅人》（El viajero del siglo），年僅三十二歲，只比三年前的朗卡吉利歐大了一歲。該書以拿破崙戰爭之後的歐洲為背景，一位無名旅人來到德國東北一個虛構的小鎮，打算過一夜，隔天就動身離開。奇怪的是，這個小鎮似乎想盡辦法不讓他離開，他接連遇到各種離奇的突發世界，鎮上的街道、房舍彷彿不斷重組和變貌，導致他走失在這個迷宮之中。旅人看似通曉世間所有語言，卻走不出這個小鎮所佈下的迷障，堪稱是浪漫主義的後現代重現。紐曼是今年柏林文學節唯一受邀的拉丁美洲作家，《世紀旅人》的英語版權也甫由普希金出版社（Pushkin Press）簽下。\n\n豐泉出版社的「鎮社之寶」當然還是西班牙國民作家阿圖洛‧貝雷茲-雷維特，他的作品在展場舉目可見，有「阿拉特里斯德隊長」系列專櫃，普及歷史作品《憤怒之日》（Un dia de colera）的層層堆疊，經典代表作如《大仲馬俱樂部》、《戰爭畫師》、《海圖迷蹤》和《南方女王》當然也沒有缺席。\n\n*\t*\t*\t*\t*\n\n我們參觀了西語系三大出版集團，可還有 Ediciones B、Urano、Norma、Edhasa 等好多出版社我想認識、想進一步瞭解。\n\nEdiciones B 是以通俗小說為主的出版社，尤以歷史和驚悚小說見長。展位正門口主打胡安‧波利亞（Juan Bolea）的黑色小說新作《無法抗拒的殺手》（Un asesino irresistible），攤位上擺著《貝塞尼家的姊妹》和《治療》等書的西文版、還有模仿「暮光之城」系列重新包裝的安萊絲《吸血鬼年代記》。\n\nUrano 當年可是《達文西密碼》等書的出版社，但丹布朗似乎並未讓他們躍升超大型出版社，新作仍然給 Planeta 集團重金搶走。看著 Urano 架上展示的翻譯羅曼史、歷史小說和《天使與魔鬼》等舊作，真有幾分不勝欷噓之感。Norma 則是另一個頗具規模的出版社，旗下的文學品牌「彼岸」（La otra orilla）素負盛名，出版了今年文學獎得主聖地牙哥‧甘波亞（Santiago Gamboa）的《死者之城》（Necropolis）、智利型男作家帕布羅‧席蒙內提（Pablo Simonetti）的冠軍暢銷書《慾望的邊界》（La barrera del pudor），以及哥倫比亞詩人小說家威廉‧奧斯賓納（William Ospina）今年勇奪羅慕洛‧加列戈斯國際小說獎（Premio internacional de novela Rómulo Gallegos）的《香料的國度》（El Pais de la Canela）\n\n見識過經營困難的小出版社和業績至上的大集團，稍具規模又品味獨具的中型出版社或許更讓人亮眼。走訪「曾經」出版社（Editorial Era）的那天早上，新一屆塞萬提斯文學獎才剛揭曉，得主正是他們出版的大詩人荷西‧艾密里歐‧帕切科（Jose Emilio Pacheco）！發行人親自接待我們，臉上藏不住的喜悅，跟大家打完招呼就很抱歉說自己得離開參加帕切科得獎的記者會，實在很抱歉。\n\n不過我印象最深刻的，應該還是「圖斯卡」出版社（Tusquets Editores）。圖斯卡以眼光精準著稱，選書非常謹慎，不過一旦出手，就是長期經營。同行的法國經紀人皮耶‧艾斯狄爾（Pierre Astier）悄悄跟我說：「要賣書給圖斯卡簡直難如登天，因為他們非常非常挑剔。」那真是最高的讚美。\n\n圖斯卡在純文學和犯罪小說領域都很有名，作家群包括外國的村上春樹、約翰‧厄文、約翰‧康納利、賀寧‧曼凱爾，古巴的李奧納多‧帕杜拉（Leonardo Padura）、墨西哥的克莉絲汀娜‧李維拉‧嘉爾莎（Cristina Rivera Garza），以及西班牙的阿慕德娜‧葛蘭黛絲（Almudena Grandes）等人。\n\n三年前，我在冬陽推薦下注意到帕杜拉的一系列古巴犯罪小說，輾轉聯絡上圖斯卡，並幫他們賣出《再見，海明威》的繁簡中文版權。如今，圖斯卡正歡慶創立四十週年，我有了更多的西語客戶，並以國際版權交流人士的身份與他們相見，感覺格外有意義。活動結束前一天晚上，我們到一個歐式裝潢的豪華會所參加圖斯卡酒會，我與編輯總監胡安‧瑟雷索（Juan Cerezo）聊起葛蘭黛絲的新作、那本厚達九百頁的大長篇《冰凍之心》（El corazon helado）。我說自己很感興趣，只可惜書厚難賣，高大的瑟雷索自有一番理論：「有時候厚書也是好事，那意味著你對作品有信心、值得讀者的信任，而且讀者也會投注更多的時間在厚書上，就像《龍紋身的女孩》和《海上教堂》。」\n\n*\t*\t*\t*\t*\n\n這次版權交流活動的成員來自美國、英國、法國、波蘭、土耳其、羅馬尼亞、以色列和台灣八個國家，四個出版人、八個經紀人。短短的五天之中，我們彼此交換故事，都成了好朋友。\n\n以色列最大出版社 Kinneret 的版權總監季夫‧路易斯（Ziv Lewis）是個酷酷的中年大叔，自稱進出版之前是個「失敗的音樂家」，說他想找「非關政治、比較前衛而都會」的中文小說，還說他出於對作者的忠誠，與奧黛莉‧尼芬格一樣拒看《時空旅人之妻》的電影版。書展結束後，他寫了一封長信給我：「進這行的人很快就發現，這是一個關乎熱情的行業，因為要找別的工作餬口很簡單，大可不必做出版。難就難在如何保持熱情不被澆滅，而參加書展、認識新朋友是一個好方法。」\n\n法國的皮耶是個中年紳士，曾與朋友創辦出版社，後來被人併購，便跟同事出來開經紀公司。談及法國出版社多年以來對經紀人的不信任，他的理論是：「如果出版社不願與國內的經紀人往來，那只會逼得法國作家去找英國、美國和德國的經紀人，而這已經在發生了。」\n\n美國出版人強尼‧坦波（Johnny Temple）是阿卡西出版社（Akashic Books）的老闆，「阿卡西」一詞來自梵語，意為「空間」或「以太」。強尼出版了一系列以著名城市為主題的黑色小說集，我們聊《波士頓 Noir》的主編丹尼斯‧勒翰、《巴爾的摩 Noir》的主編蘿拉‧李普曼，以及亞洲城市如東京、台北和曼谷為主題的可能性。強尼長得又高又帥，我們都猜他不過三十出頭，結果他在惜別晚餐上說自己已經四十三歲，把大家嚇了一跳。餐後我問他是如何把身材保持得這麼好，「該不會是看稿健身吧？」他大笑說你真是讓我太有信心了。\n\n美國經紀人安德蕾亞‧蒙特荷（Andrea Montejo）是我的新客戶，我們在法蘭克福見過一面，靠的還是前幾年離開薩豐經紀人自立門戶的柏納‧費爾（Bernat Fiol）介紹，後來我才知道，安德蕾亞和柏納是前年法蘭克福書展交流會的同學。安德蕾亞個子小小的，非常漂亮，是典型的知性美女，閱讀口味也很偏實驗性。我問她西班牙文怎麼學的，原來她是哥倫比亞人，但六歲就移民美國，西語等於是她的母語，上學了才學英文。除了英西兩種語言，她大學在巴黎念，所以法語也很流利，是美國罕見的三語人才，先前在 HarperCollins 西語書籍品牌 Rayo 當編輯，前年決定出來當經紀人，大衛‧昂格也成了她的作家。\n\n透過安德蕾亞介紹，我和羅馬尼亞最大出版社 Polirom 的主編波格登（Bogdan Stanescu）成了「同桌」，亦即在版權中心共用一張桌子、分攤租金是也。濃眉大眼的波格登是新聞記者出身，五年前投身出版界，短短幾年間參加過好幾個書展的交流活動，還獲選羅馬尼亞的年度優秀出版人。他的英語帶點口音，是個正港的冷面笑匠，熱愛純文學，但私底下和我一樣是個愛看奇幻小說和科幻電影的宅男。他最愛的奇幻作家？嘿嘿，喬治‧馬汀是也。他說羅馬尼亞有家出版社出了一堆很棒的科幻奇幻作家，封面超美，翻譯超爛，爛到第一頁都讀不完。我回旅館查了布蘭登‧山德森的羅馬尼亞出版社，興沖沖跑去推薦，他聽了就翻白眼：「就是那家該死的出版社出的，難怪我沒聽過。」\n\n土耳其的娜敏（Nermine Mollaoglu）是個熱情美麗的大姊，也是土耳其最厲害的文學經紀人，旗下有六十多位作者。她熱愛跑趴，音樂家老公在經紀公司幫忙，每天搭船橫渡博斯普魯斯海峽去上班，通勤「只要」二十來分鐘。她覺得土耳其怎可沒有國際性的文學節，乾脆自己辦了一個，而且搞得有聲有色。一說到帕慕克，娜敏就像個 fan girl 一樣眼裡有星星，崇拜得無以復加。她說土耳其以前的身份證很怪，女性除了「已婚」和「未婚」，一律註明「處女」（virgin），把我們笑得東倒西歪。\n\n來自波蘭的索妮亞最是神奇，原本的工作和出版八竿子打不著，後來金主撤資，她因緣巧合自己翻譯出版了一本書。有次她去美國，看到書店裡琳瑯滿目的小說，心想這些書我很愛看，為何不能引進到波蘭呢？回去後就找了代理問書，拿到一本叫做《慾望單人床》（Good in Bed）的女性小說，作者是個沒人聽過的珍妮佛‧韋納（Jennier Weiner）。索妮亞讀了很喜歡，就簽了，沒想到這書在美國一推出就爆紅，她從翻譯編輯排版全部一手包辦，誤打誤撞出了一本暢銷書。\n\n接下來更猛，她拿到一本叫做《天使與魔鬼》的小說，作者是個非常不紅的傢伙叫丹布朗，看了她覺得很棒，便連同尚未出版的新作《達文西密碼》一起簽下。《達文西密碼》全球走紅後，波蘭出版界一片譁然，大家都心想「怎會給這傢伙簽走？」波蘭知名大出版社 Albatros 老闆打電話給她，提議「共同出版」，索妮亞自知即使她不同意，將來丹布朗新書也肯定搶不過 Albatros，倒不如利益共享，同時確保下一本書她也有分。\n\n就這樣，以她為名的 Sonia Draga 出版社靠著丹布朗，短短五年間成長為波蘭最具競爭力的翻譯文學出版社，尤其以驚悚、女性和歷史小說為強項。不只如此，索妮亞小姐還是個「自學成功」的攝影師兼旅行狂，出過兩本攝影集，裡面收錄她在加拉巴哥群島（加拉巴哥！！）、非洲和中國等地的照片，甚至帶了一本來推銷西語版權。某天我們看她與一不知名男子在版權中心談了很久很久，以為是被哪來的作家纏上瘋狂推銷，還私下討論要不要去救她，後來才知道那人是秘魯來的攝影書出版社，因為娶了波蘭太太，也會講波蘭語，更重要的是，他是比索妮亞還厲害的攝影師兼旅行狂，曾多次深入秘魯的熱帶雨林！\n\n索妮亞能讀西班牙文和義大利文，我靈機一動，問她想不想找西語書探，她說好呀可以談談，我當晚便發信給卡門‧碧尼拉（Carmen Pinilla），因為她也到了瓜達拉哈拉。卡門住在德國，對波蘭書市也很熟悉，立刻回信說很樂意和索妮亞談談。隔天兩人碰面相談甚歡，我遇到卡門時她說「這下我要請你喝酒了。」之前她幫助我賣出《金山》的歐洲版權，直說要我請喝酒，現在大家扯平啦！\n\n*\t*\t*\t*\t*\n\n五天的書展活動，一轉眼就結束了。我時差還沒調過來，已然要踏上歸途。我在清晨四點半辦完 check-out 手續，搭上計程車直奔機場，經過嚴格的安檢手續，總算順利出關，到 Chili’s 吃了頓墨西哥式早餐。打開百葉窗，機場的輪廓在晨曦中逐漸清晰。我還會再來嗎？即使路程如此漫長、即使下次我不再是受邀來訪的貴賓、即使我的西語客戶足矣，我在心中自問。\n\n也許是三年、也許是五年，但我一定會再回來。\n\n書展相關照片可到這裡觀看。", "summary": "差點拒絕卻去了的墨西哥瓜達拉哈拉書展，成為意外的眼界大開之旅。記錄西語世界最大書展的現場氛圍、與拉美出版人的初次相遇，以及對「中文書走向世界」的重新想像。", "tags": {"type": ["書展記事", "個人隨筆"], "genre": [], "growth": ["書展現場", "世界觀察", "人際交流", "職涯轉折"], "era": ["版權輸出", "出版業轉型"]}}, {"title": "從海島航向世界：《複眼人》的國際版權之路", "date": "2012-01-28", "year": 2012, "body": "故事應該要從去年四月的倫敦書展說起。那時我剛簽下《複眼人》的代理權，只有自己寫的兩頁英文簡介，沒有任何譯稿。在書展上，我第一次見到了英國 Harvill Secker 出版社的編輯蕾貝卡．卡特（Rebecca Carter）。卡特小姐是著名的文學編輯，擅長非英語系的翻譯文學，代表作包括曾轟動全球的《法蘭西組曲》，並有豐富的華文作家出版經驗，曾出版馬建《紅塵》和《肉之土》、戴思杰《巴爾札克與小裁縫》、郭小櫓《戀人版中英辭典》和嚴歌苓《金陵十三釵》等書。\n\n我們結緣於 2010 年的兩次擦身而過，一是她競標《山楂樹之戀》卻沒能拿下版權，二是原本約好在倫敦見面，又因為冰島火山爆發而阻擾了行程。此番終於碰面，她率先說：「你比我想像中年輕！」我說：「哎彼此彼此。」兩人相視而笑。我們聊中文作家在英國出版時遇到的種種問題，我也簡單介紹了《複眼人》，講瓦憂瓦憂島的次子出航傳統、阿莉思尋找丈夫和愛子的故事，還有最後在神秘山中揭曉的謎團。蕾貝卡說她很有興趣，請我務必把資料寄給她。\n\n可是書展結束後，我遲遲沒有和她聯繫。主因有二，一是我想等英譯稿準備好，再連同英文簡介、審讀報告等資料一起發給她；二是我自己杞人憂天怕她只是出於禮貌，實際上未必那麼有興趣。\n\n一轉眼半年過去。期間我找人寫了審讀報告，與譯者石岱崙教授（Darryl Sterk）反覆討論和修潤英譯稿，甚至找了西班牙、荷蘭、波蘭和德國的譯者翻譯樣章，有意打造一套前所未有的「國際」資料（international package）。\n\n十一月初，就在我結束了長達四星期的環球書展之旅，準備從上海返回台北的前夜，我收到蕾貝卡的信。她說記得我介紹過一本「生態幻想小說」（ecological fantasy），但是找不到先前倫敦書展的筆記，甚至不確定作者是台灣還是日本人。唯一可以確定的是：這個故事在她腦中揮之不去。\n\n我興奮得差點沒法睡覺了。更巧的是，石岱崙老師的修訂稿正好在當天早上寄到，我都還沒打開看，居然同一天晚上就收到蕾貝卡的信。我連忙把稿子寄給她。隔天是週五，她說週末就來看，會盡快給我消息。\n\n回到台灣後，我每天都盼呀盼的，盼望她會來信說決定要買，一邊覺得如此天降好運的機會微乎其微，一邊又暗自祈禱奇蹟發生。一個星期後，卡特小姐果真回信了，她說自己很喜歡樣章，正與同事討論，但想知道第一章寫些什麼。當初我挑了第二、三和十二章譯成英文，分別是阿特烈與阿莉思的初登場，以及垃圾島撞上東海岸的章節。第一章篇幅很短，描述深山裡的巨響，其中兩個角色薄達夫和李榮祥都要到小說後半才會登場，初看難免令人一頭霧水，所以我跳過不翻。\n\n我回信向蕾貝卡解釋，順便提議：要不乾脆我寫一份章節大綱好了？她自是喜出望外，說那會非常非常有幫助。於是我趁著週末，把自己關在辦公室，一鼓作氣寫了二十頁的分章劇情大綱。《複眼人》總共有三十一章，我仔細註明了每一章的敘事者、人稱觀點和故事梗概，還順手上網找了些相關照片，剪裁之後放進去。奇妙的是，這本書的敘事和結構巧思，先前讀的時候沒發現，卻都在寫大綱的過程中顯現出來，例如第六部的四章（13-16），分別從阿莉思的觀點寫阿特烈、阿特烈的觀點寫阿莉思，再從達赫的角度寫哈凡，以及哈凡寫達赫。\n\n這份資料果然有用。八天後，卡特小姐正式遞出報價，買下《複眼人》的全球英文版權。收到信的那天我剛從公司回到家，本想晃去附近的簡餐店吃飯，結果途中巧遇室友，大家就吆喝著改去吃熱炒，唏哩呼嚕邊吃邊聊，我得一直按捺住自己想要放聲尖叫「We did it!!!!」的衝動。\n\n是的，這是史上第一次台灣小說由英美的主流文學出版社買下版權，而且不是透過政府或學術管道，而是這些年來我念茲在茲的國際版權交易市場。英語書市向來是全球最難打入的翻譯市場，我們竟然一舉攻克難關。過去台灣文學的外譯，以英語（主要是哥倫比亞大學的中書外譯計畫）和日語最多，法文次之，德文極少，而其他主要的歐洲語言如西班牙文、義大利文、荷蘭文幾乎都付之闕如。台灣文學外譯最多語種的作品，一是白先勇的《孽子》，二是李昂的《殺夫》，從成書到被翻譯，至少都有十年以上的時差。《複眼人》從出版到賣出英文版權，僅僅十個月時間，而且買主還是最頂尖的英國文學出版社，可謂史無前例。\n\n賣國際版權有點像滾雪球，啟動時的摩擦力最大，可是由於西方出版人互動頻繁，訊息交流密切，有名的編輯買了一本書，其他國家的編輯也會注意或跟進，再加上書探或代理的推波助瀾，一旦動起來，就會越滾越大。\n\n在那之後，一切都像是夢一樣。我連續幾天一早醒來，發現信箱裡滿是美國編輯和英國書探的來信，都聽說了卡特小姐買下《複眼人》的事，或者看到我在國外出版網站登出的成交紀錄。一月五日，我清早六點摸黑起床，要和朋友趕赴台南參訪台灣文學館，而我一打開手機，就看到《複眼人》的美國報價，出價者不是別人，正是幾個月前和我一同參加多倫多國際作家節的萊熙．布魯姆（Lexy Bloom）。萊熙任職於美國藍燈書屋集團下的 Pantheon 出版社，主要負責 Vintage 平裝書系，最近剛出了村上春樹《1Q84》的英文版。一月十二日，我在台中老家，正看著 IKEA 組裝師傅把書架和沙發搬上樓，法國 Stock 出版社的外國文學主編瑪莉-皮耶．卡斯迪奧（Marie-Pierre Gracedieu）在臉書上傳來即時訊息，問明電話號碼，便一通越洋電話打來我家，報價要買法文版權。我們是在去年耶路撒冷書展上認識的，也是因為共同參加了國際出版交流活動，而我之所以想到把這書推薦給她，只是某天突然福至心靈想到她出過《士兵修好了留聲機》，不知為何直覺就認為她也會喜歡《複眼人》……。\n\n我做中書外推從大陸作家開始，累積了一定成績和經驗後，才開始推台灣文學。這兩年我也同時勤跑國際出版交流活動（Fellowship），去了墨西哥、法蘭克福、耶路撒冷和多倫多，結識了許許多多的歐美出版人。過去我作為版權引進者，認識的多半是國外經紀公司或出版社的版權部門，而非實際簽書買書的編輯。如今我反向輸出，等於要重頭開始建立人脈，而這些出版交流活動便是最好的平台。\n\n中書外推做得越久，越發覺得人際網絡和資源整合的重要性，也屢屢驚嘆緣分的奇妙。2010 年底，大學畢業後便沒聯繫的外文系學姐舜芬在批踢踢給我寫信，說有本前美國駐台代表的書，要找人出版，我便轉介給合適的出版社。之後我們約了其他幾個學長姐一起吃飯，多年沒見，居然就這麼連上線了。\n\n2011 年初的台北書展，我參加了郝明義先生所主持的亞洲出版論壇，主講「從華文暢銷書到全球暢銷書」。該論壇全程備有英、日、韓三種語言的同步口譯，而負責中翻英口譯的吳敏嘉老師正好是舜芬學姐之前在翻譯所的老師。學姐跑來聽演講，順便介紹我們認識，我才知道吳老師就是《千江有水千江月》的英譯者，也幫中華民國筆會期刊翻過很多文章。\n\n書展結束後，我簽下《複眼人》海外代理權，心想這書應該找台灣的「在地」譯者來翻譯，而先前結識的外國譯者多半以北京為根據地，較熟悉中國大陸的作者和文壇，於是我約吳老師和學姐喝下午茶，討論合作的可能性。老師看了《複眼人》之後非常喜歡，一口就答應了，但因為教務繁忙，得等到暑假才有空。\n\n六月底，在吳老師的介紹下，我又參加了筆會和台灣文學館合辦的論文發表暨研討會，主題就是中書外譯。天曉得我當初就是拿學術論文沒輒，才成了研究所逃兵，怎麼可能在短短時間內生出一篇？但這是認識筆會和台文館的好機會，所以我就硬著頭皮上了。按照論文發表規矩，每個發表人都會搭配一個「講評人」，而負責評論我那篇〈台灣文學的外譯與大眾出版〉的，就是加拿大籍的石岱崙教授（Darryl Sterk）。後來吳老師實在太忙，建議我不妨找石教授翻譯《複眼人》，竟因此促成了這段千迴百轉的因緣。\n\n而《複眼人》其他幾種語言的譯稿，也皆是過去兩年人脈累積的成果：西語譯者哈維爾．阿爾達友（Javier Altayo）是《金山》的譯者，我原本以為他住在上海，結果聯絡上了才知道他在台北住了十年，卻即將搬回西班牙，因此錯過見面機會，可是他生花妙筆翻出的西語譯稿，卻成了法國和美國編輯評估《複眼人》的利器（瑪莉-皮耶和萊熙的助理正好都懂西班牙文）。我在 2010 參加法蘭克福書展遊艇晚宴時認識德文譯者白嘉琳（Karin Betz），去年她又參加文建會台德交流活動來台，她翻譯的德文樣章最終促使瑪莉-皮耶做出決定，簽下《複眼人》。現居荷蘭的譯者郭騰傑對推動台灣文學外譯滿腔熱血，主動寫信給我，後來他的荷籍妻子更翻譯了荷語樣章，令我的荷蘭代理和出版人朋友嘖嘖稱奇。\n\n這一切的源頭，或許是去年台北書展前夕，啊是的整整一年前。當時我正焦頭爛額準備講綱，某天與朋友出去吃飯順便逛敦南誠品，就看到剛出版的《複眼人》，非常驚喜，馬上連同《睡眠的航線》一起買下來，書展期間就一直帶在身邊看，幾次帶外賓去誠品信義店參觀，也都特別帶他們去華文文學區看《複眼人》的陳列，拉開張又然的插圖，換來一次又一次的驚嘆聲，不論對方是紐西蘭的童書出版人、荷蘭的出版人、德國的漢學家、或住在北京的外國書探。\n\n書展還沒結束，我就把《複眼人》讀完了，真覺得眼睛一亮，不久便寫信給吳明益老師和夏日出版社的總編輯靜惠。我們約在海邊的卡夫卡咖啡廳碰面，當天稍後我還去台大誠品聽明益的講座（他說的故事後來成了《天橋上的魔術師》裡的〈九十九樓〉）。靜惠後來還把這件事寫進文章裡：\n\n「《複眼人》有機會被推向不同的國度這件事，對於一直以來夢想把出版本土作者、製作原創書籍當做核心價值和目標的夏日出版社來說，是相當大的鼓勵，因為以這樣的方式想要在當今的出版環境生存並非易事，但這麼做卻是格外有成就感的，所以，不論遇到多少的挑戰和艱難，仍想堅持這樣走下去。當我在今年三月因為《複眼人》海外與簡體版授權一事與光磊、明益在台大附近咖啡店小聊的時候，也許是彼此有些相近的理念，談起來十分愉快。我沒有忘記那天閃耀在每個人臉上的春日午後陽光（還有當天光磊誇張的笑聲），更不會忘記海外授權事件帶來的感動，還有，收到《複眼人》初稿和閱讀後眼睛一亮的心情，謝謝光磊和明益把夢想實現。繼續向前行吧，夢想沒有盡頭。」\n\n一年後的今天，台北國際書展又將開始，而《複眼人》已經賣出中、英、美、法四國版權，石岱崙老師也剛完成英譯初稿。小說中的阿特烈乘船離開瓦憂瓦憂島，躲過了本該是宿命的死亡，來到了彼岸的新天地。我喜歡這個從島嶼出發，勇敢迎向未知的隱喻，也希望這不僅是《複眼人》國際版權的揚帆啟航，更是台灣文學走向世界的新起點。", "summary": "記錄吳明益《複眼人》版權輸出英國的完整歷程，從2011年倫敦書展第一次與Harvill Secker編輯見面，到克服語言、文化距離，最終促成台灣文學走向國際的關鍵時刻。", "tags": {"type": ["版權記事", "書展記事"], "genre": ["文學小說"], "growth": ["版權輸出", "人際交流", "工作意義", "職涯轉折"], "era": ["倫敦書展", "版權輸出"]}}, {"title": "跨越時空的禁忌之戀：《永恆的戀人》", "date": "2012-09-25", "year": 2012, "body": "版權書訊>文學類>歷史/愛情小說\n\nTHE TAKER by Alma Katsu 版權狀況：已售出簡體中文版權\n\n《永恆的戀人》是一部黑暗優雅，集懸疑、邪惡、歷史和情慾於一身的超自然傳奇小說，也是一個讓人心碎的愛情故事，被英國出版界譽為超越《歷史學家》，美國書評家則認為媲美安萊絲，有如成人版的《暮光之城》。本書作者勝愛瑪是記者出身，曾在美國中情局任職，後來大病一場險些喪命，遂決定重新提筆創作，根據她三十年前構思的短篇，擴寫而成《永恆的戀人》。在文學經紀人彼德‧史坦伯格（Peter Steinberg, 《失竊的孩子》）推薦下，本書迅速由 Simon & Schuter 集團旗下的大眾文學品牌 「藝廊」出版社（Gallery Books）用六位數美金簽下，英國則由藍燈書屋集團的 Century /Arrow 品牌買下。\n \n\n《永恆的戀人》在 2011 年底出版後好評不斷，獲選美國書單雜誌 2011 年十大新人小說。藝廊出版社的編輯看中這故事系列發展的潛力，在勝愛瑪交出續集大綱之後、未寫半字的情況下，立即高價簽下兩部續集《永恆的復仇》（The Reckoning）及《永恆的沉淪》（The Descent），構成完整三部曲。英國編輯隨後也跟進買下版權。本系列現已售出美國、英國、法國、義大利、西班牙、俄國、波蘭、土耳其、巴西、捷克、匈牙利、保加利亞、克羅埃西亞、澳洲、紐西蘭等十五國版權，簡體中文版權甫由中國最大的網路文學公司「起點中文網」簽下。\n\n這是一則跨越時空的不尋常愛情故事，故事從美國東北緬因州的小鎮風雪夜揭開序幕，芬德雷醫師寂寞地守著診所、值著夜班。突然警笛大作，救護車送進來一名全身是血的妙齡女子，警長表示森林裡發生了兇殺案，而這位女子便是殺人兇手！\n \n\n芬德雷醫師瞠目結舌地看著少女用銳利的手術刀劃開自己的身體，卻轉瞬間痊癒。她只有一個要求：要他聽她述說自己的故事，然後再決定是否要助她脫逃。「你是否曾經愛得無怨無悔，為了對方，甚至願意偷拐搶騙、知法犯法，把自己獻給陌生人，或與暴徒狼狽為奸？為了對方，願意放棄自己的生命，甚至動手殺人？」名叫蓮諾兒的女子於是說起了她與愛人的故事，那要追溯到兩百年前，地點同樣是這個文明邊疆的寒荒小鎮，當時，這裡還是個清教徒的聚落。\n \n\n當時的蓮諾兒只有十歲，但她只看了強納森一眼，便知道自己將愛他一輩子。可是強納森是村中富商的兒子，與自己地位懸殊，勢必不可能結合。歷經千辛萬苦，蓮諾兒如願成為強納森的愛人，卻因為懷孕而被父親趕出家門。\n \n\n她隻身流浪到波士頓，認識了來自匈牙利的亞戴爾伯爵和他的手下。他們過著極盡奢華的生活，亞戴爾甚至賜予蓮諾兒永恆的生命，並向她說出自己的祕密：原來他從十四世紀活到今天，曾師事邪惡的鍊金術士，幫助他引誘和謀害處女。\n \n\n蓮諾兒終於明白，伯爵真正的目標是強納森，那個金髮白膚，令所有人為之傾倒的俊美少年。伯爵自知肉體老朽，意圖侵佔強納森的青春軀體，繼續逍遙下去。這對苦命鴛鴦決定遠走高飛，然而轉眼兩百年過去，伯爵仍然緊追在後，為了愛人，蓮諾兒決定取其性命……\n \n\n《永恆的戀人》結合了歐洲和美國早期的傳說故事，既是一個跨越古今的鬼故事，也是一則淒美的成人童話，更是一個探討真愛和生命意義的寓言。作者勝愛瑪是日裔美籍，曾在大作家約翰‧厄文門下學習寫作，並取得約翰霍普金斯大學的創作學位。本書是她的第一部長篇小說，續集《永恆的復仇》今年夏季剛於英美上市。完結篇《永恆的沉淪》預計 2013 年推出（英文，精裝，448 頁，Gallery，ISBN: 1439197059，9/11，原文約 135,000 字）。", "summary": "介紹超自然愛情小說《永恆的戀人》，跨越十九世紀美洲荒野與現代緬因州的禁忌之戀，集懸疑、歷史與情慾於一身。作者曾任職美國中情局，大病後轉行寫作。", "tags": {"type": ["書介/書訊"], "genre": ["奇幻", "愛情/歷史"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "無神論者的與神對話：《我看見了天堂》", "date": "2012-10-16", "year": 2012, "body": "版權書訊>非文學類>回憶錄\n\nPROOF OF HEAVEN by Dr Eben Alexander 版權狀況：已售出繁簡中文版權\n\n一個神經外科醫師的瀕死經驗，一次無神論者與神對話的奇蹟，出版前即賣出英國、德國、荷蘭、俄國、日本、韓國、中國大陸、台灣等十五國版權的奇書。\n \n\n2008 年，五十四歲的艾本．亞歷山大醫師正準備前往維吉尼亞大學任教，卻突然罹患了一種極為罕見、乃至於幾乎不存在醫學文獻之中的細菌性腦膜炎（bacterial meningitis）。短短幾小時內，他就陷入昏迷，斷層掃瞄顯示他大腦的新皮質（neocortex）受到嚴重損傷。簡單來說，艾本醫師的大腦功能已經完全關閉，就算他有機會醒來，此生也再也不可能說話和寫字。\n \n\n然而七天後，正當醫師勸艾本的妻子開始準備後事的時候，他睜開了眼睛。\n\n更不可思議的是，經過復健，艾本完全恢復了健康，能說能寫、能走能跳，與正常人無異，但他卻再也不是過去那個篤信科學、斥各種所謂「瀕死經驗」為大腦幻想無稽之談的無神論者。因為身為一個擁有二十五年教學經驗的神經外科學者，他很清楚人的大腦是一切意識和幻覺的根源，如果大腦停止運作，則人不再是「人」，既然如此，他所目睹的一切又要如何解釋？\n \n\n因為就在他昏迷的七天內，他不僅看到了來世，親身感受到慈愛造物主的存在，還遇見了一名女子，而她正是艾本醫師素未謀面、更不知道其存在的親生姊姊（艾本醫師是被收養的）。昏迷之前，五十四歲的艾本．亞歷山大是個無神論者；醒來之後，他卻成為一個堅信上帝存在的人。更因為他是個學有專精的醫學專家，能夠舉證歷歷解釋大腦不可能自己塑造出這些「幻覺」，而使得他的立論更加令人信服。\n \n\n《我看見了天堂》就是艾本醫師不可思議卻又千真萬確的死後經驗，全書有著豐沛的情感、深刻的自我剖析，在科學佐證的同時，有著對於來生、造物主、天使與奇蹟的追尋與感念。這是一部關於瀕死經驗的突破性著作，更是一部探索靈魂、扣問生命意義的大愛之書。\n \n\n本書今年初在國際出版界引起轟動，美國版權由 Simon & Schuster 搶下，之後一個月內賣出英國、德國、荷蘭、俄國、澳洲、巴西、捷克、斯洛伐克、羅馬尼亞、日本、韓國、中國大陸和台灣等十五國版權。Simon & Schuster 原訂明年二月推出，後來又緊急決定提前到十月底，鎖定今年的耶誕節檔期，足見其重視程度。十月初，美國媒體開始報導這本書，短短驚人的媒體效應在短短幾天內便將《我看見了天堂》送上亞瑪遜總榜冠軍寶座。\n\n中央社報導，蘋果日報報導", "summary": "介紹神經外科醫師艾本‧亞歷山大的瀕死體驗回憶錄，無神論者在昏迷期間的「天堂」見聞，引發科學與靈性廣泛討論，版權售出十五國。", "tags": {"type": ["書介/書訊"], "genre": ["非文學/回憶錄"], "growth": ["世界觀察"], "era": ["版權輸入"]}}, {"title": "譚光磊：讓好故事不寂寞", "date": "2012-11-26", "year": 2012, "body": "文/駱瑩瑩（本文刊載於《書香兩岸》雜誌 2012 年 11 月號，第 49 期）\n\n譚光磊是把英文好故事帶到華語地區的人。\n\n和他聊工作或是讀他寫的書訊，很快會陷入一種既亢奮又苦惱的狀態。亢奮是因為，歐美出版圈的那些事，在他熱情洋溢的講述下有一種現場感，彷彿正在上演出版界的「新聞急先鋒」（The Newsroom），隨著事情的發展讓人熱血沸騰。一群掌握歐美出版潮流、炮製世界級超級暢銷書的編輯、文學經紀人，在短時間內如何搶下一本書，而每一位出場的人物又都帶著密度極高的信息。這位曾以幾百萬美金簽下某一本出版圈內耳熟能詳的經典之作；那位手上握有幾位世界級作家；間或也會有一些國際出版圈的「豪門恩怨」、「個人恩仇」，看似遙遠的國際出版圈人與事，變成可以在茶餘飯後閒聊的話題。苦惱是因為，在他的講述下，每一本書都精彩到讓人覺得錯過了是一種巨大的損失，於是看到自己放入購物車的書單越來越長，陷入閱讀和資訊焦慮中。\n\n譚光磊充滿熱血的書訊，讓國際版權代理的角色不再默默隱於書的背後，也讓這個職位被賦予更多的個人因素。從 2004 年開始做版權代理，到 2008 年成立以自己名字命名的版權代理公司「光磊國際版權經紀有限公司」，從只代理繁體中文版到代理簡、繁體中文版，短短幾年的時間，他已經成為華語地區繼大蘋果、博達之外，非常重要的版權代理人。根據美國出版網站 Publishers Marketplace 統計，他的版權公司交易量為2010年非英語系國際小說冠軍。從某種程度上說，他的推薦影響了華語讀者閱讀歐美小說的口味。\n\n熱血奇幻迷\n\n1979 年出生的譚光磊，在成為版權代理人之前，是一名瘋狂的奇幻迷。中學時因為喜歡電腦遊戲，他開始讀許多歐美奇幻小說，高中畢業那年已成為奇幻小說的譯者，此後更經歷奇幻出版的許多角色：讀者、譯者、作者、推廣者、選書人、編輯、顧問、審稿、書商，直至版權代理人。\n\n2004 年，在研究所念了一年之後，因為要與朋友做電腦遊戲，他休學在家。不料遊戲沒做完，朋友去當兵，金主要他們把錢「吐出來」，寫訴狀、打官司，敗訴。這個打擊終結了他的遊戲夢，也讓他重回奇幻文學之路，除了繼續當譯者之外，還和出版社合作選書。可是書選了，版權要找誰談？他來到家西書社，一家專門代理歐洲書的版權代理公司，兼職開拓英語系業務。做了大概半年，要復學了，想著「一邊念書一邊兼顧版代工作」，結果才開學一個月，去了一趟法蘭克福書展，而工作和學業之間也越來越難於取得平衡，於是放棄學業專心做版代。\n\n放棄的可是台大外文系的碩士學位，譚光磊也不覺有多大遺憾。「之前做過出版的很多環節，雖然也都覺得那些工作很有意思，但總還是覺得沒有一個是百分百適合我的。」在禮筑外文書店做原文書採購時，雖然手握選書大權，可是外文書畢竟是小眾，一本書能賣出五本已經算是暢銷。對推廣奇幻抱著滿腔熱血的他心想，如果做了版權代理，推薦的書翻譯成中文版，再怎麼不好賣也有上千本的量，這個效力要大很多。而做翻譯是一份很寂寞的工作。一本書至少要翻三個月，厚一點的可能是六個月，《冰與火之歌》第一部他翻了兩年。那麼長的時間都是一個人在工作，很難與人分享工作中的感受，非常悶。「我覺得自己的注意力沒辦法集中那麼長時間，比較需要不斷有新的刺激。做版代最棒的地方是，一直有新書進來，剛開始做的時候，因為手上代理的書不多，看到一本有興趣的書，可以拋下一切讀個三天三夜，然後花一個下午的時間寫一篇熱血的推薦，發給客戶之後，就可以再去看下一本書，不像做翻譯時會被一本書拖著，別的東西都不能做。」\n\n不過，等譚光磊真正進入版代這個行業，奇幻文學在台灣已經泡沫化，他的閱讀口味也被迫從奇幻擴展到不同的領域（不這麼做會活不下去），歷史、推理、犯罪，言情，不只文學類，還有科普、商管、健康、生活、傳記等等，也因為這樣逐漸開拓了他閱讀的視野。\n\n找到「對的」版權負責人\n\n譚光磊做版代時，歐美版權書大部分由大蘋果、博達兩家版代公司負責，這兩家公司手上都是大客戶，這些客戶大到不需要怎麼向出版社推薦，都可以很快賣出版權，所有台灣地區的出版社不管找什麼書，版權都在這兩家公司手上，而且大部分是獨家代理。除了入行晚，手上拿不到大客戶，該怎麼找到「對的」版權負責人，對譚光磊也是一種考驗。\n\n「簡單來說，拿到一本美國書，看上面是什麼出版社出版，但是這本書的中文版權是誰代理，從版權頁的信息是看不出來的。通常會覺得版權應該是在出版社手上，問題是美國的版權分得非常細，這家出版社可能只拿到了這本書的英文版權，中文版權可能在經紀人手上。經紀人又很複雜，這位美國作家可能找的是英國的經紀公司，又或者美國作家找的是美國經紀人，但這家美國經紀公司不處理海外版權，他要找英國經紀公司來處理翻譯版權，可是這家英國經紀公司在中國地區又是非獨家授權，有三個代理。要怎麼準確、迅速地找到那個負責人，真的是憑經驗，多摸索。幾次之後累積的這些信息就是你的資料庫。」\n\n好在美國的經紀人夠多，多的好處是他們會合並、會自立門戶、會跳槽。剛開始譚光磊手上只有幾個客戶，和某些大的公司談版權代理也不順利，可是因為留心業界動態，善用google，花心思整理手上的資料，他很快便摸清了門道，理順了關係。看到有人出來自立門戶，就趕緊寫信與他聯繫，彼此都是新出來做的，就有了合作的可能。很多合作都是靠這樣「鑽」出來的。\n\n譚式書訊，革命性的版代服務\n\n慢慢累積了客戶資源，可是還是不如大的版代公司書目一大串。小蝦米如何對抗大鯨魚，怎麼讓出版社留意，也願意花時間看自己代理的書？書訊，是很好的突破口。在此之前，台灣負責英文書的出版社編輯只會收到一封簡單的英文書訊，但很快的，他們便被譚光磊的中文熱血書訊所吸引。他筆下的每一封書訊，都有一個動人的故事以及非常多的細節和巨大的信息量。\n\n動人的故事考驗的是譚光磊組織、提煉以及資料整合的能力。他能用千把字把一個幾十萬字乃至上百萬字的故事講得扣人心弦，並告訴你這個故事的重點、賣點，作者生平有什麼好玩的花絮，甚至與這本書有關又有哪些國際出版圈的八卦。有時連書名他都幫忙想好，甚至營銷的重點都一併考慮。\n\n革命性的版代服務，讓譚光磊代理的書很快便找到賣家，也讓他得到更多出版社的認可。久了之後，這種「譚式書訊」也形成了自己的能量，不斷發酵。在他的「灰鷹巢城」部落格，書訊的讀者已不僅僅限於出版界的編輯，也成為許多普通讀者購買歐美小說的參考信息。\n\n說到自己的風格強烈的書訊，譚光磊說：「做久了，看到一本書很自然會有理性和感性兩種分析。感性的部分，是一種直覺的個人喜好，自己有沒有被這樣的題材感動。理性的部分，則會去分析類似的題材以往有沒有出過，賣得怎樣，有沒有哪些條件可以為這本書加持。」\n\n不管是得獎還是賣出多少個版權，版權賣到哪一國，做得越久,這些都是他可以專研得越深的信息。剛開始的時候，他的書訊中的信息也只是比較表面的「賣出德國、英國、法國等幾國版權」，「上了什麼的排行榜」之類。一段時間之後，他已經可以詳細地寫出，「賣出的德國、英國、法國等幾國版權，德國的這家出版社出過什麼書，法國的這家出版社出過什麼書」，他甚至能發掘出這幾家出版社之間有沒有什麼共同的特點，如果有，也會在書訊中提及。到後來，書訊裡提到的不單是出版社，還有編輯。在國外，出版人個人的因素對出版的影響非常大，編輯選書的眼光非常重要。於是，「某一本書賣出某幾國的版權，德國是哪個出版社的哪位編輯買下，那位編輯曾經簽過某某書，那本書的中文版曾經取得怎樣的銷量，上了某某排行榜」；「這本書的經紀人是某某，他還代理過哪幾本書，他的哪一本書曾經賣給某一家出版社的某某編輯……」以至於有某位出版社總編輯笑著說，「看譚光磊的書訊，好像每一本書都不能不買。」\n\n看書的時間，也是一種投資\n\n有一段時間，譚光磊和在中學當老師，閱讀量很大的母親，每天晚上在電話裡常常進行這樣的對話。\n\n「我剛看了 XXX（書名）。」譚媽媽說。\n\n「啊我知道！那就是誰誰誰（作者名）的新書，某某某（出版社名一）這個書系不錯，上回你看的XXX（書名二）也是他們的。這書是 XXX（編輯朋友名）做的，之前他在某某某（出版社名二），跟我買了 XXX（書名三）。」光磊激動地回答。\n\n「這書你看了嗎？」譚媽媽問。 \n\n「我買了。」光磊底氣不足地答。 \n\n「你是負責看書名的嗎？」譚媽媽又問。\n\n「……是。」\n\n實在是因為自己代理的書太多，能看完十分之一就已經很不錯了。後來，因為自立門戶，每天要處理的書量就更大了。前面幾年練就的非常扎實的看書、講書、寫書訊的功夫派上了大用場。「到後來，可能一天就要發兩三本書，根本跟不上這樣的書量，當然也會有同事幫忙看書稿寫書訊，但是大部分還是我。到這個時候，看書的時間也變成了一種投資，要不要花五個小時、十個小時去看一本書？也許花了時間去看也覺得不怎麼樣，中途就會停下來去看別的書。也可能只讀一點書的內容，或者可能根本沒時間看，但是你知道這是一本大書，這個題目是好的，就上網查資料。」書訊還是必須要寫的呀。\n\n好在譚光磊很享受寫書訊的時刻。他曾在部落格上寫道：「宮部美幸說：『一定要流汗用力，才算是工作。』對我來說，每天一定要寫了書訊，才覺得有‘工作’到。不管談成多大的案子、搞定多少合約、回復多少郵件，沒有寫書訊，就覺得心裡虛虛，沒盡到本分似的。」\n\n而「譚式書訊」也為一些本來不出位的好書帶來機會。「外國的書非常多，我能做的，就是選擇這本書然後主力推它，這樣會讓這本書的能見度高很多。有些書在國外得獎，有很好的銷售成績，未必需要這個加分大家自然會注意到，但是有些書內容不錯，在國外的表現也好，只是沒有到那種在排行榜第一名的亮眼成績，如果推它一把就會出來，做這種書是最有成就感的。這幾年我最有成就感的都是那種賣四五萬本的書，那些書原本可能是一本根本不會有人注意到的書，或者只能賣兩三千冊，因為包裝成功，宣傳到位，有了很不錯的表現。」\n\n版權代理，活在未來的孤寂\n\n譚光磊形容做版權代理好像「活在未來的孤寂」。幾年下來，自己的時間觀念完全改變，除了換算各國時差的能力大大增強之外，也真正學會了「凡事向前看，永遠活在未來。」他說，「過去專注於奇幻領域的時候，從不認為追新書有什麼必要，因為至少有一百年分量的各種經典作品還未被引介，連大師都認不全，還談什麼新人？但是開始做版權代理之後，思考方式開始改變，或許是因為國外的出版量實在太大，編輯們連新書都應接不暇，哪還有力氣回頭？這些早已無關對錯或者品味，純粹就是出於職業的不得不然。」\n\n而「孤寂感」和版權代理人在歐美地區和華語地區所扮演的不同角色有很大的關係。在歐美國家，尤其是歐洲大部分出版人的英語都很好，所以他們的讀稿速度快，而且出版社有找審讀者的習慣。他們分別有固定的西班牙文、德文、法文等語種的審讀人，書稿評估的流程很成熟，運作得也非常順暢。華語地區乃至整個亞洲地區，做外國文學的速度都是跟在他們的後面。 \n\n此外歐洲的出版社大部分都有書探。以一家德國出版社為例，他在美國有書探。這個書探是一個團隊，這個團隊的人就在美國，與大部分美國出版社和經紀人的關係很好，他們能很快地拿到各式各樣的書稿，甚至經紀人還未把書稿投給出版社的時候，他們已經知道有這本書，可以把這個信息反饋給自己的客戶。因為每家書探在每個國家都只能有一個客戶，也因此客戶之間不會有利益上的衝突。這樣一來，還有另一個好處，如果某個書探手上有一本熱門的書，而他手上同時有十三個國家的客戶，這十三個國家的頂尖出版人就有可能同時看一本書的書稿，然後討論。而華語地區的出版社，大部分時候是等到一本書出來，上了亞馬遜的排行版，上了《紐約時報》才會去問版權，然後等樣書，判斷是否要購買，一本國際熱門書的出版在速度和時效上遜色很多。\n\n譚光磊所從事的版權代理的工作，是華語地區傳統意義上的版權代理再加上一點點書探的混合體。他有機會較早地接觸到一本書的資料。這種「早」有時也是一種「寂寞」。年輕熱血的他，「難免幻想能與歐美同步，成為出版前就賣出幾十國版權裡的一員」，但「文化差異、語言問題到出版規模、口味、歷史等等原因」，導致難達這樣的心願。他發出這樣的感歎：「當手上只有一份幾百頁的電子文件，有經紀人的見解和熱情的推薦；當網絡上沒有絲毫蹤跡，連業界都僅有隻字片語，你要拿什麼去吸引出版社注意？有什麼『證據』去說服他們？那真像一場自以為是的虛妄。去年法蘭克福書展（2005年），輾轉聽聞海外版權天王丹尼•巴羅剛談成的超級大作，預付版說高達兩百萬美金云云，顯然是業界爭相走告的注目焦點。書展前幾周才賣掉的作品，那時就已經售出幾十國版權，連南韓都發瘋似地砸下四萬美金搶走。回台後我收到八百頁的電子稿，還有目錄裡短短幾百字什麼也講不清楚的簡介。我開始在網絡上找數據，但一切都是徒勞。當下不禁錯覺：這書真的存在嗎？」\n\n選擇了這行，就註定要承受這樣的寂寞，包括對自己所叢事行業的瞭解和懂得，也僅限於關注歐美出版的同行之間。不過總還是希望能做點什麼填補理想化和現實操作之間的距離。對譚光磊來說能做的就是，通過自己所扮演的角色加速出版社的看稿和做決定的週期，盡可能地提供更多有助於出版社下判斷的資訊。\n\n版權輸出，Fellowship是社交好場所\n\n2008年，在接受台灣《天下雜誌》採訪時，譚光磊曾對台灣本土創作者放言：「好好寫，我會負責把你賣到全世界。」這句聽起來有點不知天高地厚的話，在 2012 年實現了。經譚光磊代理，台灣著名作家吳明益的《複眼人》賣給了美國 Pantheon出版社（美國很有名的嚴肅文學出版社）村上春樹的編輯。這是第一本由美國大出版社簽下的台灣小說，也是譚光磊賣到歐美的第一本台灣小說家的作品。此前他代理的華裔作家張翎的《金山》，曾賣出十國版權。\n\n對任何一位版權代理人來說，在版權引進順差常年大於輸出的情況下，能將母語作品賣到世界，都是一件令人振奮的事情。雖然引進和輸出都屬版權代理工作，但分屬兩個不同的系統。做引進的時候，聯繫的人，不管是各個經紀公司還是出版社，都是賣版權的部分，而當要賣東西給對方的時候，決策人往往是出版社的編輯。在國際出版界，這些為各大出版社買版權的編輯都是真正呼風喚雨的人物。每位出版社都有一兩位充滿傳奇色彩的明星編輯。可是要怎麼認識這些編輯，讓他們注意到自己手上的好作品？書展的版權交流活動（Fellowship）是很好的方法。最近幾年，譚光磊開始積極參加版權交流活動，跑一些以前比較不會參加的書展，比如墨西哥書展、耶路撒冷書展等。\n\nFellowship中文似乎沒有很直接可以對應的詞，可稱之為「短期研習」。在書展圈，最早舉辦的是耶路撒冷書展，還分為編輯和經紀人兩種研習。後來法蘭克福書展也效尤，成為舉辦得最好的書展版權交流。台北書展也從 2012 年開始舉辦。版權交流不以商業為目的，主要是讓大家瞭解舉辦地的文化和出版情況，並邀請世界各地的出版人（主要是編輯）前來參加。參加版權交流活動，就有機會和一群頂尖編輯認識，和他們也是一種同期同學的關係，一起認識一個地方，吃喝玩樂都在一塊，很自然地會建立起一種友誼。而且書展上，編輯們還舉辦各種版權交流活動的同學會，認識的編輯也會邀請一起參加，靠著這些社交活動，譚光磊認識了許多世界有名的出版社的頂尖編輯。\n\n買下吳明益那本書的美國編輯，是譚光磊在多倫多的活動上認識的。在一天大會中途休息時，這位編輯讓譚光磊推薦一些中文書給他，結果她對《複眼人》表示出了極大的興趣。而巧的是，買下《複眼人》英國版權的出版社與這位編輯所在的美國出版社是同一個集團。美國和英國做嚴肅文學的對口出版社，這兩家出版社彼此的口味相近，就這樣促成了這本書美國版的輸出。\n\n老老實實做好口碑\n\n聽譚光磊說版代這個職業，每一本書背後都有一堆的故事。和家大業大的國際出版社談版權，原來也會遇到不專業的出版人，有各種讓人無語、難搞、氣得想摔東西的事。有些人的作為實在太誇張也就不合作；有些只能打破牙齒和血吞；還有些，因為出版社還要繼續出他們家的作品，想到自己如果不做了，出版社就要直接與對方聯繫「好可憐」，便勉為其難幫忙。當然，也有各種「柳暗花明又一村」的意外驚喜。說到國際版權代理，好像大得不得了圈子，其實做久了之後，才發現這個圈子很小，來來去去就是這些人，很多事情都是口耳相傳。\n\n最近頻頻有新聞傳出的超級暢銷書《格雷的五十道陰影》的中文版代理人就是譚光磊，而他會跟這家經紀公司合作，也是不曾料到的「意外收穫」。這家經紀公司原本就是譚光磊夢寐以求的客戶，2004 年他因為另一本書曾與他們聯繫過，結果收到「謝謝你的來信，不過我們都跟XX合作」的冰冷回信，然後便不再理他。剛開始他也覺得好遺憾，沒想到他的別的客戶因為通過這家公司賣外國版權，就跟他們推薦了譚光磊，2008 年，他們主動聯繫譚光磊談合作，彼此之間建立了很好的合作關係。\n\n像這樣曲折的合作故事，譚光磊有一籮筐。「老外之間熟得很快，他們有酒會文化，資訊的傳遞速度也非常快。你很容易認識人，人家也很容易認識你。所以老老實實做好口碑就好。」 譚光磊笑笑說。\n\n經歷過出版上游的諸多環節，成為版權代理人也有八年，我問譚光磊對這個行業的看法有沒有什麼變化，他只是淡淡地說：「沒什麼特別的。這個行業以前不太賺錢，現在也還是不是很賺錢。」這的確不是一個賺錢的行業，對譚光磊來說，這卻是會持續帶給他滿腔熱血和維持他熱情的行業。他一直懷著當年「瘋狂奇幻迷」的一腔熱血在做著這個自己喜歡的職業，讓中文世界的讀者不錯過任何一個好故事，也用自己的努力和熱情，賦予版權代理人這個職業，更多「個性化」的色彩。", "summary": "《書香兩岸》雜誌記者採訪版權經紀人譚光磊，介紹其日常工作、選書眼光，以及「讓好故事不寂寞」的出版理念。是難得一見的完整人物側寫。", "tags": {"type": ["人物專訪"], "genre": [], "growth": ["工作意義", "職涯轉折", "人際交流"], "era": ["版權輸出"]}}, {"title": "劫富濟貧的奇幻俠盜演義：《盜賊紳士拉莫瑞》", "date": "2012-11-26", "year": 2012, "body": "本文是《盜賊紳士拉莫瑞》中文版導讀（時報出版，12/12）\n\n許多人認為這幾年是奇幻文學新的「黃金年代」，因為類型發展成熟、創作者人才輩出，市場反應熱烈、影視改編不斷，奇幻已不再是個小眾文類。然而即便是在如此繁盛的當代奇幻文壇，史考特‧林區戲劇性的崛起仍屬罕見的異數。\n\n2004 年八月，英國「獵戶座」（Orion）出版社編輯總監賽門‧史班頓（Simon Spanton）無意間發現林區貼在某部落格的小說，大受震撼，立即用高額版稅簽下《盜賊紳士拉莫瑞》等四本書的全球版權。當時林區才二十六歲，住在爸媽家的地下室，當過洗碗工、餐廳服務生和網頁設計師，甚至還是個領有執照的志願消防員。在英美的出版體系中，作家想找到經紀人已非易事，遑論出書，但這個住在明尼蘇達鄉下的長髮阿宅竟然麻雀變鳳凰，搖身變成英國首席奇幻出版社力捧的明日之星，怎麼不叫人羨妒交加？\n\n我還記得那年帶著樣書回台中老家，在火車上翻開《盜賊紳士拉莫瑞》，讀得激動不已的情景。我用一整個週末狼吞虎嚥看完，突然能夠領略編輯或經紀人發現傑作時如獲至寶的狂喜。那不只是「這書會紅」的商業考量，而是此生難得幾回的驚豔和震撼。後來我寫下一段話來描述這本書：「它從奇幻類型源遠流長的傳統中獲得滋養，茁壯而繁衍出嶄新樣貌；它有著大師經典的氣味或者痕跡，但那不是怠惰抄襲、亦非了無新意，而是站在巨人肩膀的更上層樓，類型演化的里程明證。它具有一切讓我最初愛上這個類型的要素：劍與魔法的對立、壯麗和墮落並存的奇幻城市、繁複多姿的佈局，以及說來簡單可是做到很難的「驚奇感」（sense of wonder）。它不是另一個《哈利波特》跟風的青少年奇幻，它可以有成人世界的黑暗、暴力和死亡、復仇與犬儒，黑色幽默還有蒼涼的世事無常。」\n\n到了2005年底，《盜賊紳士拉莫瑞》的樣書已經開始在書評家、奇幻部落客和書店採購間流傳。《冰與火之歌》的作者喬治‧馬汀讀了拍案叫絕，幾乎逢人就推，直說這是他多年來讀過最好的新人作品。2006 年，《盜賊紳士拉莫瑞》閃亮登場，果然寫下市場佳績，並且贏得讀者一致好評。該書最終賣出二十七國版權，獲世界奇幻獎和軌跡獎雙料提名，華納影業更買下電影版權，準備作為「哈利波特」系列電影結束後的接棒作品。\n\n故事的舞台是虛構的奇幻城邦卡莫爾（Camorr），有如文藝復興時代的水都威尼斯，這裡運河遍布、遊船如織，玻璃拱橋優美的弧線劃過半空、參天高塔拔起平地數百呎，僅能靠人工拉動的升降鐵籠往來。這裡有奢華的水上市集、喧鬧的嘉年華會、女戰士鬥鯊魚的死亡競技、能同時結出檸檬和萊姆的魔法老樹，卻也有陰森的墳場、危險遍布的城郊荒原、龍蛇雜處的賭場與妓院，彷彿是威尼斯與紐奧良的綜合體。\n\n很久很久以前，當人類還未出現的時候，卡莫爾曾是不知名上古種族的居住地。後來他們消失無蹤，只留下滿城的祖靈玻璃廢墟（Elderglass）。這是一種堅韌無比的結晶材質，人類始終無法參透其中奧秘，遑論複製或改造。城中有五座通天高塔，皆以祖靈玻璃造成，每天傍晚即吸收落日餘暉，在黑夜降臨的前刻散發光芒，如同另一次日落，人稱「詭光」（Falselight）。\n\n卡莫爾城中貴族和商旅往來頻繁，並藉由水運及港口之便，成為四方商業之都。這裡雖由公爵所統治，但不過真正掌握卡莫爾還是黑幫老大巴薩維（Capa Barsavi）。這位研究修辭學出身的學者多年前來到卡莫爾，以極端殘酷而有效的手段，在短短時間內一統眾幫，成為至高的幫派領袖。他和公爵的秘密情治頭目達成協議，幫派不碰貴族階級，黃袍警衛則對幫派的各種勾當睜一隻眼閉一隻眼。這就是俗稱的「秘密和議」（The Secret Peace）。\n\n主角洛克‧拉莫瑞在一場瘟疫中失去雙親，被竊盜集團頭目「傳盜師」（Thiefmaker）收留。洛克是個天才神偷，尤其精於易容和各式詭計，入門第一天便已從黃袍衛兵身上偷了東西，之後各種麻煩更是接踵而至。為了避免惹禍上身，傳盜師遂決定把洛克廉價賣給盲眼僧「鐵鍊神父」，小說正式開始。\n\n相傳這位盲眼僧為了表示信仰虔誠，乃挖去雙眼，纏以白布，並且全身以鐵鍊綑綁，永遠無法離開神廟，藉此換得信徒香油錢。事實上他兩眼靈光，拜的是十二諸神之外的第十三個竊盜之神，還以神廟底下的祖靈玻璃地窖裡作為根據地，自組「盜賊紳士團」。在他的調教之下，洛克學習各種語言、貴族談吐、用餐禮節、算數、扮裝、烹飪，是盜賊也是紳士。\n\n《盜賊紳士拉莫瑞》從洛克加入鐵鍊神父門下揭開序幕，隨即跳躍時空二十年，以洛克成年後的冒險為故事主軸，但又在每一章結尾加入「插曲」，回溯他的童年往事，或講述卡莫爾的歷史和寓言。這種作法既不會因成長過程太過冗長倒盡讀者胃口，又能收「今昔對照」的奇妙效果，可謂高明至極。\n\n《盜賊紳士拉莫瑞》可說是一部披著奇幻外皮的犯罪小說，因為故事主軸正是講述洛克和同夥們如何偷拐搶騙，周旋於卡莫爾富商和貴族之間，賺進大批銀子，與同樣 2006 年出版的《迷霧之子：最後帝國》有異曲同工之妙。不過《迷霧之子》的主角具有鎔金術的特異功能，目標也更大（要騙倒一個帝國）。洛克‧拉莫瑞則是個完全沒有魔法的「正常人」，只是個子特別瘦小、歪腦筋動特別快、嘴巴特別賤，遇到需要動手的時候，他要嘛拔腿就跑，不然就得請出他長得特別胖、可是特別會打架的搭檔吉恩（Jean），揮動一雙叫做「邪惡姊妹」的手斧，把敵人打得滿地找牙。\n\n洛克和吉恩的組合，當然會讓人想起佛利茲‧萊柏（Fritz Leiber）經典的「蘭訶瑪傳奇」（Lankhmar）系列。萊柏正是「劍與魔法」（Sword and Sorcery）文類的定義者，與創造野蠻人科南的勞勃‧霍華（Robert E. Howard）和白子戰士「艾爾瑞克」系列作者麥可‧摩考克（Michael Moorcock）並列為這個類型的三大宗師。「劍與魔法」類型的一大特質是主角往往不具備魔法能力，必需透過自身的武力（劍）去對抗邪惡的巫師（魔法），其次則是故事中的衝突多半聚焦於個人，而不像史詩奇幻動輒攸關世界的命運。\n\n「蘭訶瑪」由一系列中篇小說組成，敘述盜賊「灰鼠」和野蠻人法夫納在墮落的罪惡之城冒險的故事。《盜賊紳士拉莫瑞》當然有幾分向大師致敬的意味，但林區另闢蹊徑，讓故事脫離了傳統奇幻小說的中世紀風格，來到文藝復興式的貿易城邦，因為唯有這樣的設定，才有中產階級的興起，得以讓洛克用扮裝/易容的方式穿梭於權貴之間，而水都威尼斯一般的運河、假面舞會和嘉年華會，則提供了最完美的騙術舞台。\n\n《盜賊紳士拉莫瑞》除了為類型注入充沛活力，更具有跨出類型，吸引主流讀者的特點，比如說驚悚小說的情節，讓人拍案叫絕的高超騙術、帥氣的動作場面和賤到極點的唇槍舌戰。歸根究柢，這是一個讓人無法釋卷的精彩故事：孤兒的成長奮鬥、俠盜的劫富濟貧、黑幫的火拼復仇，還有令人動容的兄弟情義。\n\n依照林區的計畫，「盜賊紳士幫」一共有七部曲，前四部各以不同的城市為背景，後三部則擴展為與整片大陸相息息相關的大故事。他早已準備了大量背景資料和詳細的故事大綱，只要按部就班，應該很快能完成系列，也因此獵戶座訂下了野心勃勃的出版計畫，打算每八個月推出一本續集，在四年內出完。\n\n2007 年，續集《紅色天空紅色海》（Red Seas Under Red Skies, 暫譯）如期上市，可是第三集《盜賊共和國》（Republic of Thieves）卻遲遲不見蹤影。讀者等呀等的，一年過去又是一年，在長時間銷聲匿跡之後，林區終於在 2010 年在網誌上公開說明自己罹患了憂鬱症，正在接受治療。也許是成名太快帶來的壓力，也許是他對自己嚴苛的要求，也或許是喪失至親和婚姻告終的傷痛，讓他陷入前所未有的低谷，可是他選擇勇敢面對，也得到讀者和出版者的鼓勵和支持。\n\n現在是2012 年底，《盜賊紳士拉莫瑞》即將在台出版，從售出版權到中文版上市，因為太多無法預料的因素，而有了長達六年的「時差」。可是這場漫長的等待，竟與《盜賊共和國》至今仍未完稿的狀況遙相呼應。而台灣的奇幻出版，從《哈利波特》和《魔戒》掀起熱潮又歸於沉寂，一晃眼也走過了十年。彼時出版社盲目摸索、缺譯者也缺讀者，如今出版者累積了經驗、磨練出了眼光，資深的類型讀者也成了譯者、編輯、審稿者和評論者。《盜賊紳士拉莫瑞》的姍姍來遲，似乎也不是錯過時機的無可奈何，反而是陰錯陽差的正是時候了。就在兩個月前，華納的電影開發合約到期，《盜賊紳士》的影視版權轉由另一家電視公司接手，準備籌拍美劇，這不也是得利於《冰與火之歌》影集的成功嗎？\n\n寫這篇導讀的時候，是一個陰雨的週末早上，我的心裡五味雜陳，有太多的話想說，關於奇幻類型與出版的流變、關於一夕成名而後又墜落深谷的史考特‧林區，關於這本如同彗星一般閃亮耀眼的小說，卻又不知從何說起。\n\n但是那都不重要。重要的是，現在你手上拿著《盜賊紳士拉莫瑞》，你也即將走進這個迷人的奇幻城邦卡莫爾，一起見證拉莫瑞的傳奇。", "summary": "為《盜賊紳士拉莫瑞》撰寫的中文版導讀，介紹史考特‧林區從無名部落客到暢銷作家的傳奇崛起，以及本書精妙的敘事結構與黑色幽默風格。", "tags": {"type": ["導讀"], "genre": ["奇幻"], "growth": ["閱讀體驗", "人際交流"], "era": ["版權輸入"]}}, {"title": "當退休殺手遇上貴族少爺：《史密斯計畫》", "date": "2012-12-03", "year": 2012, "body": "版權書訊>文學類>奇幻小說\n\nTHE ANVIL OF THE WORLD by Kage Baker 版權狀況：已售出繁體中文版權\n\n凱姬．貝克生長於加州好萊塢，全職寫作以前曾長期在劇場工作，甚至教授伊莉莎白時期的古典英文。她四十五歲才正式出道，以《伊登園》（In the Garden of Eden）一書開啟結合歷史和時間旅行的科幻系列「超時空企業」（The Company），奠定了她在文壇的地位。可惜貝克在 2010 年以五十七歲之齡過世，留下十多部作品，否則應該會有更大的成就。\n \n\n《史密斯計畫》是貝克在 2003 年發表的作品，原名《神之鐵砧》（The Anvil of the World），係由三個中篇組成，也是她首度嘗試奇幻長篇。小說設定在一個地理環境神似加州的幻想世界，這裡主要有兩個種族，「太陽之子」（Children of the Sun）是鍛造之神和火焰女神結合的後代，基本上就是一個黃紅皮膚、擅長器械技術，也因此一天到晚破壞環境，而且易怒好鬥，動不動結仇結怨的種族。另一個種族「延追」（Yendri）則有點像精靈，崇尚自然與平靜，絕不訴諸暴力，長於醫術和各種靈性修練，因為他們身形高挑，膚色發青，又被「太陽之子」蔑稱為「綠仔」（Greenie）。\n\n小說的主角想當然爾叫做史密斯，而這名字毫無疑問也是個假名。此君本是個身懷絕技的刺客，沒別的本事就是最會殺人。但他受夠了滿手血腥的生活，也不想要老是活在被人追殺的恐懼裡，於是隱姓埋名、遠走高飛，來到楚恩城（Troon）投靠表哥。這座城素有「黃金之城」美稱，因為它座落於沃野千里之中，四周都是金黃色的大麥田，城裡的風車和穀倉巍然挺立，是著名地標，但也因此空氣中麥屑紛飛，導致居民長年罹患肺氣腫。\n\n偏偏楚恩城的居民又以身為世界頭號糧倉自豪，於是在這裡「打噴嚏」是一種時尚行徑，而每年社交圈最重要的活動，叫做「口罩節」。光看這樣的開場，就不難看出凱姬．貝克的文字魅力：有創意的設定，鮮活生動的語言，還有冷面笑匠式的幽默。\n \n\n《史密斯計畫》的前三分之一簡單說是個「運鏢」的故事。原來史密斯的表哥靠經營商隊為生，但手下的商隊長正好生病，在人手緊缺之下，便叫史密斯去代班，這個毫無運鏢經驗的前殺手也只好硬著頭皮上陣。車隊成員無奇不有，一對夫婦帶著幾個哭鬧不休的死小鬼，他們叫史密斯夫婦。負責替大夥兒煮東西吃的阿姨是個廚藝高超的美食家和老江湖，也叫史密斯太太。可想而知，每個人都有不為人知的過去。除此之外，車隊裡還有個病得奄奄一息的貴族小少爺「厄曼威」（Lord Ermenwyre）和他豐滿美艷的奶媽。行蹤鬼祟的信使帕拉丹．史密斯（Parradan Smith），還有唯一延追人草藥師「容立新．蘆葦開花」（Ronrishim Flowering Reed），以及負責偵察的跑腿信差女孩「燒得亮」（Burnbright）。\n \n\n就在車隊行經一座延追人大本營的森林時，史密斯看到遠處一座聳立的黑暗山峰，而史密斯太太也講起了一個著名的傳說。相傳多年以前，山上出了一個外號「山大王」（Master of the Mountain）的惡魔，四處侵襲、為非作歹，而彼時延追人信仰一位純潔至美的聖女，她決心親自出馬，收服這個惡魔。\n \n\n誰也想不到，聖女竟然和惡魔一看對眼，歡天喜地結為夫妻，還生了一堆半人半神半魔的小孩。部分延追人繼續追隨聖女，卻也有人認為她背叛了信徒，或者認為惡魔玷污了她的貞潔，因此誓言殺死山大王所有的後代。當然，延追一族愛好和平，絕對不會親自動手，所以都是花錢雇傭兵來殺人。\n \n\n按照這類故事的傳統，原本貌似單純的運鏢任務，一定暗潮洶湧。果不其然，大夥兒才上路沒幾天，就接二連三遭到攻擊。有盜匪攔路，有飛龍空襲，甚至連到了旅店都有人埋伏，而且顯然車隊裡有內賊。這些攻擊的目的是什麼？為了奪取價值連城的財物？還是要復仇雪恨，取某個人的項上人頭？\n \n\n史密斯這才發現，貴族少爺厄曼威不是別人，正是聖女/惡魔夫婦的小兒子，而那個屢屢朝他拋媚眼的奶娘班席克夫人（Lady Balnshik）則是個如假包換的獠牙惡魔，只不過以人形現世。所以這個整天躲在轎子裡嗑藥，滿口不正經垃圾話的傢伙，才是敵人的真正目標？就算他們能平安抵達目的地，濱海之城薩雷希（Salesh-by-the-Sea），還會有什麼危機等著他們呢？這個故事為「史密斯大冒險」做了完美的開場，短短一百頁驚奇不斷，不僅帶出山大王/聖女神話這個核心的劇情設定，也為史密斯和厄曼威的「孽緣」埋下種子。\n \n\n小說的第二部則是個「旅館謀殺案」。話說史密斯等人到了薩雷西之後，陰錯陽差被吊銷執照，全車隊的人都面臨失業，幸好厄曼威出手相助，買下一座破爛房屋，交給他們重新裝潢，改建成「麗景旅館」（Grandview Hotel）。史密斯充當旅館主人，手藝非凡的史密斯夫人兼任餐廳主廚，一票車伕變成行李搬運工，「燒得亮」小妹妹就成了旅館專屬的信差。\n \n\n正值薩雷希一年一度的狂歡嘉年華，每年到了這時候，眾人都會瘋狂飲酒作樂，見了人的第一句問候語是「祝您交媾愉快！」（Joyous Coupling!）。就在這個時候，一個專門寫名人八卦傳記的小報記者入住酒店，卻在當天晚上死於房間裡，顯然是被人下毒。就在這青黃不接的時候，城市的官方代表還來檢查旅館的排水系統、公共安全設施，結果偏偏碰上死人，史密斯只好扮起偵探，試圖查出命案的兇手。\n \n\n而專門幫倒忙的厄曼威少爺又在此時翩翩駕到，還帶了四個彪形大漢保鏢，他們通通都是惡魔，名字分別是「阿砍」、「阿捅」、「阿絞」和「阿轟」。原來他跟某個魔法師結了仇，對方揚言要找他單挑，小少爺不想面對，就跑來麗景旅館避避風頭，還帶了私人醫生，也就是他老媽/聖女的忠實信徒，延追人「柳枝先生」（Willowspear）。\n \n\n人究竟是誰殺的？厄曼威與魔法師的對決會如何收場？麗景旅館是否前途堪慮？在一連串歡樂和混亂之中，貝克已經悄然佈局，在看似幽默和鬧劇的故事裡帶入了宗教、種族、環保等議題，大大增加了故事的深度。\n \n\n小說的第三部是一個航海冒險故事，也將劇情帶往更高的層次。「山大王」和聖女雙雙登場，厄曼威的哥哥姊姊、延追激進宗教份子、海邊聖地的土地開發案、史密斯的身世之謎、還有攸關太陽之子前途的滅絕危機，都將在此獲得解答。\n \n\n《史密斯計畫》出版五年後，貝克推出了《雄鹿之家》（The House of the Stag），講述「山大王」與聖女的故事，算是一部前傳。這本書獲得世界奇幻文學獎提名，而本系列的第三本書《河鳥號歷險記》（The Bird of the River）則在貝克過世後出版。", "summary": "介紹奇幻喜劇小說《史密斯計畫》，作者凱姬‧貝克以幽默筆調刻畫退休殺手與貴族少爺的冒險，以類型混搭見長。", "tags": {"type": ["書介/書訊"], "genre": ["奇幻"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "一封寫給奇幻冒險故事的情書：《戰龍之途》", "date": "2013-01-15", "year": 2013, "body": "本文為《戰龍之途》中文版導讀（奇幻基地，1/29/2013 出版）\n\n如果奇幻文壇是一座學校，丹尼爾‧艾伯罕肯定是個品學兼優的模範生。這位住在新墨西哥州的寫作者過去六年間出版了十二本長篇小說，橫跨史詩奇幻、都會奇幻和太空歌劇等類型，同時還寫短篇、漫畫劇本，甚至「偷偷」寫了三本犯罪小說。他的產量雖大，品質卻一點也不馬虎，不論是挑戰類型或向傳統致敬，獨立創作或與人合寫，都游刃有餘，也因此贏得讀者和評論家的一致喜愛。\n\n不同於布蘭登‧山德森或派崔克‧羅斯弗斯以長篇迅速成名，艾伯罕走的是幻想文類的老路：參加寫作班、從雜誌投稿短篇開始累積經驗，練筆十年後才年出版第一部長篇《夏日的身影》（A Shadow in Summer），與其後《冬日的背叛》（A Betrayal in Winter）、《秋日的戰火》（An Autumn War）和《春日的代價》（The Price of Spring）合稱「漫長的代價」四部曲（The Long Price Quartet）。這套書算是他對史詩奇幻的一次反叛：背景設定饒富東方色彩（而非傳統的中古歐洲），篇幅精簡（每本僅三百頁）、故事各自獨立、重視人物刻畫，與市面上其他作品相比，更顯得寧靜內斂，詩意盎然\n\n同時，艾伯罕還用漢諾瓦（M.L.N. Hanover）的筆名都會奇幻系列「黑太陽的女兒」（The Black Sun’s Daughter），又與喬治‧馬汀的助理合作，以詹姆斯‧柯瑞（James S. A. Corey）的筆名發表科幻小說「蒼穹無盡」（The Expanse），首部曲《巨獸甦醒》（Leviathan Wakes）便獲得雨果獎和軌跡獎雙料提名。\n\n「刀光錢影」是艾伯罕構思多年的作品，靈感來自多年前的一次作家對話。他和同樣住在新墨西哥州的喬治‧馬丁、史德林（S.M. Stirling）、瑪琳達‧史諾葛拉斯（Melinda Snodgrass）和瓦特‧瓊恩‧威廉斯（Walter Jon Williams）等人是多年文友，該次對話的主題即是史詩奇幻，眾人自由發言，共同探討對這個文類的看法和喜愛原因。\n\n藉由這次對話與辯論，艾伯罕釐清了他對史詩奇幻的種種觀點，例如這是一個「懷舊」的文類，故事往往發生在一個黃金年代已經逝去之後；又如這是一個不斷與前作對話的文類，絕大多數近代史詩奇幻均源自於對托爾金《魔戒》的致敬或反動：沒有《魔戒》，當然就不會有泰瑞‧布魯克斯那無趣的《夏那拉之劍》，但顯然也不會有史蒂芬‧唐納森的「莫信者傳奇」（The Chronicles of Thomas Covenant the Unbeliever），而沒有「莫信者」的反英雄形象，或許就不會有「冰與火之歌」。\n \n\n艾伯罕的奇幻啟蒙作品是大衛‧艾丁斯的「聖石傳奇」，長大後眼界開闊，難免覺得當初「年少無知」，但經此對話，他明白那種熱烈追捧的激情並沒有錯，同時也立定志願，要寫出一個讓四十歲的自己用同樣熱情追捧的好看作品。在寫給出版社的提案書中，他形容「刀光錢影」是一封「寫給奇幻冒險故事」的情書，其目的在於「讓讀者欲罷不能以致於缺乏睡眠」。\n \n\n身為馬汀的文友和得意門生，艾伯罕自然比任何人都熟悉「冰與火之歌」的精髓。早在「黑太陽的女兒」系列中，他擅寫逆轉結局的高超筆法，便已頗有馬汀之風。他曾與馬汀等人共同創作科幻小說，更多次擔任馬汀作品的漫畫版編劇，包括《熾熱之夢》、中篇〈狼皮交易〉（Skin Trade）和「冰與火之歌」。\n \n\n有了這樣得天獨厚的條件，難怪艾伯罕能寫出進化版的「冰與火之歌」。他完全記取了「冰與火之歌」的教訓，並加以改良。例如視點人物筆法固然很好，但人物一多便很難兜在一起，讀者可能要看一百頁才能看到再次同一個視點人物的章節。所以「刀光錢影」從頭到尾只有五個視點人物，艾伯罕更可以精準地掌控每一集的長度。\n \n\n寫史詩奇幻而沒有長度失控，可見其過人的節制，而我認為「節制」正是艾伯罕與馬汀最大的風格差異。「刀光錢影」是一個相對溫和的「冰與火之歌」，當然後者的魅力之一即在於作者毫不留情的過激筆法，不過並非人人熱愛重口味。在「刀光錢影」中，謀殺、暴力、和性依然時常上演，只是表述方式不那麼露骨。或許有讀者要問，「冰與火之歌」變成輔導級還有什麼看頭？我卻要說，就是在這種看似不慍不火的敘事之中，艾伯罕匠心埋藏的伏筆及轉折才更顯震撼。\n \n\n「刀光錢影」的背景是一個類似歐洲中世紀晚期的架空世界，首部曲《戰龍之途》開始的時候，北方大國安提亞正揮軍南侵，準備將不願乖乖納供的貿易商城瓦奈納入版圖。小說的五位主角，便因為這場戰爭而相遇和相愛、結盟或者結仇，最後影響了整個大陸的命運：少女席絲琳自小失去雙親，受銀行監護撫養長大，因此精通投資和會計，極有生意頭腦，卻老是愛上不該愛的男人。傭兵隊長馬可士本是驍勇善戰的武將，妻女遇害之後浪跡四方，擔任商隊的保鏢混口飯吃；葛德出身安提亞小貴族家庭，是個肥胖的書呆子，最大心願就是研究古代史料，卻身不由己捲入一場空前政爭；道森‧凱廉男爵是安提亞的重臣，為人剛正不阿、尊奉傳統，排拒宮廷中反對勢力所主導的農民議會法案，認為下人永遠不應該當家；凱廉男爵夫人克萊拉是個典型的貴族妻子，性格溫婉、心思敏銳，從無政治野心，只期望能替道森分憂解勞，最在乎的莫過於保護在戰場殺敵的兒子，以及家族的名譽。\n \n\n除了五個視點人物，故事中最重要的配角是個名叫基特師傅的戲班主人，他帶領一票年輕演員走南闖北，似乎具有洞察人心的特異功能。《戰龍之途》一開始，馬可士的手下因酒醉鬧事被抓去充軍，正愁沒人手完成護衛商隊的任務，就碰上了基特師傅的戲班子。馬可士索性聘用他們假扮傭兵，反正只是運些平常的貨，根本值不了幾個錢，但他作夢都沒想到，商隊裡有個木訥寡言的少年，趕著一輛驢車，車上竟暗藏了瓦奈全城的財富。這個「少年」不是別人，正是被銀行撫養長大的席絲琳。眼看安提亞大軍逼近，城破在即，行長不願借錢給必敗的城主僱請傭兵，又怕資產被戰火波及，遂決定把珠寶和帳冊連夜送出去。本來負責駕車的人被城中警衛藉故殺死，行長只好讓席絲琳女扮男裝，接下這個重任。\n \n\n隨著故事進展，我們會逐漸發現這個世界的古代歷史。正如恐龍曾經稱霸地球，「刀光錢影」的世界也曾為巨龍所統治。牠們具有強大的魔力，能夠超脫空間與時間的限制，信手便能塑造出驚人的神器、宏偉的建築。龍族創造人類，作為供其差遣的奴隸種族，更從中造出十三種變體，也就是現今世上的十三人種：為數最多的人類原型「原血人」、削瘦白膚的錫內人、身形壯碩長有兩根彎彎獠牙的戰士種族耶姆人、全身被黑鱗覆蓋的提辛內人、長著一對招風耳的特拉古人，還有神秘的水生種族「溺人」。\n\n龍族早已絕跡多年，現在世界是屬於十三人種的，但是龍族究竟為何絕跡，十三人種之間又有什麼樣的族群矛盾，這才是重點。傳統奇幻小說總會有龍、也會有精靈矮人等種族，艾伯罕則在「刀光錢影」中創造了獨特的龍族神話，以及帶有幾分科幻色彩的不同種族。\n\n《戰龍之途》是「刀光錢影」五部曲的完美開場，艾伯罕大膽引進銀行和金融業的題材，讓女主角席絲琳縱橫商場、大出風頭，但又賦予她渴望被愛、反而情場失意的弱點。馬可士集劍俠、傭兵和浪客於一身，對席絲琳來說既是父親形象，又是遙不可及的戀人，有如基度山伯爵加上《魔戒》裡的亞拉岡。熟讀「冰與火之歌」的讀者，肯定能從葛德身上看到山姆威爾‧塔利和「小惡魔」提利昂的影子，他的轉變與崛起深具悲劇色彩，也是一次對霸凌和復仇的審視。這個看似只有「人」的故事，會在續集中漸漸染上超自然的奇幻色彩，如重返人間的蜘蛛邪教，傳說中仍在大地深處沉睡的巨龍，以及十三人種的秘密。", "summary": "為《戰龍之途》撰寫的中文版導讀，介紹丹尼爾‧艾伯罕橫跨多種類型的多產創作歷程，以及本書作為史詩奇幻的文學特質。", "tags": {"type": ["導讀"], "genre": ["奇幻"], "growth": ["閱讀體驗", "情感流露"], "era": ["版權輸入"]}}, {"title": "生與死的最短距離：《惡女心事》", "date": "2013-03-28", "year": 2013, "body": "版權書訊>文學類>懸疑小說\n\nRECONSTRUCTING AMELIA by Kimberly McCreight 版權狀況：已售出繁體中文版權\n\n《惡女心事》是 2013 年春季最受矚目的心理懸疑小說，書還沒出版，便被《娛樂週刊》譽為是「今年的《控制》（Gone Girl）」，而且「肯定要名列年度好書之林」。這本書是金柏莉．麥克雷的第一部小說，2012 年倫敦書展前夕引起國際矚目，在文學經紀人瑪俐．盧索夫（Marly Rusoff）的操盤下，由 HarperCollins 編輯總監克萊兒．魏可丹（Claire Wachtel）以超過五十萬美金的高價簽下，集團總裁強納森．伯恩罕（Jonathan Burnham）讀過書稿更是愛不釋手，還曾親自致電作者，最終促成這筆交易。\n\n魏可丹不僅是丹尼斯．勒翰等天王級作者的御用編輯，更是《別相信任何人》在美國大賣的幕後推手。她將《惡女心事》列為今年四月的精裝小說重點書，認為此書結合了茱迪．皮考特的道德議題和塔娜．法蘭琪的文學懸疑特色。海外版權也已經賣出英國、德國、巴西、法國、韓國、台灣等國。\n\n《惡女心事》一開始，單親媽媽凱特正在開一場重要的業務會議。她是紐約著名大律師事務所的律師，為了爭取難纏的客戶傷透腦筋。就在會議進行不順，對方面露不悅之色的時候，秘書居然進來通知凱特，她有一通非接不可的電話。這通電話來自女兒艾梅麗雅的學校，校長表示她犯錯被停學，請凱特立刻去學校接她。凱特情非得已，只好倉皇離開會議，搭地鐵趕往女兒位於布魯克林的高級私立學校。這所學校素以學風自由著稱，甚至沒有必修必選的課程，而女兒向來也循規蹈矩，愛看書也愛運動，怎會闖下如此大禍？\n \n\n等凱特好不容易趕到學校，卻只見警車、救護車、消防車擠滿現場，並得知女兒墜樓身亡，校方說她英文課報告作弊被逮，因此畏罪自殺。\n \n喪禮過後一個月，凱特無法面對獨守空屋的寂寞，決定重回職場，不料就在她剛進到辦公室後不久，她收到一則匿名的手機簡訊：「艾梅麗雅沒有跳樓。」\n \n\n這則簡訊有如青天霹靂，把凱特從喪女的哀傷之中拉回現實，正視女兒死亡的諸多疑點。艾梅麗雅從小嗜讀成性，尤其喜歡維吉尼亞．吳爾芙，《燈塔行》一書她讀了不下十遍，以此為題寫報告，怎會需要作弊？更何況英文老師還是她的偶像！警方說艾梅麗雅留下遺書，以此作為自殺的證據，但那只不過是樓頂潦草的一句「對不起」，連字跡都未必是她的。\n \n\n凱特解開女兒 iPhone 的密碼，發現幾千條簡訊，而其中往來最頻繁的，就是一名謎樣的男孩「班」，兩人幾乎每時每刻都在互傳消息，但這個遠在上紐約州鄉下的男孩，與女兒的死究竟有什麼關連？\n \n\n本書作者金柏莉．麥克雷以雙線並行的手法，一邊寫凱特調查女兒死亡的謎團，一邊回到事發之前幾個月，從艾梅麗雅的觀點闡述真相，同時摻雜簡訊、email 和臉書動態，拼湊出一幅令人戰慄的圖像。\n \n\n艾梅麗雅的書桌抽屜裡，為何塞滿了二十幾張筆跡各異的字條，上面都寫著恐怖的「我恨你」？她在死前不久反覆追問自己的爸爸是誰，究竟是單純好奇，還是背後有不為人知的壓力？據說學校裡有兩大秘密結社，分別是女生的「喜鵲幫」（The Magpies）和男生的「狼頭會」（Wolf Head），他們有著何等惡意妄為的入會儀式，年復一年讓新生苦不堪言，卻依然奉命行事，只因為不敢面對隨抗命而來的全面霸凌？\n \n\n麥克雷自己就住在布魯克林，她雖然有著幸福的婚姻和兩名健康快樂的孩子，但每回她在街頭目睹警車或救護車，仍難免心跳加快，害怕意外與自己的骨肉有關。當她一次次讀到正值青春年華的孩子選擇結束生命，而關愛他們的親友就在身旁，卻完全無能為力，甚至絲毫不察情況有異，她決定以此為題，寫下「惡女心事」這部小說，探討成長與背叛、秘密初戀和變質的友情，以及校園霸凌（英文，精裝，Harper，ISBN: 006222543X，400pp，4/13）。", "summary": "介紹心理懸疑小說《惡女心事》，以母親調查女兒自殺真相為主線，融合社群媒體霸凌議題。出版前已被譽為「今年的《控制》」，售出繁體中文版權。", "tags": {"type": ["書介/書訊"], "genre": ["懸疑/驚悚"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "紐約移民的魔幻寓言：《魔像與精靈》", "date": "2013-04-01", "year": 2013, "body": "版權書訊>文學類>文學/奇幻小說\n\nTHE GOLEM AND THE JINNI by Helene Wecker \n\n《魔像與精靈》是今年五月即將在美國出版的新人小說，作者巧妙融合了魔幻寓言、移民文學、歷史小說等元素，敘述一個來自波蘭猶太人社群的魔像（golem）和一個曾經活躍於古老敘利亞、卻因故被囚禁在瓶子裡的精靈（jinni），因緣巧合來到十九世紀末的紐約，被迫加入這個民族的大熔爐，同時又要掩人耳目，以免自己的真實身份被發現。\n \n\n我最早是在兩年前接到這本書的消息，那是 2011 年倫敦書展的前夕。美國知名文學經紀人山姆．史托洛夫（Sam Stoloff）挾著前一年《魔法覺醒》的賣座氣勢，再次推出同樣兼具主流文學和幻想類型的特質的人小說《魔像與精靈》，當時這本書尚未完工，只有一百多頁的稿子，但已經在國際出版圈內引起話題。\n\n一轉眼兩年過去，《魔像與精靈》已賣出英國、德國、法國、荷蘭、義大利、波蘭、挪威、以色列和土耳其版權，被出版者週刊選為 2013 年春季最值得期待的新人作品之一，同時也獲選獨立書商協會五月 #2 IndieNext 選書和亞瑪遜四月編輯嚴選推薦。業界紛紛以《夜行馬戲團》和《英倫魔法師》等書來形容這本書的跨界魔幻魅力。我則是想到了《美國眾神》的舊世界神話與新世界「適應不良」所衍生出的精彩戲碼，還有《卡瓦利與克雷的神奇冒險》的紐約移民夢。\n \n\n故事中的魔像叫做莎瓦（Chava），主人是波蘭小城的商人之子，這位紈褲子弟在雙親過世之後沒多久便散盡為數不多的家財，又因為長相其貌不揚，想找老婆也徒勞無功。於是他帶著最後的財產去找森林裡一位惡名昭彰的隱士，請他施展猶太教的卡巴拉秘術，創造出一名女性魔像當他的妻子，並且打算帶著魔像遠走高飛，搭船到美國去。\n \n\n莎瓦的主人在航行途中忍不住想看看自己的「妻子」是什麼模樣，便在陰暗隱密的貨艙裡，依照隱士的指示，唸出啟動魔像的咒語，不料他隱忍多日的腹痛在這時發作，醫生診斷後發現是盲腸炎，當即開刀，卻來不及拯救他的性命。這個倒楣的傢伙還沒機會和魔像講上幾句話，就這麼魂歸西天了。\n \n\n魔像最初被創造出來的目的就是為主人服務，她才來到世上幾分鐘，居然就沒了主人，頓失所依的魔像空有女人的外表，卻不知要如何生存下去。她更發現自己具有心靈感知能力，能夠「共感」周遭人類的心思，因此船艙裡人們的各種慾念如潮水般向她湧來，險些就要把她淹沒。\n \n\n就在這時，船隻駛抵紐約，眾人皆須先登上埃利斯島（Ellis Island），接受海關查驗，同時通過體檢，方得以進入紐約。魔像既無船票（當初她是被主人裝在大箱子裡運上船的），又「死了老公」，船上眾人面面相覷，不知該拿她怎麼辦才好。魔像靈機一動，隨即縱身跳入海中，就這麼沿著海底一路走進紐約...\n \n\n精靈叫做阿瑪德（Ahmad），是誕生於火與沙的神祕種族，能夠任意改變形貌，甚至進入人類的夢境。他的故鄉是古老的敘利亞，精靈和人類維持著一種微妙的共生關係。阿瑪德最後的記憶，是自己暗中尾隨一組人類商隊，聽他們入夜扎營後的漫談與歡笑。當他再次醒來，竟然已經是千年以後，自己被生鐵禁錮於人形，關在一只黃銅瓶中，若不是因為錫匠阿比利受託修復這個「祖傳」的瓶子，也不會意外敲開瓶蓋，釋放阿瑪德。\n \n\n莎瓦和阿瑪德就這麼被困在世紀之交的紐約。莎瓦被一名年邁的猶太拉比梅爾收留，阿瑪德則寄居於錫匠阿比利的工作坊。他們既要想辦法融入人群，又不能讓人發現自己的真實身份。伴隨他們的是移民社群裡形形色色的人物：睿智的咖啡館老闆娘、獨來獨往的冰淇淋販子、梅爾拉比那經營猶太收容所的姪子麥可，充滿冒險情懷的社交名媛蘇菲雅，還有野心勃勃的神祕男子約瑟夫。\n \n\n魔像與精靈在這個風華正盛的歷史舞台上巧遇，各自背負著詛咒和苦難，在這片新天地裡尋找希望和容身之處。一場世紀風暴隱隱成形，即將改變所有紐約客的命運，也逼使莎瓦和阿瑪德做出最艱難的抉擇......（英文，精裝，Harper，0062110837，496pp，4/13）", "summary": "介紹奇幻新人小說《魔像與精靈》，以十九世紀末紐約為背景，融合猶太與阿拉伯神話，探討移民身份認同。書還未出版即受矚目。", "tags": {"type": ["書介/書訊"], "genre": ["奇幻", "文學小說"], "growth": ["閱讀體驗"], "era": ["版權輸入"]}}, {"title": "如果在未來，一座地下碉堡：《羊毛記》", "date": "2013-05-05", "year": 2013, "body": "版權書訊>文學類>科幻小說\n\nWOOL by Hugh Howey 版權狀況：已售出繁簡中文版權\n\n這幾年電子書在美國呈爆炸性成長，最大的推手自然是亞瑪遜。藉由賠錢賣書的策略，他們成功換取 Kindle 閱讀器普及率迅速成長，稱霸了電子閱讀器市場。現在美國暢銷新書的電子版銷量，已經可以佔總銷量的二到三成。\n\n除了販售紙本書的電子版，亞瑪遜也積極介入出版，設計出方便好用的電子出版機制（KDP, Kindle Direct Publishing），鼓勵素人作家直接出書。過去自費出版還得花錢印書，成本高昂，後來雖有 POD（Print on Demand, 按需印書）科技大幅減少先期的印製成本，但還是比不上直接出電子書免費又迅速。\n\n於是我們聽到越來越多被出版社和文學經紀人拒於門外的作家，靠著電子書累積口碑和人氣，加上適當的網路行銷，創造了十幾萬冊的驚人銷量，再反過來高價賣出紙本版權，一齣齣有如美國夢的成功故事。比如說伯伊德．莫理森把《方舟浩劫》放在網站上讓人免費下載，若是讀了喜歡，可再用非常低廉的價錢去亞瑪遜買 Kindle 版以表支持，結果一炮而紅，如今這本書已經被翻譯成二十餘種語言，在全球各地出版。\n\n不過那已經是 2009 年的「陳年往事」。免費下載在當年是新穎的促銷手段，現在則已經成為 KDP 機制的一環。只要作者透過亞瑪遜獨家出版（即參與他們的 KDP Select 計畫），就能擁有五天讓書「免費」的權力，而如何把這消息有效傳遞給潛在讀者，更是一門學問。\n\n各種 Kindle 選書網站於是應運而生，每天發佈免費電子書消息，並做初步的篩選和推薦。如果能被這些網站報導，一本書的下載次數立刻水漲船高。除此之外，亞瑪遜獨家出版的電子書，還能讓所有的付費高級會員（Prime Member）租借，作者收入則經由借閱次數來計算。\n\n原創電子書最受讀者歡迎的不外兩個類型：犯罪驚悚和女性小說。前者發展最成熟、也最能夠男女通吃，後者則針對原本就是小說閱讀主力的女性族群，大致還可以分為兩大類，一是《姊妹》或茱迪．皮考特式的「讀書會小說」，較偏向主流/女性小說；二當然就是羅曼史，不論是超自然系、歷史系還是更重口味的情色小說（例如最近爆紅的「格雷的五十道陰影」三部曲）。\n\n但是為何沒有科幻/奇幻小說經由電子書走紅的例子？按理說，科幻讀者對新科技的接受度應該最高，早就應該人手一台 Kindle、智慧型手機或平板電腦，絕對也願意看/買電子書，難道說科幻/奇幻讀者只買已經有紙本書的電子版，沒有「冒險精神」嘗試原創電子書，甚或其中沒有值得一看的作品嗎？\n\n這個問題，終於隨著休豪伊的《羊毛記》而得到解答。此君現年三十七歲，當初也被出版社和文學經紀人拒於門外，遂走上自費出版一途。2011 年七月，他發表了一個中短篇（novelette, 比「中篇小說」novella 更短，但比短篇小說長，是科幻雜誌界常用的一個單位），叫做〈羊毛〉（Wool）。\n\n這個故事僅一萬兩千字，設定在未來，由於地表滿目瘡痍，毒氣瀰漫，人類早已避居地底，開鑿出有如蟻穴般的巨大地堡（silo），共有一百多層，裡面分工嚴密，有警察、有維持發電機運轉的技工、有負責網路資訊的 IT 部門，有透過生長光種植蔬果的農業部門。因為資源有限，地堡裡只能維持固定人數，若沒有人死，任何夫妻都不能生小孩，而且誰生還要經由樂透式的抽籤來決定。\n\n地堡裡最大的禁忌，就是不能談論任何與「出去」有關的事，這比欺君犯上還要嚴重，結果是唯一死刑，處刑的方式就是把罪犯送出地堡。送出去幹嘛？答案是「清掃」（cleaning），因為地堡最頂樓有監視外界的攝影機，長年飽經風沙，需要有人出去清掃。死刑犯會穿上最先進的防護衣，手持羊毛刷子，外出擦拭攝影機鏡頭。由於空氣中的毒素太強，任何防護衣都撐不了多久，所以這些清掃工通常走不了多遠就會死亡。\n\n〈羊毛〉的主角是地堡中維持秩序和法律的警長霍斯頓（Holston）。小說一開頭便描述他步履沉重地走上一層層螺旋梯，來到警長辦公室，直接走進牢房，把自己上鎖，然後把鑰匙交給副警長，說自己要出去。霍斯頓為什麼要出去？因為他的妻子愛莉森三年前突然發瘋，嚷著要出去，他身為警長，只得親自執行妻子的死刑。三年來他時時刻刻都在思索妻子發瘋的原因，不分晝夜研究愛莉森生前最後的文件，發現了驚人的秘密，於是決定跟隨她的腳步。碉堡外面究竟是什麼模樣？這一切究竟是真實還是謊言？小說從霍斯頓走向死亡開頭，以他走出碉堡，終於在毒氣中倒下結束。\n\n豪伊寫這個故事，原本只是為了哀悼親人的死亡，沒有多加宣傳，更沒有考慮過要寫成系列。他的寫作主力還是「茉莉．費德歷險記」（Molly Fyde），一系列描述少女茉莉繼承了老爸的太空船，在星際中到處闖蕩的長篇小說，目前已出版了兩部。但是「羊毛」這個設定顯然有太多故事可說，字裡行間濃濃的哀傷色彩讓人讀後難忘，希望/絕望的反差更引人深思。〈羊毛〉逐漸在讀者群中流傳開來，很多人寫書評讚揚，更多人跑去豪伊的網站留言，喊著要看續集。\n\n在讀者的敲碗聲中，豪伊終於在四個月後推出續集〈標準規格〉（Proper Gauge），長度整整增加一倍，接近兩萬四千字。這次的主角換成地堡的「市長」瑪莉．強斯（Marie Jahns）和副警長馬涅斯（Marnes），他們為了尋找霍斯頓的繼任者，從碉堡頂樓走到最底層的機械部，探訪一個性格強悍又聰穎過人的女子茱莉葉。碉堡共分三區，每區四十八層樓，總共一百四十四層樓。這對一般人來說或許不是什麼大問題，但對年過六十的老市長和副警長來說，可就是一場漫長的旅途了，更何況下樓之後還得上樓。\n\n從水平到垂直，〈標準規格〉把文學中的「旅行」做了九十度的翻轉，帶領讀者進入碉堡深處，仔細觀察其中自成一格的運轉機制，也瞥見了危機四伏的政治暗流，在揭露謎底的同時拋出更多問題：為何茱莉葉年紀輕輕便離開醫生父親，隻身前往底層的機械部，而且二十年來不曾和父親見面？控制網路資訊的 IT 部門主管伯納德（Bernard）為何不等市長命令，便擅自決定要另找警長的繼任人選？馬涅斯為何甘願多年來屈居副手，從來不想擔當警長大任？他和瑪莉死去多年的丈夫又有什麼關係？\n\n〈標準規格〉寫兩個老人上下樓梯的旅行，簡直與所有暢銷書法則背道而馳，但寫得好看極了。豪伊的文字細膩而優美，步調沉緩，心理刻畫深入，且擅用文學隱喻的技巧。比如說書名「羊毛」有三重意思，表面上當然是指清潔者的羊毛刷，但也暗指英文諺語中「眼睛蒙上羊毛」（類似中文「掩耳盜鈴」），更象徵地堡中人有如一群乖巧的綿羊，成群結隊被人趕來趕去，沒有獨立思考的意志。豪伊認為自己的作品不著重科學，與其說是科幻，更像是「未來小說」（future fiction），關注的仍然是人性，而「羊毛」系列濃厚的文學性，灰暗中仍有希望的末世色彩，也讓人想起麥卡錫的《長路》。\n\n但就在你沉浸於豪伊文字魅力的時候，他往往不動聲色讓故事來個大轉彎，讓讀者屢屢目瞪口呆。〈標準規格〉以茱莉葉修復發電機，同時決定接任警長一職作結，但另一個更大的陰謀才要展開（在此就不爆雷了），讀者完全想不到會如此收場，恨不得立刻看到後面的故事。\n\n豪伊似乎也寫出興致了，他火力全開，兩週後再推第三集〈放逐〉（Casting Off），長度兩萬八千字，由年輕的警長茱莉葉挑大樑，「羊毛」的故事這才算進入主線。她一邊要偵辦某重要人物的死亡疑雲，一邊要適應地堡頂部截然不同的生活，同時試圖找出驅使霍斯頓夫妻選擇死亡的真相。男主角魯卡斯（Lukas）也初次登場，他每天晚上到餐廳看星星，透過外部攝影機傳進來的螢幕，勾勒天空星座移動的軌跡，與大他十歲的茱莉葉發展出一段隱約的曖昧情愫。\n\n2011 年十二月初，豪伊發表第四集〈崩解〉（The Unraveling），長度三萬八千字。今年一月，他出版完結篇〈漂流〉（The Stranded），已是近六萬字的完整長篇。除了各集單獨販售，他還推出合訂本，五集總長十五萬字，完全就是一部大長篇的架構，Kindle 版僅售 6.99 美金。\n\n三月二日，超人氣部落格BoingBoing刊出《羊毛記》短評，正式引爆此書的全球熱潮，不僅當場把它送上亞瑪遜電子書總榜 #62，科幻類冠軍，甚至擊敗喬治馬汀的《與龍共舞》。到目前為止，《羊毛記》已經累積了七百多篇亞瑪遜讀者書評，五顆星評價比例高達 95%，而且依然高居科幻類排行榜前五名，可謂史無前例。\n\n網路爆紅當然引來了傳統出版界和電影圈的關注。這時，一位女性讀者把〈羊毛〉推薦給女兒，女兒在一家文學經紀公司上班，專門負責處理合約，她讀了以後非常喜歡，立刻推薦給老闆。她就是新生代文學經紀人克莉絲汀．尼爾森（Kristin Nelson），旗下作家包括《悲喜邊緣的旅館》傑米．福特、《神偷少女》艾莉．卡特和《印度生死戀》雪麗．湯瑪斯。\n\n尼爾森簽下豪伊的代理權後，把《羊毛記》發給美國各大出版社，得到的回應卻令人啼笑皆非。有人覺得這書已經賣得很好，所有想看的人都買了，所以出紙本書不會賣。有人覺得可以一試，但書名一定要改，因為叫「羊毛」太奇怪。還有人說書中主角一直死太詭異了（是沒看過《冰與火之歌》嗎？）。有幾家出版社開價想買，但預付版稅連豪伊賣電子書所得的三分之一都不到。\n\n曾經豪伊也和其他初出茅廬的作者一樣，千方百計想得到這些編輯的青睞，如今他卻發現自己根本不需要他們，因為他已經有了一群忠實的讀者，而讀者的口碑正是最強有力的廣告。\n\n有科幻作家/部落客撰文分析《羊毛記》的成功原因，認為它回歸了科幻小說最初的形式，那就是上世紀初刊登在廉價雜誌的中短篇作品。由於定價低廉、長度適中，讀者很快就能看完〈羊毛〉，而且覺得錢花得很值得。比起同樣 0.99 美金，可是買到十萬字的長篇垃圾，看一個中短篇顯然更讓人開心。豪伊逐步揭露謎團，安排更多的情節轉折，吸引讀者進入地底碉堡世界，事後看來是極其高明的行銷手法，實際上卻是無心插柳，因為他根本沒有想過要寫系列。\n\n我在收到書稿的當天就看完了〈羊毛〉，隔天陪老婆外出上課，我就窩在附近的肯德基，花了四個多小時一口氣〈標準規格〉和〈放逐〉，只能用無比震撼和欲罷不能來形容。閱讀過程中我不時覺得這是了不起的文學作品，不只是類型趣味，同時腦中又不斷浮現「陰屍路」和「Lost 檔案」等影集，以及「異塵餘生」（Fallout）的遊戲畫面。\n\n當科幻雜誌逐漸凋零，中短篇小說的發表園地是否會轉移到電子書？這還有待時間的檢驗，不過，至少現在我們有《羊毛記》這樣的好作品可讀，還有豪伊這樣認真努力的好作家可以期待。除了「茉莉．費德」和《羊毛記》系列，他還有另一部科幻長篇《回家途中》（Half Way Home），堪稱是《蒼蠅王》碰上「異形」，已經引起多家電影公司興趣，上週又得到 BoingBoing 部落格推薦，衝上亞瑪遜科幻榜前二十名。\n\n2013 年初，Simon & Schuster 破天荒以六位數重金買下《羊毛記》紙本版權，把電子版權留給豪伊。這在出版史上堪稱前所未見，因為歷來所有自費出版走紅的電子書，倘若重金賣給傳統出版社，絕對是紙本和電子版打包，傳統出版社不可能接受只拿紙本書的條件（因為電子書利潤更高）。說到頭來，S&S 終究是明白了《羊毛記》的市場價值，即便僅出版紙本書，依然能為公司賺進可觀利潤。此舉等於也為出版界立下先例，未來自費出版走紅的獨立創作者將有更大的談判空間，決定是否要走傳統出版的路，抑或堅守純粹的獨立出版。\n\n今年三月，好萊塢大導演雷利史考特與福斯影業聯手買下《羊毛記》電影版權，準備交由「辛德勒的名單」金獎編劇史蒂芬柴里安改編。紙本版在美國和英國盛大推出，推薦者名單一字排開更是嚇死人：有《別相信任何人》的 SJ 華森、《波西傑克森》系列的雷克萊爾頓、還有《末日之旅》的作者加斯汀柯羅寧。截至目前為止，《羊毛記》英文版銷量已經超過 600,000 冊，其中六成以上是電子書，並已賣出全球 22 國版權。", "summary": "介紹美國自出版成功案例《羊毛記》（WOOL），探討電子書革命與亞馬遜崛起，以及自出版作者如何打破傳統出版業生態的現象。", "tags": {"type": ["書介/書訊"], "genre": ["科幻"], "growth": ["產業洞察"], "era": ["電子書革命", "出版業轉型", "版權輸入"]}}, {"title": "學運，羊毛記，我們家", "date": "2014-03-26", "year": 2014, "body": "星期一凌晨四點，起床開手機上網，看到的全是暴力鎮壓學運的事情。那天公司的氣氛很低迷，我一整天的心情也很低落，覺得外頭發生的那麼大的事，自己還在電腦前寫什麼倫敦書展重點書的信，弄合約追封面查付款，簡直是荒謬到超現實了。有種很深很深的無力感，不知道自己能做什麼，對自己的工作產生了懷疑。\n\n中午的時候，看到鸚鵡螺文化的宗琛 po 了一張抗議份子被打得頭破血流的照片，說這就是「羊毛」，透過媒體的力量，蒙上你的眼睛。「這種題材，美國人只不過拿來寫了一本科幻小說，我們的政府玩真的。」看到這段，我好像醒了過來。一種從昏迷或者麻木之中逐漸恢復意識和痛感的甦醒。是了，這就是我工作的意義：在「好看」的大眾娛樂小說和一些更深刻的什麼之間尋找一種平衡。把外國的好書帶進來，然後，把我們的好書帶出去。\n\n上星期法國一家大出版社給我寫信，說想要出版中國青年小說家顏歌的《我們家》。代理這本書的因緣際會也很奇妙。早在八年前剛認識老婆（當時還不是老婆）的時候，就聽她說過顏歌這個名字，她還編過顏歌的一本小說《異獸志》。兩年前北京著名的策展人歐寧來台北，到我們公司聊了很久，說起顏歌的新長篇（當時還不叫《我們家》，叫做《段逸興的一家》，讚不絕口，說那是方言寫作的一大勝利，也是她真正蛻變為成熟小說家的里程碑。\n\n去年六月，我特地請老婆幫忙訂了一本樣書帶來台灣，但也一直沒空看。沒想到八月就收到她的信，說經過譯者 Nicky Harman（就是《金山》的英譯者）介紹，想找我代理，而且 Nicky 已經翻譯好精彩的英文樣章，也寫了一篇審讀報告。我連忙翻出樣書，週末一口氣讀完，喜歡極了，當下就決定來推這本書的版權。\n\n法蘭克福書展上，我們向很多外國出版社介紹這本小說，也確實有不少人登記興趣，可是版權輸出往往需要一個契機，比如說某一個國家先簽下了，或者有一個重大事件發生了。總得先有星火，然後才能燎原。難就難在你永遠不知道這個星火何時才能點燃。你只能盡一切的努力，用所有的管道和資源和人脈去推薦，讓資訊盡可能地擴散和傳播出去，然後祈禱某天一切都對了，天時地利人和，when the stars are right，就引爆了。\n\n有了法國出版社簽約的意向，我隱約覺得是個契機，便重新整理了書訊，發給各國代理，同時也發給書探（這是從 出版經紀及版權人才研習營 的課程裡學來的，所以我可以證明這活動真的有用！）。短短一個小時內，有三位很重量級的英美書探便回信說他們很喜歡這本書。品味極好向來對文字非常挑剔的美國經紀人朋友，讀了以後也愛不釋手，同意幫我代理美國版權。\n\n三天後，匈牙利的老牌文學出版社 Europa 提出 offer，簽下了這本書全球第一筆外語版權。匈牙利！\n\n昨天下班前，德國 Heyne 出版社編輯 Anke Goebel 打了越洋電話過來，，說她和同事看了《我們家》的英文樣章，都非常喜歡，覺得很快就能進入故事，主角很爆笑很有趣，會吸引人往下看，考慮想要 pre-empt 搶下德文版權。我問她從何得知這本書，她說先是上週書探推薦，又從我的德國代理那邊收到資料，然後笑說：「哼，你當初就是這麼計畫的對吧？」\n\n我和 Anke 是在 2010 年法蘭克福書展的版權研習營（Fellowship）認識的。當年她剛辭去原本出版社的工作，搬到慕尼黑加入藍燈書屋集團旗下的 Heyne 出版社。這幾年來我們常在書展上或者聚餐場合見面，最常聊的是情色小說，因為她也是德文版《謎情柯洛斯》的編輯。\n\nHeyne 是德國最厲害的平裝書出版社之一，主力是各種犯罪驚悚小說和奇幻科幻小說，當然也有女性小說和羅曼史。姊妹品牌 Diana 則是精裝主力，是所謂的「高端大眾文學」（upmarket）出版社，也就是說不那麼純文學，但也不是純粹的通俗小說。《我們家》可說是正好落在他們的守備範圍：有純文學的語言和質地，又有大眾小說的閱讀趣味。\n\n兩小時之後，她果真發來報價，而且是一個很棒的報價。要知道德國雖然是歐洲最大也最活躍的翻譯書市場，但始終鮮少出版中國文學（台灣就更不用說了），唯獨偏愛中國異議或流亡人士的各種自傳或回憶錄。我經手過的海外授權有二十幾國，往往只有德國缺席。\n\n臨睡前和德國代理通完電話，確定接受 Heyne 的報價，興奮之餘也再三感嘆做中書外譯的有心栽花和無心插柳。那是多少的漫長等待，多少的煞費苦心而徒勞無功，但或許或許，你在這裡彎腰播種的，終會在別處含笑收割。\n\n所以，請所有的創作者，繼續寫吧！寫下島內或者島外的故事，寫下屬於我們的獨一無二的故事，然後，我會讓他們被世界看到。", "summary": "太陽花學運期間，在社會動盪帶來的無力感中重新確立出版工作的意義。同步記錄中國小說家顏歌《我們家》的版權輸出歷程，相繼賣出法國、匈牙利、德國版權。", "tags": {"type": ["個人隨筆"], "genre": ["文學小說"], "growth": ["工作意義", "情感流露", "世界觀察"], "era": ["版權輸出", "台灣社會事件"]}}];

// ── State ─────────────────────────────────────────────────────────────────────
let active = {type:new Set(),genre:new Set(),growth:new Set(),era:new Set()};
let activeYear = null, searchQ = '';

function allTags(cat){ return [...new Set(ARTICLES.flatMap(a=>a.tags[cat]))].sort() }

function renderChips(id, cat){
  const c = document.getElementById(id);
  allTags(cat).forEach(t=>{
    const el = document.createElement('span');
    el.className = `chip ${cat}`;
    el.textContent = t;
    el.onclick = ()=>{ active[cat].has(t)?active[cat].delete(t):active[cat].add(t); el.classList.toggle('active'); render(); };
    c.appendChild(el);
  });
}

function buildYearNav(){
  const years = [...new Set(ARTICLES.map(a=>a.year))].sort();
  const nav = document.getElementById('year-nav');
  years.forEach(y=>{
    const btn = document.createElement('button');
    btn.className='year-btn'; btn.textContent=y; btn.dataset.year=y;
    btn.onclick=()=>{ activeYear=activeYear===y?null:y; nav.querySelectorAll('.year-btn').forEach(b=>b.classList.toggle('active',b.dataset.year==activeYear)); render(); };
    nav.appendChild(btn);
  });
}

function tagHtml(tags, cats){
  return cats.flatMap(cat=>tags[cat].map(t=>`<span class="tag ${cat}">${t}</span>`)).join('');
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const q = searchQ.toLowerCase();
  let visible = 0;
  ARTICLES.forEach((a,i)=>{
    const pass =
      (!q || a.title.toLowerCase().includes(q) || a.summary.toLowerCase().includes(q) || a.body.toLowerCase().includes(q)) &&
      (!activeYear || a.year==activeYear) &&
      ['type','genre','growth','era'].every(cat=>active[cat].size===0||[...active[cat]].some(t=>a.tags[cat].includes(t)));
    if(!pass) return;
    visible++;
    const card = document.createElement('div');
    card.className='card'; card.onclick=()=>openModal(i);
    const gTags = a.tags.growth.filter(t=>t&&t!=='—');
    card.innerHTML = `
      <div class="card-meta"><span class="card-year">${a.year}</span><span>${a.date}</span></div>
      <div class="card-title">${a.title}</div>
      <div class="card-summary">${a.summary}</div>
      <div class="card-tags">${tagHtml(a.tags,['type','genre','era'])}</div>
      ${gTags.length?`<div class="growth-flag">${gTags.join('・')}</div>`:''}`;
    grid.appendChild(card);
  });
  if(!visible){ const el=document.createElement('div'); el.className='no-results'; el.textContent='沒有符合條件的文章。'; grid.appendChild(el); }
  document.getElementById('visible-count').textContent = visible;
  updateBadge();
}

function openModal(i){
  const a = ARTICLES[i];
  document.getElementById('modal-meta').innerHTML = `<span class="card-year" style="font-family:sans-serif">${a.year}</span>${a.date}`;
  document.getElementById('modal-title').textContent = a.title;
  document.getElementById('modal-tags').innerHTML = tagHtml(a.tags,['type','genre','growth','era']);
  document.getElementById('modal-summary').textContent = a.summary;
  const gTags = a.tags.growth.filter(t=>t&&t!=='—');
  const gb = document.getElementById('modal-growth');
  if(gTags.length){ document.getElementById('modal-growth-text').textContent=gTags.join('・'); gb.style.display='block'; }
  else { gb.style.display='none'; }
  document.getElementById('modal-body').textContent = a.body;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){ if(e.target===document.getElementById('overlay')) closeModalBtn(); }
function closeModalBtn(){ document.getElementById('overlay').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModalBtn(); });

function onSearch(e){ searchQ=e.target.value; render(); }
function toggleFilter(){
  const p=document.getElementById('filter-panel');
  p.classList.toggle('open');
}
function updateBadge(){
  const total=['type','genre','growth','era'].reduce((s,c)=>s+active[c].size,0)+(activeYear?1:0)+(searchQ?1:0);
  const b=document.getElementById('active-badge');
  b.textContent=total+' 個篩選';
  b.classList.toggle('show',total>0);
}
function clearAll(){
  active={type:new Set(),genre:new Set(),growth:new Set(),era:new Set()};
  activeYear=null; searchQ='';
  document.getElementById('search-input').value='';
  document.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.year-btn.active').forEach(b=>b.classList.remove('active'));
  render();
}

function init(){
  renderChips('chips-type','type');
  renderChips('chips-genre','genre');
  renderChips('chips-growth','growth');
  renderChips('chips-era','era');
  buildYearNav();
  // 桌機預設展開，手機預設收起
  if(window.innerWidth > 640){
    document.getElementById('filter-panel').classList.add('open');
  }
  render();
}
</script>
